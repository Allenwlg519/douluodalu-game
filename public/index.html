                <div class="fact"><dt>${state.species === "human" ? "武魂" : "种族本源"}</dt><dd>${spiritText()}</dd></div>
                <div class="fact"><dt>魂力</dt><dd>${c.level}级${c.innatePower !== null ? ` · 先天魂力${c.innatePower}级` : " · 由修为年限换算"}</dd></div>
                <div class="fact"><dt>战斗资源</dt><dd>生命 ${c.hp}/${c.maxHp} · 魂力 ${c.soul}/${c.maxSoul}</dd></div>
                <div class="fact"><dt>精神力</dt><dd>${c.mental}</dd></div>
                <div class="fact"><dt>魅力</dt><dd>${c.charm} · 影响初始态度、好感与战斗交涉</dd></div>
                <div class="fact"><dt>天赋</dt><dd>${(c.talents||[]).map(id=>{const t=TALENTS.find(x=>x.id===id),g=TALENT_GRADES[state.selectedTalentGrades?.[id]||1];return t?`${t.name}·${g.name}`:null;}).filter(Boolean).join("、")||"无"}</dd></div>
                <div class="fact"><dt>魂骨</dt><dd>八个部位均为空</dd></div>
                <div class="fact"><dt>魂导器</dt><dd>${c.soulDevice}</dd></div>
                <div class="fact"><dt>身份序列</dt><dd>${c.identities.map((x, i) => `${i + 1}. ${x}`).join("　")}</dd></div>
              </dl>
            </article>
            <article class="profile-card">
              <h3>属性面板</h3>
              <div class="stat-grid">${Object.entries(c.stats).map(([key, value]) => `<div class="stat-tile"><b>${value}</b><span>${STAT_LABELS[key]}</span></div>`).join("")}<div class="stat-tile"><b>${c.charm}</b><span>魅力</span></div></div>
              <div class="notice" style="margin-top:14px">魂环与魂骨吸收上限由精神力、体质和幸运共同决定。挑战超过建议年限的目标会大幅降低成功率；反噬将直接扣除生命值，生命归零即游戏结束。</div>
            </article>
          </div>
          <div class="actions" style="justify-content:flex-end; margin-top:20px"><button id="rerollBtn">重新随机全部属性</button><button class="primary cta" id="confirmCharacterBtn">确认个人面板并选择时代</button></div>
        </section>`;
      $("#rerollBtn").onclick = () => { state.character = generateCharacter(state.species); applySelectedTalents(); state.character.awakened=true; state.bond = randomInt(12, 38); state.journal.unshift("重新随机了开局属性，并重新结算所选天赋。"); render(); };
      $("#confirmCharacterBtn").onclick = () => {
        c.name = $("#nameInput").value.trim().slice(0, 12) || c.name;
        c.gender = $("#genderInput").value;
        state.journal.unshift(`确认角色：${c.name}。`);
        state.screen = "timeline";
        render();
      };
    }

    function renderTimelineSelect() {
      $("#main").innerHTML = `
        <section class="stage">
          <div class="section-head"><div><div class="step">第五步 / 降临时间</div><h2>选择时代节点</h2><p>历史重大事件会按所选时期展开；高影响选择可以让关键人物、势力和结局彻底偏离原有走向。</p></div></div>
          <div class="card-grid timeline-grid">
            ${Object.entries(TIMELINES).map(([id, t]) => `<button class="timeline-card" data-timeline="${id}"><span class="era">${t.era}</span><strong>${t.name}</strong><p>${t.description}</p><span class="anchors">关键节点：${t.anchors}</span></button>`).join("")}
          </div>
        </section>`;
      document.querySelectorAll("[data-timeline]").forEach((button) => button.onclick = () => startTimeline(button.dataset.timeline));
    }

    function startTimeline(id) {
      state.timelineId = id;
      state.nodeId = TIMELINES[id].start;
      state.screen = "story";
      state.character.identities.push(`${TIMELINES[id].name}降临者`);
      state.journal.unshift(`进入时间节点：${TIMELINES[id].name}。`);
      render();
    }

    function renderStory() {
      const node = STORY[state.nodeId];
      $("#main").innerHTML = `
        <section class="chapter-visual">
          <div class="eyebrow">${esc(TIMELINES[state.timelineId].era)}</div>
          <h2>${esc(node.title)}</h2>
          <p>${esc(node.place)}</p>
          <div class="tag-row">${node.tags.map((tag) => `<span class="tag">${esc(tag)}</span>`).join("")}</div>
        </section>
        <article class="story">${node.text.map((p) => `<p>${esc(p)}</p>`).join("")}</article>
        <div class="choices">${node.choices.map((choice, index) => renderChoice(choice, index)).join("")}</div>`;
      document.querySelectorAll("[data-choice]").forEach((button) => button.onclick = () => chooseStoryOption(Number(button.dataset.choice)));
    }

    function requirementText(require) {
      if (!require) return "";
      const [key, value] = Object.entries(require)[0];
      const label = key === "mental" ? "精神力" : key === "bond" ? "羁绊" : STAT_LABELS[key] || key;
      return `需要${label}${value}`;
    }

    function renderChoice(choice, index) {
      const effectLabels = [];
      for (const [key, value] of Object.entries(choice.effects || {})) {
        const label = key === "level" ? "魂力" : key === "mental" ? "精神" : key === "bond" ? "羁绊" : key === "backlash" ? "生命风险" : key === "age" ? "年龄" : STAT_LABELS[key];
        if (label) effectLabels.push(`${label}${value > 0 ? "+" : ""}${value}`);
      }
      if (choice.require) effectLabels.push(requirementText(choice.require));
      return `<button class="choice" data-choice="${index}"><span><strong>${esc(choice.text)}</strong><small>${esc(choice.hint)}</small></span><span class="cost">${effectLabels.map(esc).join(" · ")}</span></button>`;
    }

    function meets(require) {
      if (!require) return true;
      const c = state.character;
      return Object.entries(require).every(([key, value]) => key === "mental" ? c.mental >= value : key === "bond" ? state.bond >= value : (c.stats[key] ?? 0) >= value);
    }

    function chooseStoryOption(index) {
      const choice = STORY[state.nodeId].choices[index];
      if (!meets(choice.require)) {
        applyBacklash(7, `行动失败：${requirementText(choice.require)}。`);
        toast("条件不足，强行行动引发了魂力反噬。");
        render();
        return;
      }
      applyEffects(choice.effects || {});
      if (choice.identity && !state.character.identities.includes(choice.identity)) state.character.identities.push(choice.identity);
      state.journal.unshift(`选择：${choice.text}`);
      if (choice.ending) {
        state.ending = { title: choice.ending, text: endingText(choice.ending) };
        state.screen = "ending";
      } else state.nodeId = choice.to;
      render();
    }

    function applyEffects(effects) {
      const c = state.character;
      for (const [key, value] of Object.entries(effects)) {
        if (key === "level") gainLevels(value);
        else if (key === "mental") c.mental = clamp(c.mental + value);
        else if (key === "bond") state.bond = clamp(state.bond + value);
        else if (key === "backlash") applyBacklash(value, "剧情行动承受魂力冲击。");
        else if (key === "age") c.age = Math.max(0, c.age + value);
        else if (key in c.stats) c.stats[key] = clamp(c.stats[key] + value);
      }
    }

    function atRingGate() {
      const c = state.character;
      return state.species === "human" && c.level >= 10 && c.rings.length < Math.floor(c.level / 10);
    }

    function gainLevels(amount) {
      const c = state.character;
      for (let i = 0; i < amount; i++) {
        if (state.species === "human" && atRingGate()) {
          state.journal.unshift(`魂力停在${c.level}级：需要吸收第${c.rings.length + 1}魂环。`);
          break;
        }
        if (c.level >= 100) break;
        c.level += 1;
      }
      if (c.level >= 100 && !c.godhood) {
        c.godhood = true;
        c.identities.push("百级神祇");
        state.journal.unshift("魂力抵达百级，神性完成凝聚。");
      }
    }

    function endingText(title) {
      const c = state.character;
      return `${c.name}没有取代原著中的任何人，却在这个时代留下了属于自己的身份：${c.identities.at(-1)}。重大历史仍沿既定方向展开，而被你救下的人、记录下的证据与建立的盟约，成为正史之外真实存在的另一条命途。`;
    }

    function renderEnding() {
      $("#main").innerHTML = `
        <section class="chapter-visual"><div class="eyebrow">时代支线完成</div><h2>${esc(state.ending.title)}</h2><p>${esc(TIMELINES[state.timelineId].name)} · ${esc(state.character.name)}</p></section>
        <article class="story"><p>${esc(state.ending.text)}</p><p>你可以继续在右侧个人面板修炼、尝试魂环与魂骨，也可以返回时代选择体验另一条历史支线。</p></article>
        <div class="choices"><button class="choice primary" id="timelineAgain"><span><strong>返回时代选择</strong><small>保留当前角色与全部成长。</small></span></button><button class="choice" id="newLife"><span><strong>开启全新命格</strong><small>重新选择人类或魂兽并随机属性。</small></span></button></div>`;
      $("#timelineAgain").onclick = () => { state.screen = "timeline"; state.ending = null; render(); };
      $("#newLife").onclick = () => { resetState(); state.screen = "species"; render(); };
    }

    function renderSide() {
      const side = $("#side");
      if (!state.character) {
        side.innerHTML = `<section class="panel"><h3>成长规则</h3><ul class="rule-list"><li>人类六岁觉醒武魂与先天魂力</li><li>每十级需吸收一个魂环</li><li>精神力与体质决定吸收上限</li><li>失败会积累反噬</li><li>九十级可自立封号，百级成神</li></ul></section>`;
        return;
      }
      const c = state.character;
      const title = c.title ? `「${esc(c.title)}」` : state.species === "human" && c.level >= 90 ? "可自立封号" : state.species === "human" ? "魂师之路" : `${c.cultivationYears.toLocaleString()}年修为`;
      side.innerHTML = `
        <section class="panel">
          <h3>个人面板</h3>
          <div class="identity-name">${esc(c.name)} ${c.title ? `<span class="rare">${title}</span>` : ""}</div>
          <div class="identity-meta">${esc(c.gender)} · ${state.species === "human" ? `${c.age}岁人类` : `${c.age}岁魂兽`} · ${title}</div>
          <div class="chip-list" style="margin-top:10px">${c.identities.map((x, i) => `<span class="chip">${i + 1}. ${esc(x)}</span>`).join("")}</div>
        </section>
        <section class="panel">
          <h3>魂力与承受力</h3>
          <div class="level-row"><div><span class="level-number">${c.level}</span> 级</div><span>${c.godhood ? "已成神" : atRingGate() ? "魂环瓶颈" : state.species === "human" ? "可继续修炼" : "本源成长"}</span></div>
          <div class="compact-stats" style="margin-top:12px">
            ${compactBar("精神力", c.mental)}${compactBar("羁绊", state.bond)}
          </div>
        </section>
        <section class="panel"><h3>${state.species === "human" ? "武魂" : "种族本源 / 化形武魂"}</h3><div class="ring-list">${c.spirits.map((s, i) => `<div class="ring gold"><b>${c.spirits.length > 1 ? `第${i + 1}武魂 · ` : ""}${esc(s.name)}</b><br><span class="muted">${esc(s.type)}${s.special ? " · 特殊" : ""}</span></div>`).join("")}</div></section>
        <section class="panel"><h3>属性</h3><div class="compact-stats">${Object.entries(c.stats).map(([k, v]) => compactBar(STAT_LABELS[k], v)).join("")}</div></section>
        <section class="panel"><h3>魂环</h3><div class="ring-list">${c.rings.length ? c.rings.map((r, i) => `<div class="ring ${r.colorClass}"><b>第${i + 1}魂环 · ${r.years.toLocaleString()}年</b><br>${esc(r.skill)}</div>`).join("") : `<div class="empty">${state.species === "human" ? "尚未吸收魂环。达到十级瓶颈后可尝试猎取。" : "魂兽本体无需猎取魂环，化形后本源可作为武魂。"}</div>`}</div></section>
        <section class="panel"><h3>魂骨</h3><div class="bone-grid">${BONE_SLOTS.map((slot) => `<div class="bone"><span>${slot}</span><b>${c.bones[slot] ? `${c.bones[slot].years.toLocaleString()}年 · ${esc(c.bones[slot].name)}` : "空"}</b></div>`).join("")}</div></section>
        <section class="panel"><h3>魂导器</h3><div class="empty">${esc(c.soulDevice)}</div></section>
        <section class="panel"><h3>个人行动</h3><div class="panel-actions"><button id="trainBtn">${state.species === "human" ? "修炼魂力" : "淬炼本源"}</button><button id="ringBtn" ${state.species === "human" && atRingGate() ? "" : "disabled"}>吸收魂环</button><button id="boneBtn">融合魂骨</button><button id="titleBtn" ${state.species === "human" && c.level >= 90 ? "" : "disabled"}>自立封号</button></div></section>
        <section class="panel"><h3>行动记录</h3><div class="journal">${state.journal.slice(0, 18).map((line) => `<div class="log-line">${esc(line)}</div>`).join("")}</div></section>`;
      $("#trainBtn").onclick = train;
      $("#ringBtn").onclick = offerSoulRing;
      $("#boneBtn").onclick = offerSoulBone;
      $("#titleBtn").onclick = offerTitle;
    }

    function compactBar(label, value, red = false) {
      return `<div class="compact-stat"><div class="row"><span>${label}</span><span>${value}/100</span></div><div class="bar ${red ? "red" : ""}"><i style="width:${clamp(value)}%"></i></div></div>`;
    }

    function train() {
      const c = state.character;
      if (state.species === "human") {
        if (atRingGate()) return toast(`魂力停在${c.level}级，请先吸收第${c.rings.length + 1}魂环。`);
        const successChance = clamp(48 + c.mental * .35 + c.stats.physique * .22, 20, 94);
        if (Math.random() * 100 <= successChance) {
          gainLevels(1);
          if (Math.random() < .35) c.mental = clamp(c.mental + 1);
          state.journal.unshift(`修炼成功，魂力提升至${c.level}级。`);
          toast("修炼成功，魂力提升。 ");
        } else {
          applyBacklash(randomInt(2, 5), "修炼时魂力岔行。 ");
          toast("修炼失败，产生轻微反噬。 ");
        }
      } else {
        const growth = Math.max(10, Math.floor(c.cultivationYears * (Math.random() * .018 + .004)));
        c.cultivationYears += growth;
        c.level = clamp(Math.floor(Math.log10(c.cultivationYears) * 15), c.level, 100);
        if (c.level >= 100 && !c.godhood) {
          c.godhood = true;
          c.identities.push("百级神祇");
        }
        c.stats.physique = clamp(c.stats.physique + randomInt(0, 2));
        state.journal.unshift(`本源增长${growth.toLocaleString()}年，当前修为${c.cultivationYears.toLocaleString()}年。`);
        toast(`本源修为增长 ${growth.toLocaleString()} 年。`);
      }
      render();
    }

    function ringColor(years) {
      if (years < 100) return { name: "白色", cls: "white" };
      if (years < 1000) return { name: "黄色", cls: "yellow" };
      if (years < 10000) return { name: "紫色", cls: "purple" };
      if (years < 100000) return { name: "黑色", cls: "black" };
      if (years < 1000000) return { name: "红色", cls: "red" };
      return { name: "金色", cls: "gold" };
    }

    function ringLimit() {
      const c = state.character;
      return Math.round((c.mental + c.stats.physique) * 6 * (1 + c.rings.length * .42));
    }

    function offerSoulRing() {
      if (state.species !== "human" || !atRingGate()) return toast("当前没有需要突破的魂环瓶颈。 ");
      const c = state.character;
      const limit = ringLimit();
      const years = Math.max(10, Math.round(limit * (Math.random() * .9 + .62)));
      const overload = Math.max(0, years - limit) / Math.max(1, limit);
      const chance = Math.round(clamp(88 - overload * 82 + c.stats.luck * .12, 6, 97));
      const color = ringColor(years);
      openModal(`第${c.rings.length + 1}魂环候选`, `<p>发现一枚<strong>${color.name}${years.toLocaleString()}年魂环</strong>。</p><p>当前建议上限：${limit.toLocaleString()}年<br>预计成功率：<strong>${chance}%</strong></p><p class="muted">精神力 ${c.mental}、体质 ${c.stats.physique}、幸运 ${c.stats.luck} 与现有反噬共同影响结果。</p>`, "尝试吸收", () => resolveSoulRing({ years, chance, color }));
    }

    function resolveSoulRing(candidate) {
      const c = state.character;
      closeModal();
      if (Math.random() * 100 <= candidate.chance) {
        const mainSpirit = c.spirits[Math.min(c.rings.length, c.spirits.length - 1)];
        const skill = pick(RING_SKILLS[mainSpirit.type] || RING_SKILLS["器武魂"]);
        c.rings.push({ years: candidate.years, colorClass: candidate.color.cls, skill });
        c.level = Math.min(100, c.level + 1);
        c.mental = clamp(c.mental + randomInt(1, 3));
        c.stats.physique = clamp(c.stats.physique + randomInt(1, 3));
        state.journal.unshift(`成功吸收${candidate.color.name}${candidate.years.toLocaleString()}年魂环，获得魂技“${skill}”。`);
        toast(`吸收成功，获得魂技“${skill}”。`);
      } else {
        applyBacklash(randomInt(10, 20), `吸收${candidate.years.toLocaleString()}年魂环失败。`);
        toast("魂环吸收失败，魂力反噬！");
      }
      render();
    }

    function offerSoulBone() {
      const c = state.character;
      const empty = BONE_SLOTS.filter((slot) => !c.bones[slot]);
      if (!empty.length) return toast("所有魂骨部位都已经融合。 ");
      const slot = pick(empty);
      const years = Math.round(Math.pow(10, Math.random() * 3.2 + 1.8));
      const names = ["风痕", "岩心", "星辉", "寒髓", "雷纹", "灵眸", "龙息", "蓝银"];
      const name = `${pick(names)}${slot}`;
      const difficulty = Math.log10(years) * 11;
      const chance = Math.round(clamp(52 + c.mental * .28 + c.stats.physique * .3 + c.stats.luck * .1 - difficulty, 5, 94));
      openModal(`魂骨候选 · ${slot}`, `<p>发现<strong>${years.toLocaleString()}年${name}</strong>，将占用${slot}位置。</p><p>预计融合成功率：<strong>${chance}%</strong></p><p class="muted">失败会造成精神与体质损伤，并积累反噬。外附魂骨和指骨同样占用各自独立部位。</p>`, "尝试融合", () => resolveSoulBone({ slot, years, name, chance }));
    }

    function resolveSoulBone(candidate) {
      const c = state.character;
      closeModal();
      if (Math.random() * 100 <= candidate.chance) {
        c.bones[candidate.slot] = { years: candidate.years, name: candidate.name };
        const keys = Object.keys(c.stats);
        const boostedStat = pick(keys);
        c.stats[boostedStat] = clamp(c.stats[boostedStat] + randomInt(2, 6));
        c.mental = clamp(c.mental + randomInt(1, 4));
        state.journal.unshift(`成功融合${candidate.years.toLocaleString()}年${candidate.name}。`);
        toast(`成功融合${candidate.name}。`);
      } else {
        applyBacklash(randomInt(8, 18), `融合${candidate.name}失败。`);
        toast("魂骨融合失败，遭到反噬！");
      }
      render();
    }

    function applyBacklash(amount, reason) {
      const damage = Math.max(1, Math.round(amount * 3 + state.character.level * .15));
      takeDamage(damage, `${reason}反噬`);
    }

    function offerTitle() {
      const c = state.character;
      if (state.species !== "human" || c.level < 90) return toast("人类魂师达到九十级后才能自立封号。 ");
      openModal("自立封号", `<p>你的魂力已经达到${c.level}级。输入二至六个字的封号，它将显示在姓名旁。</p><input class="modal-input" id="titleInput" maxlength="6" value="${esc(c.title)}" placeholder="例如：星渊" />`, "确认封号", () => {
        const value = $("#titleInput").value.trim().slice(0, 6);
        if (!value) return toast("请输入封号。 ");
        c.title = value;
        if (!c.identities.includes(`${value}斗罗`)) c.identities.push(`${value}斗罗`);
        state.journal.unshift(`自立封号：${value}斗罗。`);
        closeModal(); render();
      });
    }

    /* 长线游戏系统：剧情、地图、个人面板、成长与关系 */
    function renderMain() {
      if (state.screen === "welcome") return renderWelcome();
      if (state.screen === "species") return renderSpecies();
      if (state.screen === "character") return renderCharacterSetup();
      if (state.screen === "timeline") return renderTimelineSelect();
      if (state.screen === "ending") return renderEnding();
      renderGamePage();
    }

    function startTimeline(id) {
      const world = WORLD[id];
      state.timelineId = id;
      state.nodeId = TIMELINES[id].start;
      state.screen = "game";
      state.gameView = "story";
      state.worldDate = { ...world.date };
      state.currentLocation = world.startLocation;
      state.unlockedLocations = world.locations.filter((location) => !location.unlockNode).map((location) => location.id);
      if (!state.unlockedLocations.includes(world.startLocation)) state.unlockedLocations.push(world.startLocation);
      state.npcRelations = {};
      for (const npc of NPC_TEMPLATES[id]) {
        state.npcRelations[npc.id] = {
          affinity: clamp(randomInt(6, 14) + Math.floor((state.character.charm || 0) / 12)), trust: clamp(randomInt(5, 12) + Math.floor((state.character.charm || 0) / 28)), respect: randomInt(8, 20),
          suspicion: state.species === "beast" ? randomInt(12, 24) : randomInt(2, 10),
          interactions: 0, memories: [], lastTalk: null
        };
      }
      state.dialogueLog = [];
      state.trophies = { rings: [], bones: [] };
      state.gifts = 3;
      state.storyCompleted = false;
      state.ending = null;
      state.combat = null;
      state.pendingHunt = null;
      state.selectedNpc = null;
      state.deadNpcs = {};
      state.worldFlags = {};
      state.interventions = [];
      state.spiritEssence = 0;
      state.metNpcs = {};
      state.faction = null;
      state.factionReputation = Object.fromEntries((FACTIONS[id] || []).map(f => [f.id, 0]));
      state.evolutionMaterials = 0;
      state.character.hp = state.character.maxHp;
      state.character.soul = state.character.maxSoul;
      if (!state.character.identities.includes(`${TIMELINES[id].name}降临者`)) state.character.identities.push(`${TIMELINES[id].name}降临者`);
      state.journal.unshift(`${dateText()}，进入${TIMELINES[id].name}。`);
      render();
    }

    function dateText() {
      const d = state.worldDate;
      return d ? `大陆历${d.year}年${d.month}月${d.day}日` : "尚未进入时代";
    }

    function advanceDays(days) {
      if (!state.worldDate) return;
      const d = state.worldDate;
      const startYear = d.year;
      d.day += Math.max(0, days);
      while (d.day > 30) { d.day -= 30; d.month += 1; }
      while (d.month > 12) { d.month -= 12; d.year += 1; }
      if (d.year > startYear) state.character.age += d.year - startYear;
    }

    function currentWorld() {
      return WORLD[state.timelineId];
    }

    function currentLocationData() {
      return currentWorld()?.locations.find((location) => location.id === state.currentLocation);
    }

    function storyTargetLocation() {
      return NODE_LOCATION[state.nodeId];
    }

    function relationStage(relation) {
      if (relation.trust >= 70 && relation.affinity >= 70) return "生死之交";
      if (relation.trust >= 52 && relation.affinity >= 52) return "知己";
      if (relation.affinity >= 35 || relation.respect >= 45) return "友好";
      if (relation.affinity >= 20) return "熟识";
      return relation.suspicion >= 35 ? "戒备" : "陌生";
    }

    function currentNpcs() {
      if (!state.timelineId) return [];
      return NPC_TEMPLATES[state.timelineId].filter((npc) => {
        const unlockLocation = NODE_LOCATION[npc.unlock];
        return npc.locations.includes(state.currentLocation) && state.unlockedLocations.includes(unlockLocation);
      });
    }

    function navHtml() {
      const items = [["story", "当前剧情"], ["map", "地图移动"], ["profile", "个人面板"], ["growth", "成长修炼"], ["relations", "人物关系"]];
      return `<nav class="game-nav" aria-label="游戏系统">${items.map(([id, label]) => `<button data-view="${id}" class="${state.gameView === id ? "active" : ""}">${label}</button>`).join("")}</nav>`;
    }

    function worldStripHtml() {
      const location = currentLocationData();
      const node = STORY[state.nodeId];
      return `<div class="world-strip"><span>${esc(dateText())}</span><span>当前位置：${esc(location?.name || "未知")}</span><span>主线：${esc(node?.title || state.ending?.title || "自由活动")}</span><span>礼物：${state.gifts}</span></div>`;
    }

    function renderGamePage() {
      const viewHtml = state.gameView === "combat" ? combatViewHtml() : state.gameView === "map" ? mapViewHtml() : state.gameView === "profile" ? profileViewHtml() : state.gameView === "growth" ? growthViewHtml() : state.gameView === "relations" ? relationsViewHtml() : storyViewHtml();
      $("#main").innerHTML = `${navHtml()}${worldStripHtml()}${viewHtml}`;
      document.querySelectorAll("[data-view]").forEach((button) => button.onclick = () => { state.gameView = button.dataset.view; render(); });
      if (state.gameView === "combat") bindCombatView();
      else if (state.gameView === "map") bindMapView();
      else if (state.gameView === "profile") bindProfileView();
      else if (state.gameView === "growth") bindGrowthView();
      else if (state.gameView === "relations") bindRelationsView();
      else bindStoryView();
    }

    function storyViewHtml() {
      if (state.storyCompleted && state.ending) {
        return `<section class="chapter-visual"><div class="eyebrow">阶段主线完成 · 自由活动继续</div><h2>${esc(state.ending.title)}</h2><p>${esc(dateText())}</p></section><article class="story"><p>${esc(state.ending.text)}</p></article>${worldActionHtml()}${npcSectionHtml()}`;
      }
      const node = STORY[state.nodeId];
      const targetId = storyTargetLocation();
      const target = currentWorld().locations.find((location) => location.id === targetId);
      const atTarget = state.currentLocation === targetId;
      if (!atTarget) {
        return `<section class="chapter-visual"><div class="eyebrow">主线目标</div><h2>${esc(node.title)}</h2><p>目标地点：${esc(target?.name || node.place)}</p></section><section class="stage"><div class="notice">需要先通过“地图移动”前往${esc(target?.name || node.place)}。当前位置可以继续交流、修炼或猎魂。</div></section>${worldActionHtml()}${npcSectionHtml()}`;
      }
      const paragraphs = [...node.text, ...(STORY_EXPANSION[state.nodeId] || [])];
      return `<section class="chapter-visual"><div class="eyebrow">${esc(TIMELINES[state.timelineId].era)}</div><h2>${esc(node.title)}</h2><p>${esc(node.place)}</p><div class="tag-row">${node.tags.map((tag) => `<span class="tag">${esc(tag)}</span>`).join("")}</div></section><article class="story">${paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}</article><div class="choices">${node.choices.map((choice, index) => renderChoice(choice, index)).join("")}</div>${worldActionHtml()}${npcSectionHtml()}`;
    }

    function worldActionHtml() {
      const location = currentLocationData();
      return `<section class="subsection"><h3>当前行动</h3><div class="action-grid"><button class="action-card" data-view-jump="growth"><strong>安排修炼</strong><span>冥想、锻体、精神训练、实战或休养。</span></button>${location?.hunting ? `<button class="action-card" id="huntBtn"><strong>搜寻魂兽</strong><span>进入RPG战斗；击杀后当场处理魂环与魂骨。</span></button>` : ""}<button class="action-card" data-view-jump="map"><strong>离开此地</strong><span>打开地图并选择已解锁位置。</span></button></div></section>`;
    }

    function npcSectionHtml() {
      const npcs = currentNpcs();
      const cards = npcs.length ? npcs.map(npcCardHtml).join("") : `<div class="empty">当前地点没有可交谈的主要人物。</div>`;
      const dialogue = state.dialogueLog.length ? `<div class="dialogue">${state.dialogueLog.slice(0, 8).map((entry) => `<div class="dialogue-line"><b>${esc(entry.name)}</b>　[${esc(entry.expression)}] “${esc(entry.line)}”</div>`).join("")}</div>` : "";
      return `<section class="subsection"><h3>当前地点人物</h3><div class="npc-list">${cards}</div>${dialogue ? `<h3 style="margin-top:18px">最近交谈</h3>${dialogue}` : ""}</section>`;
    }

    function npcCardHtml(npc) {
      const r = state.npcRelations[npc.id];
      return `<article class="npc-card"><div class="npc-top"><div><strong>${esc(npc.name)}</strong><br><small>${esc(npc.role)}</small></div><span class="tag">${relationStage(r)}</span></div><div class="relation-meters"><div class="relation-meter"><b>${r.affinity}</b><span>亲近</span></div><div class="relation-meter"><b>${r.trust}</b><span>信任</span></div><div class="relation-meter"><b>${r.respect}</b><span>尊重</span></div><div class="relation-meter"><b>${r.suspicion}</b><span>戒备</span></div></div><div class="panel-actions"><button data-talk="${npc.id}:greet">问候</button><button data-talk="${npc.id}:ask">请教</button><button data-talk="${npc.id}:meal" ${r.affinity >= 20 ? "" : "disabled"}>一起用餐</button><button data-talk="${npc.id}:spar" ${r.respect >= 18 ? "" : "disabled"}>切磋</button><button data-open-relation="${npc.id}">更多互动</button></div>${r.memories.length ? `<div class="memory-list">${r.memories.map((m) => `<span class="memory">${esc(m)}</span>`).join("")}</div>` : ""}<div class="empty" style="margin-top:8px">上次交流：${r.lastTalk ? esc(r.lastTalk) : "尚未交流"} · 共${r.interactions}次</div></article>`;
    }

    function bindStoryView() {
      document.querySelectorAll("[data-choice]").forEach((button) => button.onclick = () => chooseStoryOption(Number(button.dataset.choice)));
      document.querySelectorAll("[data-view-jump]").forEach((button) => button.onclick = () => { state.gameView = button.dataset.viewJump; render(); });
      document.querySelectorAll("[data-talk]").forEach((button) => button.onclick = () => { const [id, mode] = button.dataset.talk.split(":"); talkToNpc(id, mode); });
      document.querySelectorAll("[data-open-relation]").forEach((button) => button.onclick = () => { state.gameView = "relations"; state.selectedNpc = button.dataset.openRelation; render(); });
      if ($("#huntBtn")) $("#huntBtn").onclick = startHunt;
    }

    function chooseStoryOption(index) {
      const choice = STORY[state.nodeId].choices[index];
      if (!choice) return;
      if (!meets(choice.require)) {
        applyBacklash(7, `行动失败：${requirementText(choice.require)}。`);
        advanceDays(2);
        toast("条件不足，强行行动引发魂力反噬，并消耗了两天。");
        render();
        return;
      }
      applyEffects(choice.effects || {});
      if (state.screen === "ending") return render();
      advanceDays(randomInt(3, 9));
      if (choice.identity && !state.character.identities.includes(choice.identity)) state.character.identities.push(choice.identity);
      state.journal.unshift(`${dateText()}｜主线选择：${choice.text}`);
      if (choice.ending) {
        state.ending = { title: choice.ending, text: endingText(choice.ending) };
        state.storyCompleted = true;
      } else {
        state.nodeId = choice.to;
        const newlyAvailable = currentWorld().locations.filter((location) => location.unlockNode === choice.to).map((location) => location.id);
        const nextLocation = NODE_LOCATION[choice.to];
        if (nextLocation) newlyAvailable.push(nextLocation);
        for (const locationId of newlyAvailable) if (!state.unlockedLocations.includes(locationId)) state.unlockedLocations.push(locationId);
      }
      render();
    }

    function mapViewHtml() {
      return `<section class="stage"><div class="section-head"><div><div class="step">独立系统 / 位置移动</div><h2>大陆地图</h2><p>移动会消耗天数。新地点随主线推进解锁，不会自动传送。</p></div></div><div class="map-grid">${currentWorld().locations.map((location) => { const unlocked = state.unlockedLocations.includes(location.id); const current = state.currentLocation === location.id; return `<button class="location-card ${current ? "current" : ""} ${unlocked ? "" : "locked"}" data-location="${location.id}" ${unlocked && !current ? "" : "disabled"}><strong>${esc(location.name)}</strong><p>${esc(location.desc)}</p><span class="day-cost">${current ? "当前位置" : unlocked ? `移动耗时 ${location.days} 天` : "尚未解锁"}${location.hunting ? " · 可猎魂" : ""}</span></button>`; }).join("")}</div></section>`;
    }

    function bindMapView() {
      document.querySelectorAll("[data-location]").forEach((button) => button.onclick = () => moveTo(button.dataset.location));
    }

    function moveTo(id) {
      const location = currentWorld().locations.find((item) => item.id === id);
      if (!location || !state.unlockedLocations.includes(id) || id === state.currentLocation) return;
      advanceDays(location.days);
      state.currentLocation = id;
      state.journal.unshift(`${dateText()}｜抵达${location.name}。`);
      state.gameView = "story";
      render();
    }

    function interactionUnlocked(relation, mode) {
      if (["greet", "ask", "gift"].includes(mode)) return true;
      if (mode === "spar") return relation.respect >= 18;
      if (mode === "meal") return relation.affinity >= 20;
      if (mode === "confide") return relation.trust >= 30;
      if (mode === "intimate") return relation.affinity >= 45 && relation.trust >= 40 && relation.suspicion <= 25;
      if (mode === "handhold") return relation.affinity >= 60 && relation.trust >= 55 && relation.suspicion <= 20;
      if (mode === "hug") return relation.affinity >= 75 && relation.trust >= 70 && relation.suspicion <= 15;
      return false;
    }

    function interactionRequirement(mode) {
      return { spar: "尊重18", meal: "亲近20", confide: "信任30", intimate: "亲近45 / 信任40 / 戒备≤25", handhold: "亲近60 / 信任55 / 戒备≤20", hug: "亲近75 / 信任70 / 戒备≤15" }[mode] || "";
    }

    function relationButton(npc, relation, mode, label, here) {
      const unlocked = interactionUnlocked(relation, mode) && here && !(mode === "gift" && state.gifts < 1);
      const reason = !here ? "需要与对方处于同一地点" : interactionRequirement(mode);
      return `<button data-relation-talk="${npc.id}:${mode}" ${unlocked ? "" : "disabled"} title="${esc(unlocked ? "" : reason)}">${label}${!unlocked && reason ? `<small style="display:block">${esc(reason)}</small>` : ""}</button>`;
    }

    function relationsViewHtml() {
      const npcs = NPC_TEMPLATES[state.timelineId];
      const cards = npcs.map((npc) => {
        const relation = state.npcRelations[npc.id];
        const known = state.unlockedLocations.includes(NODE_LOCATION[npc.unlock]);
        const here = npc.locations.includes(state.currentLocation);
        if (!known) return `<article class="relationship-profile"><div class="npc-top"><div><strong>${esc(npc.name)}</strong><br><small>尚未在主线中结识</small></div><span class="tag">未知</span></div></article>`;
        const bio = NPC_BIOS[npc.id];
        return `<article class="relationship-profile" id="relation-${npc.id}"><div class="npc-top"><div><strong>${esc(npc.name)}</strong><br><small>${esc(npc.role)}</small></div><div><span class="tag">${relationStage(relation)}</span>${here ? `<span class="tag">在当前地点</span>` : ""}</div></div><div class="bio-grid"><div><span>武魂 / 本源</span><b>${esc(bio.spirit)}</b></div><div><span>身份</span><b>${esc(bio.identity)}</b></div><div><span>性格</span><b>${esc(bio.temperament)}</b></div><div><span>重要经历</span><b>${esc(bio.history)}</b></div><div><span>重视之事</span><b>${esc(bio.values)}</b></div><div><span>交往边界</span><b>${esc(bio.boundary)}</b></div></div><div class="relation-meters"><div class="relation-meter"><b>${relation.affinity}</b><span>亲近</span></div><div class="relation-meter"><b>${relation.trust}</b><span>信任</span></div><div class="relation-meter"><b>${relation.respect}</b><span>尊重</span></div><div class="relation-meter"><b>${relation.suspicion}</b><span>戒备</span></div></div><div class="action-grid">${relationButton(npc, relation, "greet", "问候", here)}${relationButton(npc, relation, "ask", "请教", here)}${relationButton(npc, relation, "gift", "赠礼", here)}${relationButton(npc, relation, "spar", "切磋", here)}${relationButton(npc, relation, "meal", "一起用餐", here)}${relationButton(npc, relation, "confide", "坦白心事", here)}${relationButton(npc, relation, "intimate", "亲密靠近", here)}${relationButton(npc, relation, "handhold", "牵手", here)}${relationButton(npc, relation, "hug", "拥抱", here)}</div>${relation.memories.length ? `<div class="memory-list">${relation.memories.map((memory) => `<span class="memory">${esc(memory)}</span>`).join("")}</div>` : ""}<div class="empty" style="margin-top:9px">上次交流：${relation.lastTalk || "尚未交流"} · 累计互动${relation.interactions}次</div></article>`;
      }).join("");
      const dialogue = state.dialogueLog.length ? `<div class="dialogue">${state.dialogueLog.slice(0, 12).map((entry) => `<div class="dialogue-line"><b>${esc(entry.name)}</b>　[${esc(entry.expression)}] “${esc(entry.line)}”</div>`).join("")}</div>` : `<div class="empty">尚无交流记录。</div>`;
      return `<section class="stage"><div class="section-head"><div><div class="step">独立系统 / 人物关系</div><h2>人物档案与互动</h2><p>亲密互动需要同时满足亲近、信任和戒备条件。所有身体接触均为自愿、非露骨互动，并会尊重人物年龄与交往边界。</p></div></div><div class="relationship-grid">${cards}</div><h3 style="margin-top:22px">交流记录</h3>${dialogue}</section>`;
    }

    function bindRelationsView() {
      document.querySelectorAll("[data-relation-talk]").forEach((button) => button.onclick = () => { const [id, mode] = button.dataset.relationTalk.split(":"); talkToNpc(id, mode); });
      if (state.selectedNpc) setTimeout(() => document.getElementById?.(`relation-${state.selectedNpc}`)?.scrollIntoView?.({ block: "start", behavior: "smooth" }), 0);
    }

    function profileViewHtml() {
      const c = state.character;
      return `<section class="stage"><div class="section-head"><div><div class="step">独立系统 / 个人面板</div><h2>${esc(c.name)}${c.title ? ` · ${esc(c.title)}斗罗` : ""}</h2><p>${esc(c.gender)} · ${c.age}岁 · ${state.species === "human" ? `${c.level}级魂师 · 精神力${c.mental}` : `${c.cultivationYears.toLocaleString()}年魂兽 · 精神力${c.mental}`}</p></div><span class="tag">${c.godhood ? "百级神祇" : atRingGate() ? "魂环瓶颈" : "成长中"}</span></div><article class="profile-card" style="margin-bottom:16px"><h3>战斗资源</h3>${combatMeter("生命", c.hp, c.maxHp, false)}${combatMeter("魂力", c.soul, c.maxSoul, true)}<div class="notice">吸收反噬与战斗伤害会直接扣除生命值；生命归零时本次命途结束。</div></article><div class="actions" style="margin-top:0; margin-bottom:16px"><button id="profileTitleBtn" ${state.species === "human" && c.level >= 90 ? "" : "disabled"}>${c.title ? "修改封号" : "自立封号（九十级）"}</button></div><div class="profile-tabs"><article class="profile-card"><h3>${state.species === "human" ? "武魂与魂技" : "种族本源"}</h3><div class="ring-list">${c.spirits.map((spirit, index) => `<button class="clickable-card" data-spirit-detail="${index}"><strong>${c.spirits.length > 1 ? `第${index + 1}武魂 · ` : ""}${esc(spirit.name)}</strong><br><span class="muted">${esc(spirit.type)} · 点击查看所属魂环与魂技</span></button>`).join("")}</div><h3 style="margin-top:18px">属性</h3><div class="stat-grid">${Object.entries(c.stats).map(([key, value]) => `<div class="stat-tile"><b>${value}</b><span>${STAT_LABELS[key]}</span></div>`).join("")}</div></article><article class="profile-card"><h3>魂骨与魂骨技</h3><div class="bone-grid">${BONE_SLOTS.map((slot) => `<button class="bone clickable-card" data-bone-detail="${slot}" ${c.bones[slot] ? "" : "disabled"}><span>${slot}</span><b>${c.bones[slot] ? esc(c.bones[slot].name) : "空"}</b></button>`).join("")}</div><h3 style="margin-top:18px">身份序列</h3><div class="chip-list">${c.identities.map((identity, index) => `<span class="chip">${index + 1}. ${esc(identity)}</span>`).join("")}</div><h3 style="margin-top:18px">魂导器</h3><div class="empty">${esc(c.soulDevice)}</div></article></div>${lootHtml()}</section>`;
    }

    function lootHtml() {
      return `<article class="profile-card" style="margin-top:16px"><h3>猎魂规则</h3><div class="notice">魂兽被击杀后，魂环必须在战场上立即选择吸收或放弃；魂骨若掉落也必须当场融合或放弃，不会进入背包保存。</div></article>`;
    }

    function bindProfileView() {
      if ($("#profileTitleBtn")) $("#profileTitleBtn").onclick = offerTitle;
      document.querySelectorAll("[data-spirit-detail]").forEach((button) => button.onclick = () => showSpiritDetail(Number(button.dataset.spiritDetail)));
      document.querySelectorAll("[data-bone-detail]").forEach((button) => button.onclick = () => showBoneDetail(button.dataset.boneDetail));
      document.querySelectorAll("[data-absorb-ring]").forEach((button) => button.onclick = () => offerSoulRing(Number(button.dataset.absorbRing)));
      document.querySelectorAll("[data-absorb-bone]").forEach((button) => button.onclick = () => offerSoulBone(Number(button.dataset.absorbBone)));
    }

    function showSpiritDetail(index) {
      const c = state.character;
      const spirit = c.spirits[index];
      const rings = c.rings.filter((ring) => ring.spiritIndex === index);
      const details = rings.length ? rings.map((ring, i) => `<div class="ring ${ring.colorClass}"><b>${ring.years.toLocaleString()}年 · ${esc(ring.beastName)}</b><br><strong>${esc(ring.skill)}</strong><br><span class="muted">${esc(ring.skillDescription)}</span></div>`).join("") : `<div class="empty">这个武魂尚未配置魂环。</div>`;
      openInfoModal(`${spirit.name} · ${spirit.type}`, `<p>${spirit.special ? "特殊武魂。" : "常规武魂。"}魂技会同时参考此武魂的类型与产出魂环的魂兽特性。</p><div class="ring-list">${details}</div>`);
    }

    function showBoneDetail(slot) {
      const bone = state.character.bones[slot];
      if (!bone) return;
      openInfoModal(`${slot} · ${bone.name}`, `<p>产出魂兽：${esc(bone.beastName)}<br>年限：${bone.years.toLocaleString()}年</p><p><strong>魂骨技：${esc(bone.skill)}</strong><br>${esc(bone.skillDescription)}</p><p class="muted">魂骨技只继承产出魂兽的血脉、元素与行为特性，不参考持有者武魂。</p>`);
    }

    function growthViewHtml() {
      const c = state.character;
      return `<section class="stage"><div class="section-head"><div><div class="step">独立系统 / 成长计划</div><h2>安排修炼</h2><p>每种训练消耗明确天数。魂力处于十级瓶颈时，冥想不会越过瓶颈。</p></div><span class="tag">${esc(dateText())}</span></div><div class="action-grid"><button class="action-card" data-growth="meditate"><strong>冥想</strong><span>3天 · 提升魂力并恢复战斗魂力，概率增加精神力。</span></button><button class="action-card" data-growth="body"><strong>锻体</strong><span>5天 · 提升体质、力量、防御与生命上限。</span></button><button class="action-card" data-growth="mind"><strong>精神训练</strong><span>4天 · 提升精神力；失败会因反噬损失生命。</span></button><button class="action-card" data-growth="combat"><strong>实战演练</strong><span>2天 · 提升敏捷、力量与战斗经验。</span></button><button class="action-card" data-growth="rest"><strong>静养</strong><span>2天 · 恢复生命与魂力。</span></button><button class="action-card" data-growth="explore"><strong>城镇探索</strong><span>2天 · 可能获得礼物或魂导器线索。</span></button></div><article class="profile-card" style="margin-top:16px"><h3>当前成长状态</h3>${combatMeter("生命", c.hp, c.maxHp, false)}${combatMeter("魂力", c.soul, c.maxSoul, true)}<div class="compact-stats">${compactBar("精神力", c.mental)}${compactBar("体质", c.stats.physique)}</div><div class="notice" style="margin-top:14px">魂环建议上限：${state.species === "human" ? `${ringLimit().toLocaleString()}年` : "魂兽本体不吸收魂环"}。魂环与魂骨只在猎杀后当场处理。</div></article></section>`;
    }

    function bindGrowthView() {
      document.querySelectorAll("[data-growth]").forEach((button) => button.onclick = () => performGrowth(button.dataset.growth));
    }

    function performGrowth(type) {
      const c = state.character;
      if (type === "meditate") {
        advanceDays(3);
        c.soul = Math.min(c.maxSoul, c.soul + Math.round(c.maxSoul * .45));
        if (state.species === "human") {
          if (atRingGate()) toast(`魂力停在${c.level}级，必须先猎杀魂兽并吸收魂环。`);
          else if (Math.random() * 100 < clamp(52 + c.mental * .45, 25, 96)) { gainLevels(1); if (Math.random() < .35) c.mental = clamp(c.mental + 1); toast("冥想完成，魂力有所增长。"); }
          else { applyBacklash(2, "冥想时魂力运行失序。 "); toast("冥想没有突破，并产生轻微反噬。"); }
        } else {
          const growth = Math.max(8, Math.floor(c.cultivationYears * .012)); c.cultivationYears += growth; toast(`本源修为增长${growth.toLocaleString()}年。`);
        }
      } else if (type === "body") {
        advanceDays(5); c.stats.physique = clamp(c.stats.physique + randomInt(2, 4)); c.stats.strength = clamp(c.stats.strength + randomInt(1, 3)); c.stats.defense = clamp(c.stats.defense + randomInt(1, 3)); c.maxHp += randomInt(8, 16); c.hp = Math.min(c.maxHp, c.hp + 12); toast("锻体结束，身体属性与生命上限提升。");
      } else if (type === "mind") {
        advanceDays(4); if (Math.random() < .78) { c.mental = clamp(c.mental + randomInt(2, 5)); toast("精神训练完成。"); } else { applyBacklash(3, "精神训练过度。 "); toast("精神训练过度，出现反噬。"); }
      } else if (type === "combat") {
        advanceDays(2); c.stats.agility = clamp(c.stats.agility + randomInt(1, 3)); c.stats.strength = clamp(c.stats.strength + randomInt(1, 2)); toast("实战演练结束。");
      } else if (type === "rest") {
        advanceDays(2); c.hp = Math.min(c.maxHp, c.hp + Math.round(c.maxHp * .4)); c.soul = Math.min(c.maxSoul, c.soul + Math.round(c.maxSoul * .65)); toast("静养结束，生命与魂力得到恢复。");
      } else if (type === "explore") {
        advanceDays(2); if (Math.random() < .55) { state.gifts += 1; toast("找到一件适合赠送的小礼物。"); } else { c.stats.luck = clamp(c.stats.luck + 1); toast("没有找到物品，但更熟悉了当地环境。"); }
      }
      state.journal.unshift(`${dateText()}｜完成${{ meditate: "冥想", body: "锻体", mind: "精神训练", combat: "实战演练", rest: "静养", explore: "城镇探索" }[type]}。`);
      render();
    }

    function talkToNpc(id, mode) {
      const npc = NPC_TEMPLATES[state.timelineId].find((item) => item.id === id);
      const relation = state.npcRelations[id];
      if (!npc || !relation) return;
      if (!npc.locations.includes(state.currentLocation)) return toast("需要先与对方处于同一地点。");
      if (!interactionUnlocked(relation, mode)) return toast(`这项互动尚未解锁：${interactionRequirement(mode)}。`);
      if (mode === "gift" && state.gifts < 1) return toast("没有可赠送的物品。");
      const effects = {
        greet: { affinity: 2, trust: 1, suspicion: -1, days: 0 },
        ask: { respect: 3, trust: 1, days: 1 },
        confide: { trust: 5, affinity: 3, suspicion: -3, days: 1 },
        spar: { respect: 5, affinity: 1, suspicion: 1, days: 2 },
        gift: { affinity: 6, trust: 2, suspicion: -2, days: 0 },
        meal: { affinity: 4, trust: 2, suspicion: -1, days: 1 },
        intimate: { affinity: 5, trust: 4, suspicion: -2, days: 0 },
        handhold: { affinity: 6, trust: 5, suspicion: -2, days: 0 },
        hug: { affinity: 8, trust: 6, suspicion: -3, days: 0 }
      }[mode];
      if (!effects) return;
      for (const key of ["affinity", "trust", "respect", "suspicion"]) relation[key] = clamp(relation[key] + (effects[key] || 0));
      if (mode === "gift") state.gifts -= 1;
      advanceDays(effects.days);
      relation.interactions += 1;
      relation.lastTalk = dateText();
      if (mode === "confide" && !relation.memories.includes("交换过无法公开的心事")) relation.memories.push("交换过无法公开的心事");
      if (mode === "spar" && !relation.memories.includes("认真切磋过")) relation.memories.push("认真切磋过");
      const closeMemory = { meal: "一起安静地吃过一顿饭", intimate: "允许彼此进入私人距离", handhold: "在清醒与自愿下牵过手", hug: "在需要时给过彼此拥抱" }[mode];
      if (closeMemory && !relation.memories.includes(closeMemory)) relation.memories.push(closeMemory);
      if (relation.trust >= 55 && !relation.memories.includes("愿意在危机中优先相信你")) relation.memories.push("愿意在危机中优先相信你");
      let selected;
      if (mode === "gift") selected = ["对方双手接过礼物，先看了你一眼才认真收好。", "我会记得。不是因为东西贵重，是因为你留意到了。"];
      else if (["meal", "intimate", "handhold", "hug"].includes(mode)) selected = CLOSE_DIALOGUES[id][mode];
      else {
        const lines = npc.dialogue[mode];
        const tier = relation.affinity >= 55 ? 2 : relation.affinity >= 28 ? 1 : 0;
        selected = lines[Math.min(tier, lines.length - 1)] || lines[relation.interactions % lines.length];
      }
      state.dialogueLog.unshift({ name: npc.name, expression: selected[0], line: selected[1], date: dateText() });
      state.journal.unshift(`${dateText()}｜与${npc.name}${{ greet: "问候", ask: "交谈请教", confide: "坦白心事", spar: "切磋", gift: "交换礼物", meal: "一起用餐", intimate: "亲密交谈", handhold: "牵手", hug: "拥抱" }[mode]}。`);
      render();
    }

    function startHunt() {
      const location = currentLocationData();
      if (!location?.hunting) return toast("当前地区不适合猎魂。");
      const beast = { ...pick(HUNT_BEASTS) };
      const base = state.species === "human" ? Math.max(40, ringLimit()) : Math.max(100, Math.round(state.character.cultivationYears * .08));
      const years = Math.max(10, Math.round(base * (Math.random() * 1.05 + .5)));
      const power = state.character.level * 3 + state.character.stats.strength + state.character.stats.agility + state.character.stats.defense;
      const difficulty = Math.log10(years + 10) * 36 + (beast.traits.includes("防御") ? 18 : 0);
      const chance = Math.round(clamp(58 + (power - difficulty) * .22 + state.character.stats.luck * .1, 8, 96));
      openModal(`发现${beast.name}`, `<p><strong>${years.toLocaleString()}年${beast.name}</strong></p><p>特性：${esc(beast.element)} · ${esc(beast.traits.join("、"))}<br>习性：${esc(beast.temperament)}<br>猎杀成功率：<strong>${chance}%</strong></p><p class="muted">只有完成猎杀，魂环才会成为可吸收战利品；魂骨还需额外判定是否产出。</p>`, "发起猎杀", () => resolveHunt({ beast, years, chance }));
    }

    function resolveHunt(target) {
      closeModal();
      advanceDays(randomInt(1, 3));
      if (Math.random() * 100 <= target.chance) {
        if (state.species === "human") state.trophies.rings.push({ beast: target.beast, years: target.years, acquired: dateText() });
        const boneChance = clamp(3 + Math.log10(target.years + 10) * 2 + state.character.stats.luck * .05, 3, 20);
        let boneMessage = "";
        if (Math.random() * 100 <= boneChance) {
          const empty = BONE_SLOTS.filter((slot) => !state.character.bones[slot]);
          if (empty.length) {
            const slot = pick(empty);
            const name = `${target.beast.name}${slot}`;
            state.trophies.bones.push({ beast: target.beast, years: target.years, slot, name, acquired: dateText() });
            boneMessage = `，并产出${slot}`;
          }
        }
        state.journal.unshift(`${dateText()}｜猎杀${target.years.toLocaleString()}年${target.beast.name}${boneMessage}。`);
        toast(state.species === "human" ? `猎杀成功，魂环已进入战利品${boneMessage}。` : `猎杀成功${boneMessage}；魂兽本体不会吸收人类魂环。`);
      } else {
        applyBacklash(randomInt(5, 11), `猎杀${target.beast.name}失败。`);
        toast("猎杀失败，受伤并产生反噬。");
      }
      render();
    }

    function startHunt() {
      const location = currentLocationData();
      if (!location?.hunting) return toast("当前地区不适合猎魂。");
      const beast = { ...pick(HUNT_BEASTS) };
      const base = state.species === "human" ? Math.max(40, ringLimit()) : Math.max(100, Math.round(state.character.cultivationYears * .08));
      const years = Math.max(10, Math.round(base * (Math.random() * .95 + .55)));
      openModal(`遭遇${beast.name}`, `<p><strong>${years.toLocaleString()}年${beast.name}</strong></p><p>属性：${esc(beast.element)}<br>特性：${esc(beast.traits.join("、"))}<br>习性：${esc(beast.temperament)}</p><p class="muted">进入战斗后将按速度决定行动效果。胜利后必须当场决定吸收或放弃魂环；魂骨若掉落也必须当场处理。</p>`, "进入战斗", () => beginCombat({ beast, years }));
    }

    function beginCombat(target) {
      closeModal();
      const scale = Math.log10(target.years + 10);
      const maxHp = Math.round(85 + scale * 72);
      state.combat = {
        beast: target.beast, years: target.years, hp: maxHp, maxHp,
        attack: Math.round(10 + scale * 10), defense: Math.round(5 + scale * 6), agility: Math.round(10 + scale * 9),
        turn: 1, defending: false, dodging: false,
        log: [`${target.beast.name}压低身体，${target.beast.temperament}。`]
      };
      state.pendingHunt = null;
      state.gameView = "combat";
      render();
    }

    function combatViewHtml() {
      const combat = state.combat;
      const c = state.character;
      if (!combat) return `<section class="stage"><div class="notice">当前没有进行中的战斗。</div></section>`;
      if (state.pendingHunt) return huntDecisionHtml();
      const playerHp = Math.max(0, c.hp);
      const enemyHp = Math.max(0, combat.hp);
      const soulSkillLabel = c.rings.length ? c.rings.at(-1).skill : `${c.spirits[0].name}强化`;
      return `<section class="combat-stage"><div class="section-head"><div><div class="step">RPG 战斗 / 第${combat.turn}回合</div><h2>${esc(combat.beast.name)}</h2><p>${combat.years.toLocaleString()}年 · ${esc(combat.beast.element)}属性 · ${esc(combat.beast.traits.join("、"))}</p></div></div><div class="combatants"><article class="combatant"><h3>${esc(c.name)}</h3><div class="meta">${c.level}级 · ${esc(c.spirits[0].name)}</div>${combatMeter("生命", playerHp, c.maxHp, false)}${combatMeter("魂力", c.soul, c.maxSoul, true)}</article><div class="versus">VS</div><article class="combatant enemy"><h3>${esc(combat.beast.name)}</h3><div class="meta">${combat.years.toLocaleString()}年魂兽</div>${combatMeter("生命", enemyHp, combat.maxHp, false)}<div class="bio-grid" style="margin-bottom:0"><div><span>攻击</span><b>${combat.attack}</b></div><div><span>防御</span><b>${combat.defense}</b></div><div><span>敏捷</span><b>${combat.agility}</b></div><div><span>属性</span><b>${esc(combat.beast.element)}</b></div></div></article></div><div class="combat-log">${combat.log.slice(0, 12).map((line) => `<div>${esc(line)}</div>`).join("")}</div><div class="combat-actions"><button data-combat-action="attack">普通攻击</button><button data-combat-action="skill" ${c.soul >= 15 ? "" : "disabled"}>${esc(soulSkillLabel)}（15魂力）</button><button data-combat-action="defend">防御（减伤并回魂）</button><button data-combat-action="dodge">闪避（敏捷判定）</button><button data-combat-action="recover">调息（回复魂力）</button><button data-combat-action="flee">尝试撤退</button></div></section>`;
    }

    function combatMeter(label, value, max, soul) {
      const pct = max > 0 ? clamp(value / max * 100) : 0;
      return `<div class="meter"><div class="meter-head"><span>${label}</span><span>${Math.round(value)}/${Math.round(max)}</span></div><div class="meter-track ${soul ? "soul" : ""}"><i style="width:${pct}%"></i></div></div>`;
    }

    function bindCombatView() {
      document.querySelectorAll("[data-combat-action]").forEach((button) => button.onclick = () => combatPlayerAction(button.dataset.combatAction));
      if ($("#absorbNow")) $("#absorbNow").onclick = () => resolveImmediateRing(true);
      if ($("#discardRing")) $("#discardRing").onclick = () => resolveImmediateRing(false);
      if ($("#absorbBoneNow")) $("#absorbBoneNow").onclick = () => resolveImmediateBone(true);
      if ($("#discardBone")) $("#discardBone").onclick = () => resolveImmediateBone(false);
    }

    function combatPlayerAction(action) {
      const combat = state.combat;
      const c = state.character;
      if (!combat || state.pendingHunt) return;
      combat.defending = false;
      combat.dodging = false;
      if (action === "flee") {
        const chance = clamp(38 + (c.stats.agility - combat.agility) * .8 + c.stats.luck * .15, 8, 88);
        if (Math.random() * 100 <= chance) {
          combat.log.unshift(`${c.name}抓住地形空隙脱离战斗。`);
          advanceDays(1); state.combat = null; state.gameView = "story"; render(); return;
        }
        combat.log.unshift(`${c.name}尝试撤退，但${combat.beast.name}封住了路线。`);
      } else if (action === "attack") {
        const damage = Math.max(1, Math.round(c.stats.strength * .55 + c.level * .75 + randomInt(4, 12) - combat.defense * .45));
        combat.hp -= damage;
        combat.log.unshift(`${c.name}发动普通攻击，造成${damage}点伤害。`);
      } else if (action === "skill") {
        if (c.soul < 15) return toast("魂力不足。");
        c.soul -= 15;
        const ringBonus = c.rings.length ? 18 + c.rings.length * 4 : 8;
        const damage = Math.max(3, Math.round(c.mental * .45 + c.level + ringBonus + randomInt(5, 16) - combat.defense * .25));
        combat.hp -= damage;
        combat.log.unshift(`${c.name}释放${c.rings.length ? c.rings.at(-1).skill : c.spirits[0].name + "强化"}，造成${damage}点伤害。`);
      } else if (action === "defend") {
        combat.defending = true;
        c.soul = Math.min(c.maxSoul, c.soul + 6);
        combat.log.unshift(`${c.name}稳住重心进入防御，回复6点魂力。`);
      } else if (action === "dodge") {
        combat.dodging = true;
        combat.log.unshift(`${c.name}观察魂兽肩背变化，准备闪避。`);
      } else if (action === "recover") {
        c.soul = Math.min(c.maxSoul, c.soul + 16);
        combat.log.unshift(`${c.name}调匀呼吸，回复16点魂力。`);
      }
      if (combat.hp <= 0) return winCombat();
      enemyCombatTurn();
      if (state.screen !== "ending") { combat.turn += 1; render(); }
    }

    function enemyCombatTurn() {
      const combat = state.combat;
      const c = state.character;
      if (combat.dodging) {
        const dodgeChance = clamp(35 + (c.stats.agility - combat.agility) * 1.1 + c.stats.luck * .12, 8, 86);
        if (Math.random() * 100 <= dodgeChance) { combat.log.unshift(`${c.name}避开${combat.beast.name}的${combat.beast.traits[0]}攻击。`); return; }
      }
      let damage = Math.max(1, Math.round(combat.attack + randomInt(3, 12) - c.stats.defense * .24));
      if (combat.defending) damage = Math.max(1, Math.round(damage * .38));
      takeDamage(damage, `${combat.beast.name}以${combat.beast.traits[0]}命中${c.name}`);
      if (state.screen !== "ending") combat.log.unshift(`${combat.beast.name}发动${combat.beast.traits[0]}，造成${damage}点伤害。`);
    }

    function takeDamage(amount, reason) {
      const c = state.character;
      c.hp = Math.max(0, c.hp - Math.max(0, Math.round(amount)));
      state.journal.unshift(`${dateText()}｜${reason}，生命-${Math.round(amount)}。`);
      if (c.hp <= 0) {
        c.hp = 0;
        state.ending = { title: "结局：生命归零", text: `${c.name}的生命值降至零。最后一次伤害来自：${reason}。这段命途在此结束，只能读取此前存档或开启新的角色。` };
        state.screen = "ending";
        state.combat = null;
        state.pendingHunt = null;
      }
    }

    function applyBacklash(amount, reason) {
      const damage = Math.max(1, Math.round(amount * 3 + state.character.level * .15));
      takeDamage(damage, `${reason}反噬`);
    }

    function winCombat() {
      const combat = state.combat;
      const boneChance = clamp(3 + Math.log10(combat.years + 10) * 2 + state.character.stats.luck * .05, 3, 20);
      let bone = null;
      if (Math.random() * 100 <= boneChance) {
        const empty = BONE_SLOTS.filter((slot) => !state.character.bones[slot]);
        if (empty.length) {
          const slot = pick(empty);
          bone = { beast: combat.beast, years: combat.years, slot, name: `${combat.beast.name}${slot}` };
        }
      }
      state.pendingHunt = { beast: combat.beast, years: combat.years, bone, phase: "ring" };
      combat.hp = 0;
      combat.log.unshift(`${combat.beast.name}失去生命，魂环在尸体上方凝聚。`);
      state.journal.unshift(`${dateText()}｜击杀${combat.years.toLocaleString()}年${combat.beast.name}。`);
      render();
    }

    function huntDecisionHtml() {
      const hunt = state.pendingHunt;
      const c = state.character;
      if (hunt.phase === "bone") {
        if (!hunt.bone) return `<section class="combat-stage"><div class="victory-box"><h2>战斗结束</h2><p>这只魂兽没有产出魂骨。</p><button class="primary cta" id="discardBone">返回</button></div></section>`;
        return `<section class="combat-stage"><div class="victory-box"><div class="step">魂骨当场处理</div><h2>${esc(hunt.bone.name)}</h2><p>${hunt.bone.years.toLocaleString()}年${esc(hunt.bone.slot)}，继承${esc(hunt.beast.traits.join("、"))}特性。离开后魂骨将不再保留。</p><div class="actions"><button class="primary cta" id="absorbBoneNow">立即融合</button><button class="cta" id="discardBone">放弃魂骨</button></div></div></section>`;
      }
      const canAbsorb = state.species === "human" && atRingGate();
      return `<section class="combat-stage"><div class="victory-box"><div class="step">战斗胜利 · 魂环当场处理</div><h2>${hunt.years.toLocaleString()}年${esc(hunt.beast.name)}魂环</h2><p>属性：${esc(hunt.beast.element)} · 特性：${esc(hunt.beast.traits.join("、"))}</p>${canAbsorb ? `<div class="field"><label for="combatSpiritTarget">选择承载武魂</label><select class="modal-input" id="combatSpiritTarget">${c.spirits.map((spirit, index) => `<option value="${index}">${index + 1}. ${esc(spirit.name)}（${esc(spirit.type)}）</option>`).join("")}</select></div>` : `<div class="notice">${state.species === "human" ? "当前不处于魂环瓶颈，无法吸收。" : "魂兽本体不吸收人类魂环。"}</div>`}<div class="actions"><button class="primary cta" id="absorbNow" ${canAbsorb ? "" : "disabled"}>当场吸收</button><button class="cta" id="discardRing">不吸收</button></div></div></section>`;
    }

    function resolveImmediateRing(absorb) {
      const hunt = state.pendingHunt;
      if (!hunt) return;
      if (absorb) {
        const c = state.character;
        const spiritIndex = Number($("#combatSpiritTarget").value || 0);
        const spirit = c.spirits[spiritIndex] || c.spirits[0];
        const limit = ringLimit();
        const overload = Math.max(0, hunt.years - limit) / Math.max(1, limit);
        const chance = Math.round(clamp(90 - overload * 85 + c.stats.luck * .1, 5, 97));
        if (Math.random() * 100 <= chance) {
          const derived = deriveRingSkill(spirit, hunt.beast);
          const color = ringColor(hunt.years);
          c.rings.push({ years: hunt.years, colorClass: color.cls, beastName: hunt.beast.name, spiritIndex, skill: derived.skill, skillDescription: derived.description });
          c.level = Math.min(100, c.level + 1);
          c.maxHp += randomInt(6, 14); c.hp = Math.min(c.maxHp, c.hp + randomInt(8, 18));
          c.maxSoul += randomInt(5, 12); c.soul = Math.min(c.maxSoul, c.soul + 12);
          state.journal.unshift(`${dateText()}｜当场吸收${hunt.beast.name}魂环，获得“${derived.skill}”。`);
          toast(`吸收成功，获得魂技“${derived.skill}”。`);
        } else {
          applyBacklash(randomInt(10, 20), `吸收${hunt.beast.name}魂环失败。`);
          if (state.screen === "ending") return render();
          toast("魂环吸收失败，反噬直接扣除生命值。");
        }
      } else state.journal.unshift(`${dateText()}｜放弃${hunt.beast.name}魂环。`);
      hunt.phase = "bone";
      render();
    }

    function resolveImmediateBone(absorb) {
      const hunt = state.pendingHunt;
      if (!hunt) return;
      if (absorb && hunt.bone) {
        const loot = hunt.bone;
        const c = state.character;
        const difficulty = Math.log10(loot.years + 10) * 11;
        const chance = Math.round(clamp(54 + c.mental * .28 + c.stats.physique * .3 + c.stats.luck * .1 - difficulty, 5, 94));
        if (Math.random() * 100 <= chance) {
          const derived = deriveBoneSkill(loot);
          c.bones[loot.slot] = { years: loot.years, name: loot.name, beastName: loot.beast.name, skill: derived.skill, skillDescription: derived.description };
          c.maxHp += randomInt(10, 25); c.hp = Math.min(c.maxHp, c.hp + 15);
          state.journal.unshift(`${dateText()}｜当场融合${loot.name}，获得“${derived.skill}”。`);
          toast(`融合成功，获得魂骨技“${derived.skill}”。`);
        } else {
          applyBacklash(randomInt(8, 18), `融合${loot.name}失败。`);
          if (state.screen === "ending") return render();
          toast("魂骨融合失败，反噬直接扣除生命值。");
        }
      } else if (hunt.bone) state.journal.unshift(`${dateText()}｜放弃${hunt.bone.name}。`);
      advanceDays(randomInt(1, 2));
      state.pendingHunt = null;
      state.combat = null;
      state.gameView = "story";
      render();
    }

    function deriveRingSkill(spirit, beast) {
      const suffix = { "器武魂": "铸锋", "兽武魂": "化身", "植物系武魂": "缚生", "元素武魂": "共鸣", "本体武魂": "淬体" }[spirit.type] || "共鸣";
      const skill = `${beast.element}${suffix}·${beast.traits[0]}`;
      const description = `将${beast.name}的${beast.traits.join("与")}特性融入${spirit.name}，发动时以${beast.element}属性强化${spirit.type}的核心能力。`;
      return { skill, description };
    }

    function deriveBoneSkill(loot) {
      const suffix = { "头骨": "魂识映照", "躯干骨": "本源守护", "外附魂骨": "形态延展", "左臂骨": "左臂爆发", "右臂骨": "右臂爆发", "左腿骨": "左腿瞬步", "右腿骨": "右腿瞬步", "指骨": "精准掌控" }[loot.slot];
      return { skill: `${loot.beast.element}·${suffix}`, description: `继承${loot.beast.name}的${loot.beast.traits.join("与")}特性；魂骨技效果只由产出魂兽与${loot.slot}部位决定。` };
    }

    function offerSoulRing(index) {
      if (state.species !== "human" || !atRingGate()) return toast("当前没有可突破的魂环瓶颈。");
      const loot = state.trophies.rings[index];
      if (!loot) return toast("没有这枚魂环战利品。");
      const c = state.character;
      const limit = ringLimit();
      const overload = Math.max(0, loot.years - limit) / Math.max(1, limit);
      const chance = Math.round(clamp(90 - overload * 85 + c.stats.luck * .1, 5, 97));
      const options = c.spirits.map((spirit, i) => `<option value="${i}">${i + 1}. ${esc(spirit.name)}（${esc(spirit.type)}）</option>`).join("");
      openModal(`吸收${loot.beast.name}魂环`, `<p>${loot.years.toLocaleString()}年魂环 · 建议上限${limit.toLocaleString()}年 · 成功率<strong>${chance}%</strong></p><div class="field"><label for="spiritTarget">选择承载武魂</label><select class="modal-input" id="spiritTarget">${options}</select></div><p class="muted">魂技会同时参考产出魂兽“${esc(loot.beast.name)}”与所选武魂。</p>`, "开始吸收", () => resolveSoulRingFromLoot(index, Number($("#spiritTarget").value), chance));
    }

    function resolveSoulRingFromLoot(index, spiritIndex, chance) {
      const loot = state.trophies.rings[index];
      if (!loot) return closeModal();
      const c = state.character;
      const spirit = c.spirits[spiritIndex] || c.spirits[0];
      const color = ringColor(loot.years);
      const derived = deriveRingSkill(spirit, loot.beast);
      state.trophies.rings.splice(index, 1);
      closeModal();
      advanceDays(1);
      if (Math.random() * 100 <= chance) {
        c.rings.push({ years: loot.years, colorClass: color.cls, beastName: loot.beast.name, spiritIndex, skill: derived.skill, skillDescription: derived.description });
        c.level = Math.min(100, c.level + 1);
        c.mental = clamp(c.mental + randomInt(1, 3));
        c.stats.physique = clamp(c.stats.physique + randomInt(1, 3));
        state.journal.unshift(`${dateText()}｜${spirit.name}吸收${loot.beast.name}魂环，获得“${derived.skill}”。`);
        toast(`吸收成功，获得魂技“${derived.skill}”。`);
      } else {
        applyBacklash(randomInt(10, 20), `吸收${loot.beast.name}魂环失败。`);
        toast("吸收失败，魂环消散并造成反噬。");
      }
      render();
    }

    function offerSoulBone(index) {
      const loot = state.trophies.bones[index];
      if (!loot) return toast("没有这块魂骨战利品。");
      if (state.character.bones[loot.slot]) return toast(`${loot.slot}已经融合魂骨。`);
      const c = state.character;
      const difficulty = Math.log10(loot.years + 10) * 11;
      const chance = Math.round(clamp(54 + c.mental * .28 + c.stats.physique * .3 + c.stats.luck * .1 - difficulty, 5, 94));
      openModal(`融合${loot.name}`, `<p>${loot.years.toLocaleString()}年${loot.slot}<br>产出魂兽：${esc(loot.beast.name)}<br>成功率：<strong>${chance}%</strong></p><p class="muted">魂骨技只参考${esc(loot.beast.name)}的${esc(loot.beast.traits.join("、"))}特性。</p>`, "开始融合", () => resolveSoulBoneFromLoot(index, chance));
    }

    function resolveSoulBoneFromLoot(index, chance) {
      const loot = state.trophies.bones[index];
      if (!loot) return closeModal();
      state.trophies.bones.splice(index, 1);
      closeModal();
      advanceDays(1);
      if (Math.random() * 100 <= chance) {
        const derived = deriveBoneSkill(loot);
        state.character.bones[loot.slot] = { years: loot.years, name: loot.name, beastName: loot.beast.name, skill: derived.skill, skillDescription: derived.description };
        state.character.mental = clamp(state.character.mental + randomInt(1, 4));
        state.journal.unshift(`${dateText()}｜融合${loot.name}，获得魂骨技“${derived.skill}”。`);
        toast(`融合成功，获得魂骨技“${derived.skill}”。`);
      } else {
        applyBacklash(randomInt(8, 18), `融合${loot.name}失败。`);
        toast("融合失败，魂骨损毁并造成反噬。");
      }
      render();
    }

    function openInfoModal(title, body) {
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = body;
      $("#modalActions").innerHTML = `<button class="primary" id="modalOkay">知道了</button>`;
      $("#modalOkay").onclick = closeModal;
      $("#modalMask").classList.add("show");
    }

    function renderSide() {
      const side = $("#side");
      if (!state.character) {
        side.innerHTML = `<section class="panel"><h3>长期玩法</h3><ul class="rule-list"><li>日期按年、月、日持续推进</li><li>剧情、地图、面板、成长与关系各自独立</li><li>回合制RPG战斗包含魂技、防御、闪避与撤退</li><li>魂环与魂骨只在击杀后当场处理</li><li>反噬直接扣除生命，生命归零即结束</li></ul></section>`;
        return;
      }
      const c = state.character;
      if (state.screen !== "game") {
        side.innerHTML = `<section class="panel"><h3>当前角色</h3><div class="identity-name">${esc(c.name)}</div><div class="identity-meta">${state.species === "human" ? "人类" : "魂兽"} · ${c.level}级</div></section><section class="panel"><h3>规则摘要</h3><div class="empty">确认个人面板并选择时代后，将进入独立的长期游戏页面。</div></section>`;
        return;
      }
      const location = currentLocationData();
      const npcs = currentNpcs();
      side.innerHTML = `<section class="panel"><h3>世界时间</h3><div class="identity-name">${esc(dateText())}</div><div class="identity-meta">${esc(location?.name || "未知地点")}</div></section><section class="panel"><h3>角色状态</h3><div class="level-row"><div><span class="level-number">${c.level}</span> 级</div><span>${atRingGate() ? "魂环瓶颈" : c.godhood ? "已成神" : "成长中"}</span></div>${combatMeter("生命", c.hp, c.maxHp, false)}${combatMeter("魂力", c.soul, c.maxSoul, true)}<div class="compact-stats" style="margin-top:12px">${compactBar("精神力", c.mental)}${compactBar("体质", c.stats.physique)}</div></section><section class="panel"><h3>当地关系</h3>${npcs.length ? npcs.map((npc) => { const r = state.npcRelations[npc.id]; return `<div class="ring"><b>${esc(npc.name)} · ${relationStage(r)}</b><br><span class="muted">亲近${r.affinity} / 信任${r.trust} / 尊重${r.respect} / 戒备${r.suspicion}</span></div>`; }).join("") : `<div class="empty">当前没有主要人物。</div>`}</section><section class="panel"><h3>随身物品</h3><div class="empty">可赠送礼物 ${state.gifts} 件<br>魂环与魂骨不进入背包。</div></section><section class="panel"><h3>近期记录</h3><div class="journal">${state.journal.slice(0, 12).map((line) => `<div class="log-line">${esc(line)}</div>`).join("")}</div></section>`;
    }

    function renderEnding() {
      $("#main").innerHTML = `<section class="chapter-visual"><div class="eyebrow">成长受到重创</div><h2>${esc(state.ending.title)}</h2><p>${esc(dateText())}</p></section><article class="story"><p>${esc(state.ending.text)}</p></article><div class="choices"><button class="choice" id="loadAfterEnd"><span><strong>读取存档</strong><small>返回最近保存的长期进度。</small></span></button><button class="choice" id="newLife"><span><strong>开启全新命格</strong><small>重新随机全部初始属性。</small></span></button></div>`;
      $("#loadAfterEnd").onclick = loadGame;
      $("#newLife").onclick = () => { resetState(); state.screen = "species"; render(); };
    }

    function loadGame() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return toast("没有找到本地存档。");
      try {
        const saved = JSON.parse(raw);
        Object.assign(state, saved, { modalConfirm: null });
        state.journal = Array.isArray(state.journal) ? state.journal : [];
        state.dialogueLog = Array.isArray(state.dialogueLog) ? state.dialogueLog : [];
        state.trophies = state.trophies || { rings: [], bones: [] };
        render(); toast("已读取本地存档。");
      } catch (error) { toast("存档损坏，无法读取。"); }
    }

    function resetState() {
      Object.assign(state, { screen: "welcome", species: null, character: null, timelineId: null, nodeId: null, ending: null, bond: 0, journal: [], modalConfirm: null, gameView: "story", worldDate: null, currentLocation: null, unlockedLocations: [], npcRelations: {}, dialogueLog: [], trophies: { rings: [], bones: [] }, gifts: 3, storyCompleted: false });
    }

    function openModal(title, body, confirmText, onConfirm) {
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = body;
      $("#modalActions").innerHTML = `<button id="modalCancel">取消</button><button class="primary" id="modalConfirm">${esc(confirmText)}</button>`;
      state.modalConfirm = onConfirm;
      $("#modalCancel").onclick = closeModal;
      $("#modalConfirm").onclick = () => state.modalConfirm?.();
      $("#modalMask").classList.add("show");
    }

    function closeModal() {
      $("#modalMask").classList.remove("show");
      state.modalConfirm = null;
    }

    let toastTimer;
    function toast(text) {
      const element = $("#toast");
      element.textContent = text;
      element.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove("show"), 2400);
    }

    function saveGame() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, modalConfirm: null }));
      toast("进度已保存在本机浏览器。 ");
    }

    function loadGame() {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("douluo_myriad_paths_save_v4") || localStorage.getItem("douluo_myriad_paths_save_v3");
      if (!raw) return toast("没有找到本地存档。 ");
      try {
        const saved = JSON.parse(raw);
        Object.assign(state, saved, { modalConfirm: null });
        state.journal = Array.isArray(state.journal) ? state.journal : [];
        state.dialogueLog = Array.isArray(state.dialogueLog) ? state.dialogueLog : [];
        state.trophies = { rings: [], bones: [] };
        state.combat = state.combat || null;
        state.pendingHunt = state.pendingHunt || null;
        state.deadNpcs = state.deadNpcs || {};
        state.worldFlags = state.worldFlags || {};
        state.interventions = Array.isArray(state.interventions) ? state.interventions : [];
        state.spiritEssence = Number.isFinite(state.spiritEssence) ? state.spiritEssence : 0;
        state.awakeningStep = Number.isFinite(state.awakeningStep) ? state.awakeningStep : 2;
        if (state.timelineId) for (const npc of NPC_TEMPLATES[state.timelineId]) if (!state.npcRelations[npc.id]) state.npcRelations[npc.id] = { affinity:8, trust:6, respect:8, suspicion:state.species==="beast"?18:6, interactions:0, memories:[], lastTalk:null };
        if (state.character) {
          const c = state.character;
          c.maxHp = Number.isFinite(c.maxHp) ? c.maxHp : 100 + c.stats.physique * 5 + c.level * 4;
          c.hp = Number.isFinite(c.hp) ? clamp(c.hp, 0, c.maxHp) : c.maxHp;
          c.maxSoul = Number.isFinite(c.maxSoul) ? c.maxSoul : 40 + c.mental * 2 + c.level * 2;
          c.soul = Number.isFinite(c.soul) ? clamp(c.soul, 0, c.maxSoul) : c.maxSoul;
          c.spirits = c.spirits.map(s=>({ ...s, qualityRank:Number.isFinite(s.qualityRank)?s.qualityRank:rollSpiritQuality(c.spirits.length>1), evolutionHistory:s.evolutionHistory||[] }));
          c.fusionSkills = Array.isArray(c.fusionSkills) ? c.fusionSkills : buildFusionSkills(c.spirits);
          c.awakened = c.awakened !== false;
          delete c.backlash;
        }
        render();
        toast("已读取本地存档。 ");
      } catch (error) { toast("存档损坏，无法读取。 "); }
    }

    function resetState() {
      Object.assign(state, { screen: "welcome", species: null, character: null, timelineId: null, nodeId: null, ending: null, bond: 0, journal: [], modalConfirm: null, gameView: "story", worldDate: null, currentLocation: null, unlockedLocations: [], npcRelations: {}, dialogueLog: [], trophies: { rings: [], bones: [] }, gifts: 3, storyCompleted: false, combat: null, pendingHunt: null, selectedNpc: null, awakeningStep:0, deadNpcs:{}, worldFlags:{}, interventions:[], spiritEssence:0 });
    }

    /* V5：觉醒、品质、世界分歧与统一技能系统 */
    function rollSpiritQuality(multi = false) {
      const roll = Math.random();
      let rank = roll < .03 ? 5 : roll < .11 ? 4 : roll < .28 ? 3 : roll < .56 ? 2 : roll < .84 ? 1 : 0;
      if (multi) rank = Math.max(2, rank);
      return rank;
    }

    function fusionName(a, b) {
      const motifs = { "器武魂":"锋", "兽武魂":"魂", "植物系武魂":"生", "元素武魂":"域", "本体武魂":"体" };
      return `${a.name.slice(0, 2)}·${b.name.slice(0, 2)}${motifs[a.type]}${motifs[b.type]}`;
    }

    function buildFusionSkills(spirits) {
      const result = [];
      for (let i = 0; i < spirits.length; i++) for (let j = i + 1; j < spirits.length; j++) {
        const a = spirits[i], b = spirits[j];

    function generateCharacter(species) {
      const isHuman = species === "human";
      const spiritCountRoll = Math.random();

      const spirits = (isHuman ? uniquePicks(SPIRITS, spiritCount) : [pick(BEASTS)]).map((spirit) => ({ ...spirit, qualityRank: rollSpiritQuality(spiritCount > 1), evolutionHistory: [] }));
      const hasSpecial = spirits.some((spirit) => spirit.special);
      const innate = isHuman ? (spiritCount > 1 ? 10 : hasSpecial && Math.random() < .28 ? randomInt(11, 16) : randomInt(1, 10)) : null;
      const cultivationYears = isHuman ? null : rollCultivationYears();
      const level = isHuman ? innate : Math.max(10, Math.min(95, Math.floor(Math.log10(cultivationYears) * 15)));
      const stats = { strength:randomInt(18,72), physique:randomInt(20,76), defense:randomInt(16,70), agility:randomInt(18,76), luck:randomInt(5,120) };
      const mental = randomInt(24,88);
      const maxHp = 120 + stats.physique * 5 + level * 5;
      const maxSoul = 55 + mental * 2 + level * 3;
      return { name:pick(isHuman ? HUMAN_NAMES : BEAST_NAMES), gender:pick(GENDERS), age:isHuman ? 6 : randomInt(8,600), innatePower:innate, level, mental, charm:randomInt(12,110), spirits, rings:[], bones:emptyBones(), soulDevice:isHuman ? pick(DEVICES) : (Math.random()<.18 ? "缴获的储物魂导器" : "无（魂兽本体）"), identities:[isHuman?"人类":"魂兽",pick(isHuman?HUMAN_ORIGINS:BEAST_ORIGINS)], stats, cultivationYears, title:"", godhood:false, maxHp, hp:maxHp, maxSoul, soul:maxSoul, fusionSkills:buildFusionSkills(spirits), awakened:false };

    function physiqueStageCap(level = state.character.level) {
      if (level >= 100) return 1800;
      if (level >= 90) return 1400;
      if (level >= 70) return 1000;
      if (level >= 50) return 700;
      if (level >= 30) return 460;
      if (level >= 10) return 280;

    function statLimit(key) {
      if (key === "physique") return physiqueStageCap();
      if (key === "luck") return 500;
      return 300 + state.character.level * 12;
    }

    function raiseStat(key, amount) {
      const c = state.character;
      c.stats[key] = Math.min(statLimit(key), Math.max(0, c.stats[key] + amount));
    }

    function applyGrowthRewards(source, scale = 1) {
      const c = state.character;
      const table = source === "bone" ? {strength:3,physique:5,defense:4,agility:2,luck:1} : source === "ring" ? {strength:2,physique:3,defense:2,agility:2,luck:1} : {strength:1,physique:2,defense:1,agility:1,luck:1};
      for (const [key,value] of Object.entries(table)) raiseStat(key, Math.max(1, Math.round(value*scale)));
      c.mental += Math.max(1, Math.round((source === "bone" ? 5 : source === "ring" ? 3 : 1) * scale));
      c.maxHp += Math.round((source === "bone" ? 28 : source === "ring" ? 18 : 10) * scale);
      c.maxSoul += Math.round((source === "bone" ? 16 : source === "ring" ? 12 : 8) * scale);
      c.hp = Math.min(c.maxHp, c.hp + Math.round(c.maxHp * .18)); c.soul = Math.min(c.maxSoul, c.soul + Math.round(c.maxSoul * .25));

    function gainLevels(amount) {

        if (c.level >= 100) break;
        c.level += 1; applyGrowthRewards("level", 1 + Math.floor(c.level/20)*.2);
      }
      if (c.level >= 100) { c.level=100; c.godhood=true; if(!c.identities.includes("百级神祇"))c.identities.push("百级神祇"); }
    }

    function applyEffects(effects) {
      const c=state.character;
      for(const [key,value] of Object.entries(effects)) {
        if(key==="level") gainLevels(value); else if(key==="mental") c.mental=Math.max(0,c.mental+value); else if(key==="charm") c.charm=Math.max(0,(c.charm||0)+value); else if(key==="bond") state.bond=clamp(state.bond+value); else if(key==="backlash") applyBacklash(value,"剧情行动承受魂力冲击。"); else if(key==="age") c.age=Math.max(0,c.age+value); else if(key in c.stats) raiseStat(key,value);
      }
    }

    function beginNpcCombat(npc,rating) {
      closeModal(); const maxHp=160+rating*9;

    function killNpc(id) {

      state.character.identities.push(`${npc.name}击杀者`);state.journal.unshift(`${dateText()}｜${npc.name}死亡，世界线产生永久偏移。`);

    function allCombatSkills() {
      const c=state.character, skills=[];
      c.spirits.forEach((spirit,index)=>skills.push({name:`${spirit.name}·本源释放`,kind:"武魂技",cost:12,power:22+(spirit.qualityRank||0)*8,description:`${SPIRIT_QUALITIES[spirit.qualityRank||0].name}${spirit.type}的基础释放。`,qualityMultiplier:SPIRIT_QUALITIES[spirit.qualityRank||0].multiplier}));

    function combatViewHtml() {

    function finishPlayerTurn() {

    function combatPlayerAction(action) {
      const combat=state.combat,c=state.character;if(!combat||state.pendingHunt)return;
      if(action==="skills"){combat.skillMenu=!combat.skillMenu;render();return;}
      combat.defending=false;combat.dodging=false;
      if(action==="flee"){const chance=clamp(38+(c.stats.agility-combat.agility)*.8+c.stats.luck*.12,8,88);if(Math.random()*100<=chance){combat.log.unshift(`${c.name}脱离战斗。`);advanceDays(1);state.combat=null;state.gameView=combat.npcId?"relations":"story";render();return;}combat.log.unshift(`${combat.beast.name}封住了撤退路线。`);}
      else if(action==="attack"){const damage=Math.max(1,Math.round(c.stats.strength*.58+c.level*.8+randomInt(5,14)-combat.defense*.42));combat.hp-=damage;combat.log.unshift(`${c.name}发动普通攻击，造成${damage}点伤害。`);}
      else if(action==="defend"){combat.defending=true;c.soul=Math.min(c.maxSoul,c.soul+8);combat.log.unshift(`${c.name}稳住防线，回复8点魂力。`);}
      else if(action==="dodge"){combat.dodging=true;combat.log.unshift(`${c.name}观察对手动作，准备闪避。`);}
      else if(action==="recover"){c.soul=Math.min(c.maxSoul,c.soul+20);combat.log.unshift(`${c.name}完成调息，回复20点魂力。`);}

    }

    function useCombatSkill(index) {

    }

    function nextEnemyIntent(combat) {
      if(combat.turn%4===0)return "guard";if(combat.turn%3===0)return "heavy";return Math.random()<.45?"quick":"pressure";
    }

    function setupCombat(target,npcId=null) {
