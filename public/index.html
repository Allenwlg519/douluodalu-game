      state.combat={beast:target.beast,npcId,years:target.years,hp:maxHp,maxHp,attack:Math.round(npcId?18+target.rating*1.5:10+scale*10),defense:Math.round(npcId?12+target.rating:5+scale*6),agility:Math.round(npcId?15+target.rating*.9:10+scale*9),stamina:100,maxStamina:100,enemyStamina:100,turn:1,defending:false,dodging:false,inspected:false,weakness:null,statuses:[],enemyStatuses:[],skillMenu:false,log:[npcId?`${target.beast.name}确认你的杀意，立即拉开距离。`:`${target.beast.name}压低身体，${target.beast.temperament}。`]};state.combat.enemyIntent=nextEnemyIntent(state.combat);state.pendingHunt=null;state.gameView="combat";render();
    }

    function beginCombat(target){closeModal();setupCombat({beast:target.beast,years:target.years});}
    function beginNpcCombat(npc,rating){closeModal();setupCombat({beast:{name:npc.name,element:"魂师",traits:["魂技","反击"],temperament:"不再保留力量"},years:rating*100,rating},npc.id);}

    function combatViewHtml() {

      const skills=allCombatSkills(),enemyLabel=combat.npcId?"魂师生死战":`${combat.years.toLocaleString()}年魂兽`,intentNames={quick:"快速突袭",heavy:"蓄力重击",guard:"收势防守",pressure:"压迫进攻"},canRead=combat.inspected||c.mental>=80;
      const drawer=combat.skillMenu?`<div class="skill-drawer"><div class="section-head"><div><div class="step">统一技能菜单</div><h3>武魂、魂环、魂骨与融合技</h3></div><span class="tag">魂力 ${Math.round(c.soul)}</span></div><div class="skill-grid">${skills.map((skill,index)=>`<button class="skill-option" data-use-skill="${index}" ${c.soul>=skill.cost&&combat.stamina>=10?"":"disabled"}><span class="skill-kind">${esc(skill.kind)}</span><strong>${esc(skill.name)} · ${skill.cost}魂力</strong><span>${esc(skill.description)}${skill.compatibility?` 契合度${skill.compatibility}%。`:""}</span></button>`).join("")}</div></div>`:"";
      return `<section class="combat-stage"><div class="section-head"><div><div class="step">RPG 战斗 / 第${combat.turn}回合</div><h2>${esc(combat.beast.name)}</h2><p>${enemyLabel} · ${esc(combat.beast.element)} · ${esc(combat.beast.traits.join("、"))}</p></div><span class="status-chip">敌方意图：${canRead?intentNames[combat.enemyIntent]:"尚未看清"}</span></div><div class="combatants"><article class="combatant"><h3>${esc(c.name)}</h3><div class="meta">${c.level}级 · ${esc(c.spirits.map(s=>s.name).join(" / "))}</div>${combatMeter("生命",c.hp,c.maxHp,false)}${combatMeter("魂力",c.soul,c.maxSoul,true)}${combatMeter("体力",combat.stamina,combat.maxStamina,false)}<div class="combat-detail-grid"><span>命中 ${Math.round(65+c.mental*.08+c.stats.agility*.12)}%</span><span>暴击 ${Math.round(5+c.stats.luck*.08)}%</span><span>防御 ${c.stats.defense}</span><span>状态 ${combat.statuses.join("、")||"正常"}</span></div></article><div class="versus">VS</div><article class="combatant enemy"><h3>${esc(combat.beast.name)}</h3><div class="meta">${enemyLabel}</div>${combatMeter("生命",Math.max(0,combat.hp),combat.maxHp,false)}${combatMeter("体力",combat.enemyStamina,100,false)}<div class="combat-detail-grid"><span>攻击 ${Math.round(combat.attack)}</span><span>防御 ${Math.round(combat.defense)}</span><span>敏捷 ${Math.round(combat.agility)}</span><span>弱点 ${combat.weakness||"未识破"}</span></div></article></div><div class="combat-log">${combat.log.slice(0,12).map(line=>`<div>${esc(line)}</div>`).join("")}</div><div class="combat-actions"><button data-combat-action="attack" ${combat.stamina>=12?"":"disabled"}>普通攻击 · 12体力</button><button class="primary" data-combat-action="skills">技能（${skills.length}）</button><button data-combat-action="defend">格挡与回魂</button><button data-combat-action="dodge" ${combat.stamina>=18?"":"disabled"}>闪避 · 18体力</button><button data-combat-action="inspect">洞察意图</button><button data-combat-action="recover">调息</button><button data-combat-action="negotiate">${combat.npcId?"停战交涉":"威慑 / 共感"}</button><button data-co     function finishPlayerTurn(){const combat=state.combat;if(combat.hp<=0)return winCombat();enemyCombatTurn();if(state.screen!=="ending"&&state.combat){combat.turn++;combat.skillMenu=false;combat.enemyIntent=nextEnemyIntent(combat);render();}}

    function combatPlayerAction(action) {
      const combat=state.combat,c=state.character;if(!combat||state.pendingHunt)return;if(action==="skills"){combat.skillMenu=!combat.skillMenu;render();return;}combat.defending=false;combat.dodging=false;
      if(action==="flee"){const chance=clamp(28+(c.stats.agility-combat.agility)*.9+c.stats.luck*.12,8,88);if(Math.random()*100<=chance){advanceDays(1);state.combat=null;state.gameView=combat.npcId?"relations":"story";toast("成功脱离战斗。");render();return;}combat.log.unshift(`${combat.beast.name}封住撤退路线。`);}
      else if(action==="attack"){combat.stamina-=12;const hit=clamp(72+(c.stats.agility-combat.agility)*.35+c.mental*.04,25,96);if(Math.random()*100>hit)combat.log.unshift(`${c.name}的攻击被对方预判，落点偏开。`);else{const crit=Math.random()*100<5+c.stats.luck*.08,weak=combat.weakness?1.18:1,damage=Math.max(1,Math.round((c.stats.strength*.58+c.level*.8+randomInt(5,14)-combat.defense*.42)*(crit?1.7:1)*weak));combat.hp-=damage;combat.log.unshift(`${c.name}命中${combat.weakness||"躯干"}，造成${damage}点伤害${crit?"（暴击）":""}。`);}}
      else if(action==="defend"){combat.defending=true;combat.stamina=Math.min(100,combat.stamina+16);c.soul=Math.min(c.maxSoul,c.soul+8);combat.log.unshift(`${c.name}收紧防线，回复16体力与8魂力。`);}
      else if(action==="dodge"){combat.stamina-=18;combat.dodging=true;combat.log.unshift(`${c.name}压低重心，准备以步法避开下一击。`);}
      else if(action==="inspect"){combat.inspected=true;combat.weakness=pick(["左侧发力点","魂力回路间隙","转身盲区","旧伤位置"]);combat.log.unshift(`${c.name}读出敌方下一步是“${{quick:"快速突袭",heavy:"蓄力重击",guard:"收势防守",pressure:"压迫进攻"}[combat.enemyIntent]}”，并发现${combat.weakness}。`);}
      else if(action==="recover"){combat.stamina=Math.min(100,combat.stamina+32);c.soul=Math.min(c.maxSoul,c.soul+18);combat.log.unshift(`${c.name}调整呼吸，回复32体力与18魂力。`);}
      else if(action==="negotiate"){const empathy=(c.talents||[]).includes("beast_voice"),chance=clamp((c.charm||0)*.45+c.mental*.12+(combat.npcId?15:empathy?30:-20),5,90);if(Math.random()*100<=chance){if(combat.npcId){const r=state.npcRelations[combat.npcId];if(r){r.suspicion=clamp(r.suspicion+15);r.affinity=clamp(r.affinity-8);}state.combat=null;state.gameView="relations";toast("对方接受停战，但不会忘记这次袭击。");render();return;}state.interventions.push(`${dateText()}｜以共感与威慑放走${combat.beast.name}`);state.combat=null;state.gameView="story";toast("魂兽退出战斗；没有魂环或魂骨掉落。");render();return;}combat.log.unshift(`${combat.beast.name}没有接受你的停战信号。`);}
      finishPlayerTurn();
    }

    function useCombatSkill(index) {
      const combat=state.combat,c=state.character,skill=allCombatSkills()[index];if(!combat||!skill)return;if(c.soul<skill.cost||combat.stamina<10)return toast("魂力或体力不足。");c.soul-=skill.cost;combat.stamina-=10;combat.defending=false;combat.dodging=false;
      const hit=clamp(78+(c.mental-combat.agility)*.15,30,98);if(Math.random()*100>hit)combat.log.unshift(`${skill.name}被对方以地形和速度避开。`);else{const crit=Math.random()*100<6+c.stats.luck*.08,guard=combat.enemyIntent==="guard"?.72:1,damage=Math.max(4,Math.round((c.mental*.32+c.level*1.05+skill.power+randomInt(6,18)-combat.defense*.24)*skill.qualityMultiplier*(crit?1.55:1)*guard));combat.hp-=damage;if(Math.random()<.28){combat.enemyStatuses=[pick(["失衡","迟缓","魂力紊乱"])];combat.agility=Math.max(1,combat.agility-3);}combat.log.unshift(`${c.name}释放${skill.kind}“${skill.name}”，造成${damage}点伤害${crit?"（暴击）":""}。`);}finishPlayerTurn();
    }

    function enemyCombatTurn() {
      const combat=state.combat,c=state.character,intent=combat.enemyIntent;if(intent==="guard"){combat.enemyStamina=Math.min(100,combat.enemyStamina+25);combat.hp=Math.min(combat.maxHp,combat.hp+Math.round(combat.maxHp*.04));combat.log.unshift(`${combat.beast.name}收势护住弱点，并恢复少量生命。`);return;}
      if(combat.dodging){const dodgeChance=clamp(38+(c.stats.agility-combat.agility)*1.05+c.stats.luck*.12-(intent==="quick"?12:0),8,88);if(Math.random()*100<=dodgeChance){combat.log.unshift(`${c.name}避开了${intent==="heavy"?"蓄力重击":"攻击"}。`);return;}}
      const hitChance=clamp(80+(combat.agility-c.stats.agility)*.28+(intent==="quick"?10:0),28,97);if(Math.random()*100>hitChance){combat.log.unshift(`${combat.beast.name}的攻击擦身而过。`);return;}
      let damage=Math.max(1,Math.round((combat.attack+randomInt(3,12)-c.stats.defense*.24)*(intent==="heavy"?1.65:intent==="quick"?.78:1)));if(combat.defending)damage=Math.max(1,Math.round(damage*(intent==="heavy"?.52:.35)));takeDamage(damage,`${combat.beast.name}的${intent==="heavy"?"蓄力重击":combat.beast.traits[0]}命中${c.name}`);if(state.screen!=="ending")combat.log.unshift(`${combat.beast.name}${intent==="heavy"?"完成蓄力重击":`发动${combat.beast.traits[0]}`}，造成${damage}点伤害。`);
    }

    function winCombat() {
      const combat=state.combat;if(combat.npcId){killNpc(combat.npcId);advanceDays(1);state.combat=null;state.pendingHunt=null;state.gameView="world";toast("人物死亡，世界线已经改变。");render();return;}
      const boneChance=clamp(3+Math.log10(combat.years+10)*2+state.character.stats.luck*.05,3,22);let bone=null;if(Math.random()*100<=boneChance){const empty=BONE_SLOTS.filter(slot=>!state.character.bones[slot]);if(empty.length){const slot=pick(empty);bone={beast:combat.beast,years:combat.years,slot,name:`${combat.beast.name}${slot}`};}}
      state.spiritEssence=(state.spiritEssence||0)+Math.max(2,Math.round(Math.log10(combat.years+10)*3));if(combat.years>=1000||Math.random()*100<10+state.character.stats.luck*.08){state.evolutionMaterials=(state.evolutionMaterials||0)+1;state.journal.unshift(`${dateText()}｜取得一份武魂进化素材。`);}
      state.pendingHunt={beast:combat.beast,years:combat.years,bone,phase:"ring"};combat.hp=0;combat.log.unshift(`${combat.beast.name}失去生命，魂环开始凝聚。`);state.journal.unshift(`${dateText()}｜击杀${combat.years.toLocaleString()}年${combat.beast.name}。`);render();
    }

        if(state.timelineId){state.npcRelations=state.npcRelations||{};for(const npc of NPC_TEMPLATES[state.timelineId]){if(!state.npcRelations[npc.id])state.npcRelations[npc.id]={affinity:8,trust:6,respect:8,suspicion:state.species==="beast"?18:6,interactions:0,memories:[],lastTalk:null};if(state.npcRelations[npc.id].interactions>0)state.metNpcs[npc.id]=true;}for(const f of FACTIONS[state.timelineId]||[])if(!Number.isFinite(state.factionReputation[f.id]))state.factionReputation[f.id]=0;}

    function resetState(){Object.assign(state,{screen:"welcome",species:null,character:null,timelineId:null,nodeId:null,ending:null,bond:0,journal:[],modalConfirm:null,gameView:"story",worldDate:null,currentLocation:null,unlockedLocations:[],npcRelations:{},dialogueLog:[],trophies:{rings:[],bones:[]},gifts:3,storyCompleted:false,combat:null,pendingHunt:null,selectedNpc:null,awakeningStep:0,deadNpcs:{},worldFlags:{},interventions:[],spiritEssence:0,selectedTalents:[],metNpcs:{},faction:null,factionReputation:{},evolutionMaterials:0});}

    function endingText(title) {
      const c=state.character,impacts=activeConsequences(),faction=(FACTIONS[state.timelineId]||[]).find(f=>f.id===state.faction)?.name;

    function deriveBoneSkill(loot){const action=pick(TRAIT_SKILL_WORDS[pick(loot.beast.traits)]||loot.beast.traits),suffix={"头骨":"识海投影","躯干骨":"本源壁垒","外附魂骨":"异形延展","左臂骨":"逆势爆发","右臂骨":"贯穿爆发","左腿骨":"折返瞬步","右腿骨":"追猎瞬步","指骨":"微域操控"}[loot.slot];return{skill:`${loot.beast.element}·${action}${suffix}`,description:`由${loot.beast.name}的${loot.beast.traits.join("、")}与${loot.slot}结构共同形成；不参考持有者武魂，因此保留完整魂兽行为特征。`};}

    function randomEvolutionName(spirit){const prefixes={"器武魂":["太初","星铸","镇界","天工"],"兽武魂":["帝皇","太古","圣域","天穹"],"植物系武魂":["森罗","永生","万叶","灵界"],"元素武魂":["极境","源初","天象","寂灭"],"本体武魂":["真身","神髓","二觉","超限"]}[spirit.type]||["升华"],suffixes={"器武魂":["神兵","圣器","天枢"],"兽武魂":["皇","君主","神兽"],"植物系武魂":["皇株","祖藤","神木"],"元素武魂":["真域","本源","天灾"],"本体武魂":["真身","神躯","圣体"]}[spirit.type]||["真形"];return `${pick(prefixes)}·${spirit.name}${pick(suffixes)}`;}
    function evolutionStatus(spirit){const c=state.character,explicit=SPIRIT_EVOLUTIONS[spirit.name],rank=spirit.qualityRank||0,special=!!spirit.special,materialNeed=special?3:0,discount=c.talentFlags?.evolution_heir||0;if(explicit){const ready=c.level>=Math.max(20,explicit.level-discount*2)&&c.mental>=(explicit.mental||0)&&rank>=Math.max(2,explicit.quality-Math.floor(discount/3))&&(!explicit.stat||c.stats[explicit.stat]>=explicit.statValue)&&state.evolutionMaterials>=materialNeed;return{ready,text:`${explicit.to}：固定进化路线 · 魂力${Math.max(20,explicit.level-discount*2)} / 品质${SPIRIT_QUALITIES[Math.max(2,explicit.quality-Math.floor(discount/3))].name}${materialNeed?` / 特殊素材${materialNeed}`:""}`,rule:{...explicit,materialNeed},explicit:true};}if((spirit.evolvedTier||0)>=1)return{ready:false,text:"已经完成当前品质阶段的进化"};const levelNeed=Math.max(20,(special?40:30)-discount*2),qualityNeed=Math.max(2,4-Math.floor(discount/3)),ready=rank>=qualityNeed&&c.level>=levelNeed&&state.evolutionMaterials>=materialNeed;return{ready,text:`可自定义进化名称：魂力${levelNeed} / 品质${SPIRIT_QUALITIES[qualityNeed].name}${materialNeed?` / 特殊素材${materialNeed}`:""}`,rule:{to:null,materialNeed,note:special?"需材料稳定本源":"达到品质阈值后自然升华"},explicit:false};}
    function completeSpiritEvolution(index,name,status){const spirit=state.character.spirits[index],old=spirit.name,need=status.rule.materialNeed||0;if(need)state.evolutionMaterials-=need;spirit.evolutionHistory=spirit.evolutionHistory||[];spirit.evolutionHistory.push(old);spirit.name=name;spirit.evolvedTier=(spirit.evolvedTier||0)+1;spirit.qualityRank=Math.min(6,(spirit.qualityRank||0)+1);applyGrowthRewards("ring",2);state.character.fusionSkills=buildFusionSkills(state.character.spirits);advanceDays(12);state.journal.unshift(`${dateText()}｜武魂${old}进化为${spirit.name}。`);closeModal();toast(`武魂进化：${old} → ${spirit.name}`);render();}
    function evolveSpirit(index){const spirit=state.character.spirits[index],status=evolutionStatus(spirit);if(!status.ready)return toast("尚未满足进化条件。");if(status.explicit)return completeSpiritEvolution(index,status.rule.to,status);let suggestion=randomEvolutionName(spirit);openModal(`为${spirit.name}确定进化真名`,`<p>这条武魂没有固定原著进化路线。系统已经随机生成默认名称，你可以直接采用或自行修改。</p><div class="field"><label for="evolutionName">进化后的武魂名称</label><input class="modal-input" id="evolutionName" maxlength="24" value="${esc(suggestion)}"></div><button id="rerollEvolutionName" style="margin-top:10px">重新随机名称</button><p class="muted">确认后将消耗${status.rule.materialNeed||0}份特殊素材，并推进12天。</p>`,`确认进化`,()=>{const value=$("#evolutionName").value.trim().slice(0,24)||suggestion;completeSpiritEvolution(index,value,status);});$("#rerollEvolutionName").onclick=()=>{$("#evolutionName").value=suggestion=randomEvolutionName(spirit);};}

    function winCombat(){const combat=state.combat;if(combat.npcId){killNpc(combat.npcId);advanceDays(1);state.combat=null;state.pendingHunt=null;state.gameView="world";toast("人物死亡，世界线已经改变。");render();return;}const grade=state.character.talentFlags?.bone_hunter||0,boneChance=clamp(3+Math.log10(combat.years+10)*2+state.character.stats.luck*.05+grade*3,3,45);let bone=null;if(Math.random()*100<=boneChance){const empty=BONE_SLOTS.filter(slot=>!state.character.bones[slot]);if(empty.length){const slot=pick(empty);bone={beast:combat.beast,years:combat.years,slot,name:`${combat.beast.name}${slot}`};}}state.spiritEssence=(state.spiritEssence||0)+Math.max(2,Math.round(Math.log10(combat.years+10)*3));if(combat.years>=1000||Math.random()*100<10+state.character.stats.luck*.08+(state.character.talentFlags?.resource_sense||0)*3){state.evolutionMaterials=(state.evolutionMaterials||0)+1;state.journal.unshift(`${dateText()}｜取得一份武魂进化素材。`);}state.pendingHunt={beast:combat.beast,years:combat.years,bone,phase:"ring"};combat.hp=0;combat.log.unshift(`${combat.beast.name}失去生命，魂环开始凝聚。`);state.journal.unshift(`${dateText()}｜击杀${combat.years.toLocaleString()}年${combat.beast.name}。`);render();}

    function resolveImmediateRing(absorb){const hunt=state.pendingHunt;if(!hunt)return;if(absorb){const c=state.character,spiritIndex=Number($("#combatSpiritTarget").value||0),spirit=c.spirits[spiritIndex]||c.spirits[0],limit=ringLimit(),overload=Math.max(0,hunt.years-limit)/Math.max(1,limit),bonus=(c.talentFlags?.ring_savant||0)*5,chance=Math.round(clamp(90-overload*85+c.stats.luck*.1+bonus,5,99));if(Math.random()*100<=chance){const derived=deriveRingSkill(spirit,hunt.beast),color=ringColor(hunt.years);c.rings.push({years:hunt.years,colorClass:color.cls,beastName:hunt.beast.name,spiritIndex,skill:derived.skill,skillDescription:derived.description});c.level=Math.min(100,c.level+1);applyGrowthRewards("ring",1+Math.log10(hunt.years+10)*.12);state.journal.unshift(`${dateText()}｜吸收${hunt.beast.name}魂环，获得“${derived.skill}”。`);toast(`吸收成功：${derived.skill}`);}else{applyBacklash(randomInt(10,20),`吸收${hunt.beast.name}魂环失败。`);if(state.screen==="ending")return render();toast("魂环反噬造成生命损失。");}}else state.journal.unshift(`${dateText()}｜放弃${hunt.beast.name}魂环。`);hunt.phase="bone";render();}
    function resolveImmediateBone(absorb){const hunt=state.pendingHunt;if(!hunt)return;if(absorb&&hunt.bone){const loot=hunt.bone,c=state.character,difficulty=Math.log10(loot.years+10)*11,bonus=(c.talentFlags?.bone_hunter||0)*5,chance=Math.round(clamp(56+c.mental*.24+c.stats.physique*.25+c.stats.luck*.1+bonus-difficulty,5,98));if(Math.random()*100<=chance){const derived=deriveBoneSkill(loot);c.bones[loot.slot]={years:loot.years,name:loot.name,beastName:loot.beast.name,skill:derived.skill,skillDescription:derived.description};applyGrowthRewards("bone",1+Math.log10(loot.years+10)*.14);state.journal.unshift(`${dateText()}｜融合${loot.name}，获得“${derived.skill}”。`);toast(`融合成功：${derived.skill}`);}else{applyBacklash(randomInt(8,18),`融合${loot.name}失败。`);if(state.screen==="ending")return render();toast("魂骨反噬造成生命损失。");}}else if(hunt.bone)state.journal.unshift(`${dateText()}｜放弃${hunt.bone.name}。`);advanceDays(randomInt(1,2));state.pendingHunt=null;state.combat=null;state.gameView="story";render();}

    function performGrowth(type){const c=state.character;if(type==="meditate"){advanceDays(3);c.soul=Math.min(c.maxSoul,c.soul+Math.round(c.maxSoul*.55));if(state.species==="human"){if(atRingGate())toast(`魂力停在${c.level}级，必须获取魂环突破。`);else if(Math.random()*100<Math.min(97,55+c.mental*.18)){gainLevels(1);c.mental+=randomInt(1,3);toast("冥想突破，世界也向前推进了三天。");}else{c.mental++;toast("未提升等级，但精神控制更加稳定。");}}else{c.cultivationYears+=Math.max(10,Math.floor(c.cultivationYears*.014));applyGrowthRewards("level",.7);}}else if(type==="body"){advanceDays(5);raiseStat("physique",randomInt(4,9));raiseStat("strength",randomInt(3,7));raiseStat("defense",randomInt(3,7));c.maxHp+=randomInt(15,30);c.hp=Math.min(c.maxHp,c.hp+25);toast("锻体完成，期间的世界事件也已结算。");}else if(type==="mind"){advanceDays(4);if(Math.random()<.84){c.mental+=randomInt(5,12);c.maxSoul+=randomInt(5,12);toast("精神海扩张。");}else{applyBacklash(3,"精神海训练失衡。");toast("训练失衡，生命受到反噬。");}}else if(type==="combat"){advanceDays(2);raiseStat("agility",randomInt(3,7));raiseStat("strength",randomInt(2,5));raiseStat("defense",randomInt(1,4));toast("实战推演完成。");}else if(type==="rest"){advanceDays(2);c.hp=Math.min(c.maxHp,c.hp+Math.round(c.maxHp*.5));c.soul=Math.min(c.maxSoul,c.soul+Math.round(c.maxSoul*.75));toast("静养完成。");}else if(type==="explore"){advanceDays(2);const sense=c.talentFlags?.resource_sense||0;if(Math.random()*100<35+sense*8){state.evolutionMaterials++;grantResource(pick(["稀有金属芯","魂兽生态样本","古代魂导回路"]),1,"地区探索");toast("探索获得进化材料与剧情资源。");}else if(Math.random()<.55){const gain=randomInt(2,6);state.spiritEssence+=gain;toast(`找到${gain}份武魂精粹。`);}else{state.gifts++;raiseStat("luck",2);toast("找到礼物并积累地区经验。");}}state.journal.unshift(`${dateText()}｜完成${{meditate:"冥想",body:"锻体",mind:"精神训练",combat:"实战推演",rest:"静养",explore:"探索"}[type]}。`);if(state.screen!=="ending")render();}

    function worldViewHtml(){const all=NPC_TEMPLATES[state.timelineId],dead=Object.values(state.deadNpcs||{}),living=all.filter(n=>!state.deadNpcs?.[n.id]),pending=(state.scheduledConsequences||[]).filter(x=>!x.resolved).sort((a,b)=>a.due-b.due),news=state.worldNews||[];return `<section class="stage"><div class="dashboard-title"><div><div class="step">动态世界档案</div><h2>${esc(TIMELINES[state.timelineId].name)}正在自行发展</h2><p class="muted">时间、关系、势力、资源与剧情选择共同决定事件结果。</p></div><span class="tag">世界日 ${state.worldDayCount||0} · 压力${state.worldPressure||0}</span></div><div class="result-grid"><div class="result-card"><b>${living.length}</b><span>活跃人物</span></div><div class="result-card"><b>${pending.length}</b><span>等待结算的后续</span></div><div class="result-card"><b>${Object.values(state.resources||{}).reduce((a,b)=>a+b,0)}</b><span>持有剧情资源</span></div></div><h3 style="margin-top:20px">世界流动记录</h3><div class="flow-timeline">${news.length?news.slice(0,12).map(n=>`<div class="flow-event"><time>${esc(n.date)}</time><div><b>${esc(n.title)}</b><p class="muted">${esc(n.text)}</p></div></div>`).join(""):`<div class="empty">世界事件尚未到达触发日期。</div>`}${pending.map(p=>`<div class="flow-event pending"><time>约${Math.max(0,p.due-state.worldDayCount)}日后</time><div><b>${esc(p.source)}的后续</b><p class="muted">最终结果将按届时的关系与势力状态结算。</p></div></div>`).join("")}</div><h3 style="margin-top:20px">永久世界后果</h3>${activeConsequences().length?activeConsequences().map(t=>`<div class="world-impact">${esc(t)}</div>`).join(""):`<div class="notice">目前没有永久性的大规模偏移。</div>`}</section>${resourceInventoryHtml()}`;}

    function worldStripHtml(){const location=currentLocationData(),faction=(FACTIONS[state.timelineId]||[]).find(f=>f.id===state.faction),rate=locationTimeRate();return `<div class="world-strip"><span>${esc(dateText())}</span><span>位置：${esc(location?.name||"未知")}</span><span>时流：×${rate.toFixed(2)}</span><span>势力：${esc(faction?.name||"无所属")}</span><span>世界压力：${state.worldPressure||0}</span><span>待结算：${(state.scheduledConsequences||[]).filter(x=>!x.resolved).length}</span></div>`;}

      tc4:{title:"杀戮之都失联",place:"昊天宗议事堂",tags:["宗门危机","多年失联"],text:["唐晨进入杀戮之都后音讯断绝。昊天宗长老开始争论是封锁消息、另立宗主，还是派人沿血色魂力的痕迹搜寻。","你带回的记录能证明失联并非普通闭关，但公开它也会引来武魂殿与其他宗门试探。"],choices:[{text:"公开证据并组织有限搜寻",hint:"维持宗门秩序，也承担泄密风险。",to:"tc5",effects:{mental:7,bond:8,age:4},identity:"昊天宗远征记录官"},{text:"封存证据，先保护唐晨旧部",hint:"让宗门短期稳定。",to:"tc5",effects:{defense:6,luck:4,age:4},identity:"昊天旧部庇护者"},{text:"出售失联情报换取资源",hint:"极端选择：快速获利，但会引来长期追查。",to:"tc5",effects:{level:5,luck:8,backlash:4,age:4},extreme:true}]},
      tc5:{title:"双岳余晖",place:"大陆宗门联合会",tags:["势力重排","时代结局"],text:["唐晨长期缺席后，昊天宗与武魂殿的制衡进入新阶段。你此前公开、封存或出售的信息，分别塑造了三套截然不同的联盟。","宗门联合会要求你表态：把唐晨留下的力量当作家族遗产，还是建立跨势力约束。"],choices:[{text:"建立顶级魂师共同约束",hint:"以制度结束这一时期。",ending:"唐晨时期结局：双岳盟约",effects:{mental:10,bond:10},identity:"双岳盟约见证者"},{text:"护送昊天宗完成平稳交接",hint:"保住宗门核心。",ending:"唐晨时期结局：归山执炬者",effects:{defense:8,level:4},identity:"昊天执炬者"},{text:"利用权力真空扩张个人势力",hint:"极端选择：成为新秩序的强势竞争者。",ending:"唐晨时期结局：第三座高峰",effects:{level:8,luck:6},extreme:true,identity:"大陆第三极"}]},
      th5:{title:"四族离山",place:"天斗帝国南部商道",tags:["单属性四宗族","旧盟裂痕"],text:["昊天宗封山后，力、御、敏、破四族失去统一庇护。有人准备迁徙，有人坚持讨要说法，武魂殿则用登记和供给逐步切断他们的生计。","你此前保存的撤离路线与证据终于到了必须兑现的时刻。"],choices:[{text:"协调四族建立互助商路",hint:"让附属家族先活下来。",to:"th6",effects:{bond:10,mental:5,age:6},identity:"四族商路协调者"},{text:"把围猎证据交给天斗贵族",hint:"借帝国力量牵制武魂殿。",to:"th6",effects:{luck:6,mental:7,age:6},identity:"天斗密证持有人"},{text:"截取四族秘术与库存",hint:"极端选择：短期获得资源，四族会把你列为仇敌。",to:"th6",effects:{level:7,strength:5,age:6},extreme:true}]},
      th6:{title:"圣魂村的铁匠",place:"圣魂村",tags:["旧事余波","下一代"],text:["多年后，唐昊在圣魂村以铁匠身份隐居。六岁的唐三即将迎来武魂觉醒，上一代的献祭、封山与追猎都将进入下一代的人生。","你可以留下能被孩子理解的线索，也可以让往事暂时沉睡。"],choices:[{text:"留下不暴露身份的蓝银记录",hint:"给未来留下一条可验证的线索。",ending:"唐昊时期结局：蓝银留书",effects:{mental:10,bond:8},identity:"蓝银旧史保管人"},{text:"继续保护村庄，不惊动父子",hint:"让这段童年暂时平静。",ending:"唐昊时期结局：无名守村人",effects:{defense:9,luck:5},identity:"圣魂村暗哨"},{text:"提前夺走唐昊封存的机缘",hint:"极端选择：历史会因关键资源缺失而偏转。",ending:"唐昊时期结局：窃火者",effects:{level:10,luck:8},extreme:true,identity:"昊天窃火者"}]},
      ts5:{title:"索托大斗魂场",place:"索托大斗魂场",tags:["团队磨合","斗魂积分"],text:["史莱克七怪以团战磨合各自的魂技。这里的胜负不只看魂力：控制、补位、保存体力和赛后复盘会决定团队能否走得更远。","盘口与贵宾席也在记录每一个年轻魂师。你可以加入替补、担任战术分析，或从灰色规则中获利。"],choices:[{text:"作为替补参加团队斗魂",hint:"提高学院贡献并开启赛事训练。",to:"ts6",effects:{level:4,strength:4,bond:7,age:1},academyCredit:18},{text:"整理对手魂技与站位档案",hint:"为未来大赛积累可复用情报。",to:"ts6",effects:{mental:8,luck:4,age:1},academyCredit:14},{text:"操纵盘口并窃取对手战术",hint:"极端选择：资源增加，但学院与对手会追查。",to:"ts6",effects:{luck:10,backlash:4,age:1},extreme:true}]},
      ts6:{title:"天斗皇家学院受阻",place:"蓝霸学院旧址",tags:["学院转折","柳二龙"],text:["史莱克师生抵达天斗皇家学院，却因权力干涉被迫离开。柳二龙接手众人，并让蓝霸学院更名为史莱克学院。","这场羞辱会直接影响大赛报名、训练场地和赞助来源。你可以帮助新学院站稳，也可以与旧学院私下交易。"],choices:[{text:"帮助新史莱克完成报名与整编",hint:"学院系统将获得赛事资格。",to:"ts7",effects:{bond:9,mental:5},academyCredit:25},{text:"保留与天斗皇家学院的合作通道",hint:"减少两院长期敌意。",to:"ts7",effects:{luck:5,bond:4},academyCredit:12},{text:"抢走皇家学院为一队准备的资源",hint:"极端选择：立即强化团队，也激化学院冲突。",to:"ts7",effects:{level:5,luck:7},extreme:true}]},
      ts7:{title:"魂师大赛·预选赛",place:"天斗大斗魂场",tags:["魂师大赛","预选赛"],text:["全大陆高级魂师学院精英大赛预选赛开幕。多轮积分让任何一次受伤、阵容泄露与失误都可能改变出线顺序。","重要比赛会按日期推进；你可以亲自上场、提供战术，也可以选择不干涉，让各队按自身实力结算。"],choices:[{text:"加入赛事名单并轮换出场",hint:"开启完整赛事回合与积分。",to:"ts8",effects:{level:5,bond:8},academyCredit:30},{text:"只负责侦察与伤势管理",hint:"降低团队受伤概率。",to:"ts8",effects:{mental:9,defense:4},academyCredit:22},{text:"冒名顶替并抢夺对手晋级名额",hint:"极端选择：胜负可能被改写，也可能被取消资格。",to:"ts8",effects:{level:7,luck:6,backlash:6},extreme:true}]},
      ts8:{title:"晋级赛与截杀令",place:"天斗赛区晋级营地",tags:["晋级赛","截杀危机"],text:["晋级赛更重视个人对抗，队伍开始隐藏核心魂技。赛后前往武魂城的路上，针对年轻天才的截杀计划逐渐成形。","你掌握一条绕行路线，但改道会错过补给；正面揭露又可能让幕后者提前灭口。"],choices:[{text:"护送参赛队伍走隐蔽路线",hint:"降低截杀损失并进入决赛。",to:"ts4",effects:{defense:8,bond:8},academyCredit:20},{text:"公开截杀证据迫使各方见证",hint:"让危机无法被悄然掩盖。",to:"ts4",effects:{mental:10,luck:3},identity:"晋级赛护证人"},{text:"趁乱抢夺被截队伍的魂骨奖励",hint:"极端选择：获得高价值资源并招致所有参赛方敌意。",to:"ts4",effects:{level:8,luck:8},extreme:true}]},
      ts9:{title:"决赛之后的分岔",place:"武魂城外撤离线",tags:["赛后余波","长期结局"],text:["教皇殿前的冲突已经结束，但结果不会在一天内消失。学院面临调查，魂兽身份成为大陆争论焦点，参赛队伍也要决定各自去向。","你此前在赛场、截杀与撤离中的选择，决定谁愿意替你作证，也决定哪些道路永久关闭。"],choices:[{text:"建立参赛学院互保网络",hint:"为下一代魂师保留独立空间。",ending:"唐三时期结局：学院互保盟",effects:{bond:12,mental:8},identity:"学院互保盟发起人"},{text:"护送魂兽身份者返回森林",hint:"承担与武魂殿长期对立。",ending:"唐三时期结局：森林归途",effects:{agility:8,bond:12},identity:"星斗归途守卫"},{text:"夺取决赛奖励后远走高飞",hint:"极端选择：得到机缘，却失去大部分盟友。",ending:"唐三时期结局：赛冠掠夺者",effects:{level:10,luck:10},extreme:true,identity:"赛冠掠夺者"}]},
      js5:{title:"青年魂师大赛",place:"星罗城大赛广场",tags:["学院赛事","魂导碰撞"],text:["史莱克与各国学院在青年赛事中正面碰撞。传统魂师体系与魂导器战术第一次如此清晰地摆在公众面前。","你可以进入代表队、负责魂导后勤，或把赛场当成窃取技术的窗口。"],choices:[{text:"进入史莱克代表队",hint:"以团队战完成赛事。",to:"js6",effects:{level:6,bond:9},academyCredit:30},{text:"建立公开的魂导器检验规则",hint:"减少暗器与魂导器争议。",to:"js6",effects:{mental:10,luck:4},academyCredit:24},{text:"窃取明德堂核心图纸",hint:"极端选择：技术飞跃将换来跨国追捕。",to:"js6",effects:{mental:8,level:7},extreme:true}]},
      js6:{title:"战争前的学院选择",place:"史莱克城议事厅",tags:["战争前夜","唐门复兴"],text:["赛事结束后，各国矛盾没有消失。魂导工业、唐门复兴与魂兽栖地同时被推上战争前夜的谈判桌。","学院要求学生选择是进入军队、留守教学，还是组织独立救援。"],choices:[{text:"建立跨国平民救援线",hint:"把技术用于避难与医疗。",ending:"绝世唐门时期结局：无界救援线",effects:{bond:12,mental:8},identity:"无界救援者"},{text:"留在学院培养下一届学员",hint:"让知识成为长期结果。",ending:"绝世唐门时期结局：海神湖讲席",effects:{mental:12,luck:4},identity:"史莱克讲席"},{text:"垄断战时魂导供应",hint:"极端选择：财富与敌意同步增长。",ending:"绝世唐门时期结局：战时巨商",effects:{level:9,luck:10},extreme:true,identity:"战时魂导巨商"}]},
      lw5:{title:"天海联盟大比",place:"天海大斗魂场",tags:["联盟大比","少年团队"],text:["东海学院队伍进入天海联盟大比。团队仍年轻，却必须面对更成熟的战术与势力招揽。","比赛表现会影响史莱克考核资格、锻造资源与传灵塔评估。"],choices:[{text:"以零班完整阵容参赛",hint:"累积团队契合与赛事积分。",to:"lw6",effects:{level:5,bond:9},academyCredit:28},{text:"担任锻造与战术后援",hint:"保护核心队员状态。",to:"lw6",effects:{mental:8,defense:5},academyCredit:20},{text:"夺取对手的稀有金属配额",hint:"极端选择：斗铠进度提升但联盟追责。",to:"lw6",effects:{strength:6,luck:8},extreme:true}]},
      lw6:{title:"史莱克考核与龙王暗潮",place:"史莱克内院外庭",tags:["学院考核","魂兽危机"],text:["史莱克考核结束后，唐舞麟的血脉、古月的立场与传灵塔的记录开始彼此指向同一场更大的危机。","你可以继续维护人类学院秩序，也可以推动双方提前坐上谈判桌。"],choices:[{text:"建立人类与魂兽共同观察站",hint:"保留对话与证据。",ending:"龙王传说时期结局：双生观察站",effects:{bond:12,mental:10},identity:"双生观察站主持人"},{text:"留在史莱克完善斗铠教学",hint:"走学院与技术路线。",ending:"龙王传说时期结局：斗铠教席",effects:{level:8,defense:6},identity:"斗铠教席"},{text:"夺取金龙王封印研究成果",hint:"极端选择：获得力量，也成为各方共同目标。",ending:"龙王传说时期结局：龙印窃取者",effects:{level:12,luck:6},extreme:true,identity:"龙印窃取者"}]}

    function relationStage(relation){if(relation?.relationshipType==="lover")return"恋人";if(relation?.relationshipType==="family")return"亲人";const score=(relation?.affinity||0)+(relation?.trust||0)+(relation?.respect||0)-(relation?.suspicion||0);if((relation?.suspicion||0)>=80)return"仇视";if((relation?.suspicion||0)>=58)return"敌对";if(score>=190)return"生死之交";if(score>=145)return"知己";if(score>=105)return"亲近";if(score>=70)return"友好";if(score>=35)return"熟识";return"点头之交";}

    function relationsViewHtml(){const known=NPC_TEMPLATES[state.timelineId].filter(n=>state.metNpcs?.[n.id]&&!state.deadNpcs?.[n.id]),order=["恋人","亲人","生死之交","知己","亲近","友好","熟识","点头之交","戒备","敌对","仇视"],sections=order.map(stage=>{const list=known.filter(n=>relationStage(state.npcRelations[n.id])===stage);return list.length?`<section class="relation-section"><h3>${stage}<span class="tag">${list.length}</span></h3><div class="relationship-grid">${list.map(relationCardHtml).join("")}</div></section>`:"";}).join(""),dialogue=state.dialogueLog.length?`<div class="dialogue">${dialogueHtml(state.dialogueLog)}</div>`:`<div class="empty">尚无交流记录。</div>`;return `<section class="stage"><div class="dashboard-title"><div><div class="step">人物关系</div><h2>恋人、亲人与已结识人物</h2><p class="muted">亲密互动必须满足关系阈值与明确同意；恋爱内容仅在玩家与对应人物均为成年人时开放。</p></div><span class="tag">已结识 ${known.length}</span></div><div class="relation-legend">${order.map(x=>`<span>${x}</span>`).join("")}</div>${sections||`<div class="empty">尚未正式结识任何人物。</div>`}<h3 style="margin-top:22px">交流记录</h3>${dialogue}</section>`;}

    talkToNpc=function(id,mode){const npc=NPC_TEMPLATES[state.timelineId]?.find(n=>n.id===id),r=state.npcRelations?.[id];if(!npc||!r)return;if(["becomeFamily","becomeLover","date","kiss","familyTalk"].includes(mode)){if(!npc.locations.includes(state.currentLocation))return toast("需要先与对方处于同一地点。");let expression="",line="",playerLine="";if(mode==="becomeFamily"){if(r.relationshipType||r.trust<60||r.respect<45)return toast("尚未达到结为亲人的信任条件。");r.relationshipType="family";r.trust=clamp(r.trust+8);r.memories.push("彼此承认对方是家人");expression="对方没有立刻回答，确认你并非一时冲动后才郑重点头。";line="从今天起，有事别一个人扛。家人不是一句称呼。";playerLine="我想把你当作真正的家人。这不是交换，也不要求你立刻回应。";}else if(mode==="becomeLover"){if(!romanceEligible(npc,r)||r.relationshipType)return toast("需要双方成年，并达到亲近70、信任65、戒备20以下。");r.relationshipType="lover";r.affinity=clamp(r.affinity+8);r.trust=clamp(r.trust+8);r.memories.push("在明确同意下确立恋人关系");expression="对方看了你很久，先确认未来的危险与边界，才把手递来。";line="我愿意。不是因为今天的气氛，而是因为我清楚自己在答应什么。";playerLine="我想和你成为恋人。如果你不愿意，我们仍可以保持现在的关系。";}else{if(mode!=="familyTalk"&&r.relationshipType!=="lover")return toast("这是恋人专属互动。");if(mode==="familyTalk"&&r.relationshipType!=="family")return toast("这是亲人专属互动。");if(mode==="kiss"){expression="对方先靠近半步，在你再次点头后才轻轻吻住你，随即退开观察你的神情。";line="这样可以吗？如果任何时候不舒服，都要告诉我。";playerLine="我想吻你。现在愿意吗？";r.affinity=clamp(r.affinity+5);r.trust=clamp(r.trust+3);r.memories.push("在双方同意下亲吻过");}else if(mode==="date"){expression="对方换下任务服，主动把今天的安排分出一半给你。";line="今天不谈势力，也不谈任务。你想去哪里，我们一起决定。";playerLine="今天留一点时间给我们，好吗？";r.affinity=clamp(r.affinity+6);r.trust=clamp(r.trust+4);advanceDays(1);}else{expression="对方把门合上，给这场谈话留出不会被打断的安静。";line="你可以从最难开口的地方说。我们会一起处理，而不是替你决定。";playerLine="我想以家人的身份听听你的真实想法。";r.trust=clamp(r.trust+6);advanceDays(1);}}r.interactions++;r.lastTalk=dateText();state.dialogueLog.unshift({name:npc.name,expression,line,playerLine,date:dateText()});state.journal.unshift(`${dateText()}｜与${npc.name}完成关系互动：${mode}。`);return render();}talkToNpcV8Base(id,mode);};

    const FACTION_MISSIONS=[{id:"patrol",name:"地区巡查",desc:"处理治安、魂兽迁徙与登记冲突。",days:2,rep:8},{id:"supply",name:"资源押运",desc:"护送学院、宗门或工坊需要的物资。",days:3,rep:11},{id:"diplomacy",name:"势力交涉",desc:"用魅力与证据降低边界冲突。",days:2,rep:9},{id:"research",name:"技术与武魂研究",desc:"提交可复现记录并换取组织资源。",days:4,rep:14}];

    function factionsViewHtml(){const factions=FACTIONS[state.timelineId]||[],joined=factions.find(f=>f.id===state.faction),rep=joined?state.factionReputation[joined.id]||0:0;return `<section class="stage"><div class="dashboard-title"><div><div class="step">势力系统</div><h2>阵营、贡献与职能</h2><p class="muted">完成委托可提高声望并解锁补给、情报与决策权；转投会损失旧声望并改变人物态度。</p></div><span class="tag">${joined?`${joined.name} · ${factionRank(rep)}`:"无所属"}</span></div>${joined?`<section class="subsection"><h3>当前势力功能</h3><div class="faction-benefits"><span>声望 ${rep} · 每次休整额外恢复 ${Math.min(25,Math.floor(rep/5))}%</span><span>${rep>=40?"已解锁：内部商店、地区情报、正式任务":"下一阶段：声望40解锁内部商店与正式任务"}</span><span>${rep>=75?"已解锁：重大节点表决权":"下一阶段：声望75获得重大节点表决权"}</span></div><div class="mission-grid">${FACTION_MISSIONS.map(m=>`<article class="mission-card"><h3>${m.name}</h3><p>${m.desc}</p><button data-faction-mission="${m.id}">执行 · ${m.days}日</button></article>`).join("")}</div></section>`:""}<div class="faction-grid">${factions.map(f=>{const isJoined=state.faction===f.id,r=state.factionReputation?.[f.id]||0;return `<article class="faction-card ${isJoined?"joined":""}"><h3>${esc(f.name)}</h3><p>${esc(f.desc)}</p><div class="level-row"><span>${f.kind==="academy"?"学院":"势力"}声望</span><b>${r} · ${factionRank(r)}</b></div><div class="faction-benefits"><span>补给：恢复药剂与训练许可</span><span>情报：重要节点提前提醒</span><span>高阶：参与路线决策</span></div><button data-join-faction="${f.id}" ${isJoined?"disabled":""}>${state.faction?"转投该势力":"申请加入"}</button></article>`;}).join("")}</div></section>`;}
    function runFactionMission(id){const m=FACTION_MISSIONS.find(x=>x.id===id);if(!m||!state.faction)return;const bonus=id==="diplomacy"?Math.floor((state.character.charm||0)/50):id==="research"?Math.floor(state.character.mental/60):0;advanceDays(m.days);state.factionReputation[state.faction]=(state.factionReputation[state.faction]||0)+m.rep+bonus;state.character.soul=Math.min(state.character.maxSoul,state.character.soul+20);grantResource(`${m.name}凭证`,1,"势力委托");state.journal.unshift(`${dateText()}｜完成势力委托“${m.name}”。`);render();}

    function academyViewHtml(){if(!state.academy)return `<section class="stage"><div class="notice">加入学院类势力后，课程、学分、考试、设施、战队与大赛功能才会开放。</div></section>`;const a=state.academy,f=(FACTIONS[state.timelineId]||[]).find(x=>x.id===a.factionId),eligible=state.nodeId==="ts7"||state.nodeId==="js5"||state.nodeId==="lw5"||a.credits>=60,t=state.tournament||{round:0,wins:0,losses:0,points:0,status:"未报名"},localTeam=NPC_TEMPLATES[state.timelineId].filter(n=>state.metNpcs?.[n.id]&&!state.deadNpcs?.[n.id]).slice(0,6);return `<section class="stage"><div class="dashboard-title"><div><div class="step">学院系统</div><h2>${esc(f?.name||"学院")} · ${a.grade}年级</h2><p class="muted">课程、考试、学分、设施、战队与赛事会同时影响主线和人物关系。</p></div><span class="tag">学分 ${a.credits}</span></div><div class="academy-grid">${Object.entries(ACADEMY_COURSES).map(([id,c])=>`<article class="academy-card"><h3>${c.name} · ${a.courseLevels[id]}级</h3><p>${c.desc}</p><button data-academy-course="${id}">修习 ${c.days}日</button></article>`).join("")}</div><section class="subsection"><h3>年级考试与设施</h3><div class="progress-track"><i style="width:${Math.min(100,a.examProgress)}%"></i></div><p class="muted">考试准备 ${a.examProgress}% · 出勤 ${a.attendance}次 · 图书馆${a.facilities.library}级 / 斗魂场${a.facilities.arena}级 / 冥想室${a.facilities.meditation}级</p><div class="panel-actions"><button id="academyExam" ${a.examProgress<100?"disabled":""}>参加年级考试</button><button data-academy-facility="library">升级图书馆 · 30学分</button><button data-academy-facility="arena">升级斗魂场 · 30学分</button><button data-academy-facility="meditation">升级冥想室 · 30学分</button></div></section><section class="subsection"><h3>战队名册</h3><div class="academy-roster">${localTeam.length?localTeam.map(n=>`<span>${esc(n.name)} · ${relationStage(state.npcRelations[n.id])}</span>`).join(""):`<span>尚未邀请已结识人物</span>`}</div></section><section class="subsection"><h3>魂师大赛</h3><div class="tournament-grid"><article class="tournament-card"><h3>${t.status}</h3><p>轮次 ${t.round} · 胜 ${t.wins} / 负 ${t.losses} · 积分 ${t.poi       if(ids.has("battle_memory")){c.stats.agility+=scaled("battle_memory",7);c.stats.defense+=scaled("battle_memory",6);}
      if(ids.has("shadow_step")){c.stats.agility+=scaled("shadow_step",12);}
      if(ids.has("diplomatic_voice")){c.charm+=scaled("diplomatic_voice",18);}
      if(ids.has("academy_prodigy")||ids.has("soul_engineer"))c.mental+=scaled(ids.has("soul_engineer")?"soul_engineer":"academy_prodigy",8);
      if(ids.has("guardian_oath")&&!c.identities.includes("守望誓印持有者"))c.identities.push("守望誓印持有者");
      if(ids.has("spirit_polyphony"))for(const fusion of c.fusionSkills||[])fusion.compatibility=Math.min(100,fusion.compatibility+scaled("spirit_polyphony",8));
      randomizeBodySpiritNames(c.spirits);
    };

    generateCharacter=function(species){const c=generateCharacterV10Base(species);if(species==="human")c.naturalInnatePower=clamp(c.innatePower||1,1,10);c.cultivationProgress=0;c.cultivationRecord={totalEffectiveDays:0,levels:0};randomizeBodySpiritNames(c.spirits);return c;};

    Object.assign(STORY,{
      tc2x:{title:"潮汐试炼后的长夜",place:"海神岛外海",tags:["海神考验","三方余波"],text:["海神岛拒绝把考验资格当作任何势力的战利品。波塞西遣人送回受伤挑战者，唐晨与千道流各自撤去随行强者，外海却留下被魂压惊散的海魂兽群与数艘断桅商船。","接下来的数月里，昊天宗、武魂殿和海神岛都在重写航路记录。你掌握的证词将决定普通船民能否继续使用安全航道，也会影响唐晨如何理解那道指向杀戮之都的血色气息。"],choices:[{text:"公开潮汐记录并组织联合救援",hint:"保住民用航路，同时要求三方承认救援者的独立性。",to:"tc3",effects:{mental:4,bond:9,luck:3},identity:"外海联合救援记录者"},{text:"只把污染样本交给唐晨",hint:"强化他对神祇污染的警惕，但让航路信息继续封闭。",to:"tc3",effects:{mental:8,bond:4},intervention:"向唐晨提交血色污染样本"},{text:"追踪受惊海魂兽的迁徙线",hint:"从魂兽视角判断神力余波的真实范围。",to:"tc3",effects:{physique:3,mental:5,luck:5},identity:"潮汐兽群观察者"}]},
      tc4x:{title:"宗门继承的空座",place:"昊天宗议事堂",tags:["长期失联","继承争议"],text:["数年没有唐晨的确切消息后，昊天宗第一次承认宗主之位不能继续依靠等待维持。主战派要求封锁消息，山外弟子则担心附属家族会替沉默付出代价。","千道流没有趁机进攻，却让武魂殿收拢各地登记与救援权。唐晨留下的空座，正在把一场个人失踪变成大陆秩序的重新分配。"],choices:[{text:"推动临时议事制并公开有限事实",hint:"降低继承内斗，同时保留寻找唐晨的可能。",to:"tc5",effects:{mental:6,bond:8},identity:"昊天临时议事见证者"},{text:"组织山外弟子与附属家族自保",hint:"不争宗主之位，先让山外网络能独立存活。",to:"tc5",effects:{defense:5,luck:5,bond:6},identity:"山外互保盟组织者"},{text:"秘密核验每一份唐晨回归传闻",hint:"耗时漫长，但能减少有人借宗主名义夺权。",to:"tc5",effects:{mental:9,luck:2},intervention:"建立唐晨消息核验网"}]},
      th1x:{title:"同行岁月与三人的答案",place:"流动商队营地",tags:["漫长旅途","关系转折"],text:["数年行走让唐昊、唐啸与阿银不再只是临时同伴。唐啸先察觉阿银的选择，主动退出那段无法由三个人共同维持的感情，却仍承担宗门与兄长的责任。","与此同时，武魂殿对高阶化形魂兽的登记越来越细。阿银不愿一生躲藏，唐昊则开始为可能到来的追猎准备每一条退路。"],choices:[{text:"帮助阿银建立不依赖任何一人的身份",hint:"为她准备合法行商记录与独立落脚点。",to:"th2",effects:{mental:4,bond:10,luck:3},identity:"化形者身份担保人"},{text:"与唐啸整理山外撤离名单",hint:"让宗门附属者在危机来临前获得选择。",to:"th2",effects:{defense:5,bond:7},identity:"山外撤离联络者"},{text:"同唐昊演练被高阶魂师围困时的突围",hint:"提高战斗准备，但会让监视者更早注意到你们。",to:"th2",effects:{strength:5,agility:5,backlash:2},intervention:"提前演练蓝银皇突围路线"}]},
      th4x:{title:"封山之外的四族",place:"昊天宗山脚",tags:["附属宗族","生存选择"],text:["昊天宗封山的命令挡住了主峰，却挡不住压力沿着商路落到力、御、敏、破四族身上。有人主张继续等待宗门召回，也有人决定带着工坊、药圃与家属另寻生路。","唐昊的名字成了不能公开讨论的伤口。你若介入，不只是选择帮助哪一族，而是在决定这些技艺与怨恨将以何种方式传给下一代。"],choices:[{text:"护送四族分批迁往不同据点",hint:"降低一次性暴露风险，但会让四族长期分散。",to:"th5",effects:{agility:5,bond:9},identity:"四族迁徙护送者"},{text:"建立共同商道与互助仓库",hint:"以实际利益维系合作，不要求他们原谅昊天宗。",to:"th5",effects:{mental:5,luck:5,bond:6},identity:"单属性四族商道发起人"},{text:"公开封山决策对山外弟子的代价",hint:"迫使宗门承担责任，也可能彻底撕裂旧关系。",to:"th5",effects:{mental:8,bond:2},intervention:"公开封山外部代价"}]},
      ts1x:{title:"诺丁六年与毕业抉择",place:"诺丁学院",tags:["六年成长","同窗分路"],text:["六年里，唐三与小舞从七舍的工读生走到诺丁学院毕业。大师的理论、铁匠铺的工作、猎魂后的复盘与日复一日的冥想，共同构成他们真正的成长速度。","毕业前，学院只愿为少数学生开具更高学院的推荐。有人选择稳定的中级学院，有人跟随大师给出的史莱克地址，也有人准备以自由魂师身份先攒齐路费与第二魂环。"],choices:[{text:"与唐三、小舞一同前往索托城",hint:"进入史莱克路线，并承担远行与报名成本。",to:"ts2",effects:{bond:8,agility:3},identity:"诺丁同窗同行者"},{text:"为工读生争取公开的毕业评定",hint:"让推荐不只取决于出身与私下关系。",to:"ts2",effects:{mental:6,bond:8},identity:"工读生毕业评定推动者"},{text:"先完成独立猎魂与旅费委托",hint:"晚些抵达索托城，但带着自己的资源与履历。",to:"ts2",effects:{luck:6,physique:3},identity:"自由魂师毕业生"}]},
      ts3x:{title:"大师的团队特训",place:"史莱克学院",tags:["团队磨合","负重训练"],text:["星斗大森林归来后，大师没有立刻让众人追求更高年限魂环，而是从体能、配合与失败复盘重新训练。每个人都必须说明自己的控制范围、魂力消耗和无法掩盖的弱点。","七人的信任不是一次战斗自动生成的。戴沐白的指挥、宁荣荣的辅助、奥斯卡的补给与唐三的控制只有在持续磨合后，才可能成为真正的整体。"],choices:[{text:"参与完整负重与团队轮换训练",hint:"长期提升基础属性与协作记录。",to:"ts5",effects:{physique:5,defense:4,bond:7},identity:"史莱克团队训练成员"},{text:"建立魂力消耗与伤势复盘册",hint:"用数据减少比赛中的无效透支。",to:"ts5",effects:{mental:8,luck:2},identity:"史莱克战术记录员"},{text:"质疑一刀切的惩罚并提出分系训练",hint:"可能改善训练，也会正面挑战大师的安排。",to:"ts5",effects:{mental:6,respect:0,bond:3},intervention:"推动史莱克分系训练"}]},
      ts6x:{title:"仙草归来与全队重整",place:"蓝霸学院旧址",tags:["仙草机缘","武魂变化"],text:["唐三从冰火两仪眼归来后，带回的不是能无限复制的奖励，而是一批必须按体质、武魂与药性谨慎分配的仙草。每一株都已经有实际来源，也会改变接受者的武魂和未来承受力。","新史莱克的训练计划因此重写：有人武魂品质跃升，有人需要数月消化药力，也有人拒绝使用不确定的资源。你若想得到机缘，必须拿出足以交换的贡献或改变原有分配。"],choices:[{text:"协助建立公开的药性与分配记录",hint:"不直接获得仙草，但降低误用并积累团队信任。",to:"ts7",effects:{mental:8,bond:8},identity:"仙草分配见证者"},{text:"以独立取得的稀有资源换取适配药草",hint:"实际消耗剧情资源，得到武魂淬炼材料。",to:"ts7",effects:{physique:4,luck:4},identity:"冰火药圃交换者"},{text:"拒绝仙草，专注把现有武魂练到极限",hint:"没有即时品质跃升，但获得更稳定的战斗积累。",to:"ts7",effects:{strength:5,mental:5},identity:"本源精修者"}]},
      js1x:{title:"新生考核后的核心名额",place:"史莱克学院",tags:["考核复盘","核心弟子"],text:["新生考核结束后，胜负并没有立即转化为同等资源。武魂系与魂导系分别评估霍雨浩的精神探测，王冬与萧萧也必须决定是否接受更高强度的核心弟子安排。","名单背后牵动课程、猎魂许可与未来交换学习。你的证词可以强调团队贡献，也可以让学院看见被单场胜负遮住的长期价值。"],choices:[{text:"提交完整团队贡献记录",hint:"让辅助、控制与情报价值进入正式评分。",to:"js2",effects:{mental:7,bond:8},identity:"新生考核复盘员"},{text:"推动武魂系与魂导系共同培养",hint:"减少单一院系争夺，但会增加课程负担。",to:"js2",effects:{mental:8,physique:2},intervention:"推动双院系联合培养"},{text:"接受边缘名额并从实战任务积累资格",hint:"不争当期核心名额，换取更自由的成长路线。",to:"js2",effects:{agility:5,luck:5},identity:"史莱克实战旁听生"}]},
      js3x:{title:"交换学习的技术边界",place:"明都",tags:["魂导技术","公开与封锁"],text:["交换学习进入中段后，史莱克学员已经能复现部分魂导结构，明德堂也从传统魂师的实战反馈中修正装备。真正的争议不再是能否学习，而是哪一类技术可以公开。","镜红尘要求所有人签署新的保密条款。霍雨浩希望保住民用成果的可复现性，又不愿让战争级核心流入错误的手中。"],choices:[{text:"划分民用、教学与战争三级标准",hint:"给合作留下清晰边界，并保留追责依据。",to:"js4",effects:{mental:9,bond:6},identity:"魂导技术分级起草者"},{text:"将民用魂导方案交给平民工坊验证",hint:"扩大受益者，也承担标准失控的风险。",to:"js4",effects:{luck:5,bond:8},intervention:"推动民用魂导公开验证"},{text:"只学习合法开放的核心并返回史莱克",hint:"保守但稳定，减少双方猜疑。",to:"js4",effects:{mental:5,defense:4},identity:"交换学习合规见证者"}]},
      lw1x:{title:"零班第一次真正失利",place:"东海学院",tags:["零班磨合","失败复盘"],text:["零班的个人天赋很快，却在第一次面对成熟团队时输得彻底。谢邂追得太深，古月保留了关键能力，唐舞麟承担了超过身体上限的正面压力。","舞长空没有用加练代替分析。他要求每个人说明自己隐瞒了什么、误判了什么，以及下一次愿意把哪一部分决定权交给队友。"],choices:[{text:"主持逐回合战术复盘",hint:"把失败拆成可修正的判断，而不是互相指责。",to:"lw2",effects:{mental:7,bond:8},identity:"零班战术复盘员"},{text:"同唐舞麟进行承伤边界测试",hint:"提高体质与防御，避免血脉力量被当作无限资源。",to:"lw2",effects:{physique:5,defense:5},identity:"零班承伤训练员"},{text:"要求古月说明元素协作的最低条件",hint:"触及她的边界，但可能建立更诚实的合作。",to:"lw2",effects:{mental:6,bond:4},intervention:"重写零班元素协作规则"}]},
      lw3x:{title:"史莱克城的七项考核",place:"史莱克城",tags:["入学考核","城市选择"],text:["抵达史莱克城后，真正的考核不只测试魂力。知识、职业、协作、应变与面对诱惑时的判断都被纳入评分，零班必须在有限时间内决定谁承担哪一项风险。","唐舞麟的锻造能换取稀有金属，也会消耗他为团队战保留的体力。古月能给出最快路线，却不愿解释她为何熟悉某些被封锁的区域。"],choices:[{text:"按职业优势重新分配七项考核",hint:"让锻造、控制与敏攻各自承担可验证的任务。",to:"lw4",effects:{mental:7,bond:8},identity:"史莱克考核协调者"},{text:"保留体力，放弃一项高收益支线",hint:"降低资源收益，确保团队以完整状态进入终考。",to:"lw4",effects:{defense:5,luck:2},identity:"考核风险管理员"},{text:"追查考核中异常开放的魂兽通道",hint:"可能提前触及传灵塔与魂兽阵营的矛盾。",to:"lw4",effects:{mental:6,agility:4},intervention:"追查史莱克考核异常通道"}]}
    });

    function ensureItemState(){state.inventory=Array.isArray(state.inventory)?state.inventory:[];state.goldCoins=Number.isFinite(state.goldCoins)?state.goldCoins:260;state.equippedStorage=state.equippedStorage||null;state.equippedSoulTools=Array.isArray(state.equippedSoulTools)?state.equippedSoulTools:[];state.appliedEquipment=state.appliedEquipment||{};state.unclaimedItems=Array.isArray(state.unclaimedItems)?state.unclaimedItems:[];state.factionTokens=state.factionTokens||0;state.huntGuarantees=state.huntGuarantees||{};state.auction=state.auction||{day:-1,lots:[]};if(state.character){state.character.soulCompression=state.character.soulCompression||{level:0,progress:0,reserveBonus:0,stability:100};}}

      extra.push(`${dateText()}，${place}的光线、脚步与魂力波动同时挤进人的感官。${c.name}以${c.identities?.[c.identities.length-1]||"独立魂师"}的身份站在事件中心，${near.length?`${near.join("、")}都在能够看见你的位置，各自保留着尚未说出口的判断。`:"附近没有能够替你承担决定的人，任何动作都只能由你亲自落下。"}这里没有静止的旁观席：传令者仍在来回奔走，资源与情报也在不同人的手里不断换位。`);

      else if(/魂兽|森林|冰帝|天梦|魂灵|蓝银|献祭/.test(full))extra.push(`林地深处的气息并不只属于一头魂兽。追猎路线、幼兽迁徙、魂环年份与人类的欲望彼此缠在一起，任何骤然爆发的杀意都会让整片区域改变方向。魂兽不会因为主线需要便停在原地等待；若交易、契约或猎杀被你改写，后来能够出现的魂环、魂骨以及人与魂兽之间的态度也会跟着消失或重生。`);

    function longNodeNarrativeHtml(){return `<article class="story long-node-story">${longNodeNarrativeParagraphs(state.nodeId).map(p=>`<p>${esc(p)}</p>`).join("")}</article>`;}
    function replaceLastStoryArticleV17(html,replacement){const start=html.lastIndexOf('<article class="story">');if(start<0)return html;const end=html.indexOf("</article>",start);return end<0?html:`${html.slice(0,start)}${replacement}${html.slice(end+10)}`;}

    const eventBannerV17Base=eventBannerHtml;
    eventBannerHtml=function(){return eventBannerV17Base().replace(/<div class="event-actions">[\s\S]*?<\/div>/,`<div class="npc-input-hint">节点提醒已优先显示。请在下方输入“立即前往”“持续追踪”或“不干涉”。</div>`);};
    showImportantEvent=function(){};

    npcCardHtml=function(npc){
      const r=state.npcRelations[npc.id],met=!!state.metNpcs?.[npc.id],bio=periodProfile(npc);
      return `<article class="npc-card"><div class="npc-top"><div><strong>${esc(npc.name)}</strong><br><small>${esc(met?bio.identity:`${npc.role} · 尚未结识`)}</small></div><span class="tag">${met?relationStage(r):"陌生面孔"}</span></div>${met?`<div class="relation-meters"><div class="relation-meter"><b>${r.affinity}</b><span>亲近</span></div><div class="relation-meter"><b>${r.trust}</b><span>信任</span></div><div class="relation-meter"><b>${r.respect}</b><span>尊重</span></div><div class="relation-meter"><b>${r.suspicion}</b><span>戒备</span></div></div>`:`<p class="muted">对方就在附近，但还没有与你正式建立关系。</p>`}<div class="npc-input-hint">在统一输入框中写“对${esc(npc.name)}说……”或直接描述拥抱、请教、切磋等行动。</div></article>`;
    };
    const relationCardHtmlV17Base=relationCardHtml;
    relationCardHtml=function(npc){return relationCardHtmlV17Base(npc).replace(/<div class="action-grid">[\s\S]*?<\/div>/g,"").replace(/<button[\s\S]*?<\/button>/g,"").replace("</article>",`<div class="npc-input-hint">人物互动改由页面底部的统一输入框完成。</div></article>`);};

    const storyViewHtmlV17Base=storyViewHtml;
    storyViewHtml=function(){let html=storyViewHtmlV17Base();html=html.replace(/<div class="choices">[\s\S]*?<\/div>/g,"").replace(/<div class="event-actions">[\s\S]*?<\/div>/g,"");if(!state.storyCompleted&&state.currentLocation===storyTargetLocation())html=replaceLastStoryArticleV17(html,longNodeNarrativeHtml());return `${html}${freeCommandHtml("story")}`;};
    const relationsViewHtmlV17Base=relationsViewHtml;
    relationsViewHtml=function(){return `${relationsViewHtmlV17Base()}${freeCommandHtml("relations")}`;};

    function cleanFreeCommand(text){return String(text||"").replace(/\s+/g," ").trim();}
    function commandDialogueLine(text){const match=text.match(/(?:说|问|告诉|表示|回答)[：:,，]?\s*[“\"]?(.+?)[”\"]?$/);return cleanFreeCommand(match?.[1]||text);}
    function findCommandNpc(text){const all=(NPC_TEMPLATES[state.timelineId]||[]).filter(n=>!state.deadNpcs?.[n.id]).sort((a,b)=>b.name.length-a.name.length);return all.find(n=>text.includes(n.name))||null;}
    function npcModeFromCommand(text,r){if(/杀死|击杀|杀掉|致死|暗杀|下杀手/.test(text))return"kill";if(/亲吻|吻/.test(text))return"kiss";if(/约会|共度/.test(text))return"date";if(/结为亲人|认作家人|成为家人/.test(text))return"becomeFamily";if(/确立恋人|成为恋人|告白|交往/.test(text))return"becomeLover";if(/牵手|拉住.*手/.test(text))return"handhold";if(/拥抱|抱住|抱抱/.test(text))return"hug";if(/赠送|赠礼|送给|礼物/.test(text))return"gift";if(/用餐|吃饭|共餐/.test(text))return"meal";if(/切磋|比试/.test(text))return"spar";if(/坦白|倾诉|心事/.test(text))return"confide";if(/亲近|靠近/.test(text))return"intimate";if(r?.relationshipType==="lover"&&/恋人/.test(text))return"date";if(r?.relationshipType==="family"&&/家人|谈心/.test(text))return"familyTalk";if(/请教|询问|问|交谈|商量|建议|说/.test(text))return"ask";return"greet";}
    function runNpcCommand(npc,text){
      if(!npc.locations.includes(state.currentLocation))return toast(`${npc.name}当前不在这里，需要先移动到对方所在地区。`);
      const r=state.npcRelations[npc.id],mode=npcModeFromCommand(text,r);if(mode==="kill")return startNpcConflict(npc.id);
      const actual=!state.metNpcs?.[npc.id]&&mode!=="greet"?"greet":mode,before=state.dialogueLog.length;talkToNpc(npc.id,actual);if(state.dialogueLog.length>before){state.dialogueLog[0].playerLine=commandDialogueLine(text);state.dialogueLog[0].freeform=true;render();}
    }
    function commandTokens(text){const clean=text.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,"");const out=new Set();for(let i=0;i<clean.length-1;i++)out.add(clean.slice(i,i+2));return out;}
    function storyChoiceScore(choice,text){const source=`${choice.text||""} ${choice.hint||""} ${choice.alignment||""}`,a=commandTokens(source),b=commandTokens(text);let score=0;for(const token of b)if(a.has(token))score+=2;if(choice.branchType==="ignore"&&/不干涉|无视|离开|撤离|放弃/.test(text))score+=100;if(choice.branchType==="kill"&&/杀死|击杀|致死|暗杀/.test(text))score+=100;if(choice.branchType==="defect"&&/投奔|叛离|加入/.test(text))score+=75;if(choice.branchType==="side"&&/支持|帮助|协助|保护|站在/.test(text))score+=65;if(choice.branchType==="third"&&/独立|第三方|另立|调停/.test(text))score+=55;if(choice.extremeId&&/抢夺|取代|截取|夺走/.test(text))score+=70;return score;}
    const applyStoryRewardV17Base=applyStoryReward;
    applyStoryReward=function(choice){return applyStoryRewardV17Base(choice?{...choice,text:choice._matchedChoiceText||choice.text}:choice);};
    function runFreeCommand(raw){
      const text=cleanFreeCommand(raw);if(!text)return toast("请先写下你准备做什么，或准备对谁说什么。");
      state.freeCommandHistory=state.freeCommandHistory||[];state.freeCommandHistory.unshift({text,date:dateText(),nodeId:state.nodeId,location:state.currentLocation});state.freeCommandHistory=state.freeCommandHistory.slice(0,60);
      const npc=findCommandNpc(text);if(npc&&(/说|问|告诉|拥抱|牵手|亲吻|约会|赠|礼物|用餐|吃饭|切磋|坦白|倾诉|告白|恋人|亲人|家人|杀死|击杀|暗杀/.test(text)))return runNpcCommand(npc,text);
      const event=currentImportantEvent()||(IMPORTANT_EVENTS[state.timelineId]||[]).find(e=>state.importantEvents?.[e.id]==="track");if(event&&/立即前往|赶往|前往.*节点|介入.*节点/.test(text))return resolveImportantEvent(event,"travel");if(event&&/追踪|关注|留意/.test(text))return resolveImportantEvent(event,"track");if(event&&/不干涉|无视.*节点|放弃.*节点/.test(text))return resolveImportantEvent(event,"ignore");
      if(state.storyCompleted)return toast("这条主线已经抵达结局；你仍可在关系、地图、修炼与世界系统中继续行动。");
      const target=storyTargetLocation();if(state.currentLocation!==target){if(/前往|赶往|移动|去往|出发/.test(text))return moveTo(target);return toast(`当前主线发生在${currentWorld().locations.find(l=>l.id===target)?.name||STORY[state.nodeId]?.place}。请先输入“前往事件发生地”。`);}

      if(custom._battle)return beginStoryBattle(custom,selected.index);return commitStoryChoice(custom,state.nodeId);
    }
    function bindFreeCommandInput(){const form=document.querySelector(".free-command-form"),input=document.querySelector("#freeCommandInput");if(!form||!input)return;form.onsubmit=e=>{e.preventDefault();runFreeCommand(input.value);};input.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();runFreeCommand(input.value);}};}

    const AI_CHAT_ENDPOINT="/api/chat";
    function aiDialogueText(text){const match=String(text||"").match(/(?:说|问|告诉|表示|回答|交谈|商量|请教)[：:,，]?\s*[“"]?(.+?)[”"]?$/);return cleanFreeCommand(match?.[1]||text);}
    function isAiDialogueCommand(text){return /说|问|告诉|表示|回答|交谈|商量|请教/.test(String(text||""))&&!/拥抱|抱住|牵手|亲吻|约会|赠送|赠礼|礼物|用餐|吃饭|共餐|切磋|比试|坦白|倾诉|告白|恋人|亲人|家人|杀死|击杀|暗杀|下杀手/.test(String(text||""));}
    function aiSafeRelation(r){return{affinity:r?.affinity||0,trust:r?.trust||0,respect:r?.respect||0,suspicion:r?.suspicion||0,stage:relationStage(r||{}),interactions:r?.interactions||0,memories:(r?.memories||[]).slice(-8),relationshipType:r?.relationshipType||null};}

    function aiPlayerSnapshot(){const c=state.character||{};return{name:c.name,gender:c.gender,age:c.age,level:c.level,identities:(c.identities||[]).slice(-6),spirits:(c.spirits||[]).map(s=>({name:s.name,type:s.type,quality:SPIRIT_QUALITIES[s.qualityRank||0]?.name||""})),stats:c.stats,mental:c.mental,charm:c.charm};}
    async function requestAiNpcReply(npc,text){
      const relation=state.npcRelations[npc.id],bio=periodProfile(npc),playerText=aiDialogueText(text);
      const response=await fetch(AI_CHAT_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:"deepseek",npc:{id:npc.id,name:npc.name,role:npc.role,bio},player:aiPlayerSnapshot(),world:aiWorldSnapshot(),relation:aiSafeRelation(relation),recentDialogue:(state.dialogueLog||[]).slice(0,8),recentFreeCommands:(state.freeCommandHistory||[]).slice(0,6),playerText})});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||`AI 接口返回 ${response.status}`);
      return{playerText,reply:data};
    }
    function applyAiNpcReply(npc,playerText,reply){
      const relation=state.npcRelations[npc.id];if(!relation)return;
      state.metNpcs=state.metNpcs||{};state.metNpcs[npc.id]=true;
      const delta=reply.delta||{};
      for(const key of["affinity","trust","respect","suspicion"]){const value=Number(delta[key]||0);if(Number.isFinite(value))relation[key]=clamp(relation[key]+Math.max(-4,Math.min(4,Math.round(value))));}
      relation.interactions=(relation.interactions||0)+1;relation.lastTalk=dateText();relation.memories=relation.memories||[];
      if(reply.memory&&relation.memories.length<40&&!relation.memories.includes(reply.memory))relation.memories.push(String(reply.memory).slice(0,60));
      const expression=String(reply.expression||"对方认真听完你的话，短暂沉默后才开口。").slice(0,90);
      const line=String(reply.line||"这件事我需要再想想，但我听明白了你的意思。").slice(0,260);
      state.dialogueLog.unshift({name:npc.name,expression,line,playerLine:playerText,date:dateText(),stage:relationStage(relation),freeform:true,ai:true});
      state.aiChatLog=state.aiChatLog||[];state.aiChatLog.unshift({npcId:npc.id,npcName:npc.name,playerLine:playerText,line,date:dateText()});state.aiChatLog=state.aiChatLog.slice(0,40);
      state.journal.unshift(`${dateText()}｜与${npc.name}进行 AI 自由交谈`);
      render();
    }
    async function aiTalkToNpc(npc,text){
      if(state.aiChatPending)return toast("上一句 AI 对话还在生成中。");
      if(!npc.locations.includes(state.currentLocation))return toast(`${npc.name}当前不在这里，需要先移动到对方所在地区。`);
      state.aiChatPending={npcId:npc.id,text};toast(`正在等待${npc.name}回应……`);
      try{const result=await requestAiNpcReply(npc,text);applyAiNpcReply(npc,result.playerText,result.reply);}
      catch(error){console.warn("AI dialogue failed; falling back to local dialogue.",error);toast(`AI 暂时不可用：${error.message||"请稍后重试"}。已使用本地对话。`);runNpcCommandAiBase(npc,text);}
      finally{state.aiChatPending=null;}
    }
    const runNpcCommandAiBase=runNpcCommand;
    runNpcCommand=function(npc,text){if(isAiDialogueCommand(text))return aiTalkToNpc(npc,text);return runNpcCommandAiBase(npc,text);};
    const freeCommandHtmlAiBase=freeCommandHtml;
    freeCommandHtml=function(context="story"){let html=freeCommandHtmlAiBase(context);if(context==="relations")html=html.replace('<div class="input-only-note">','<div class="ai-free-note"><b>AI 自由交谈</b><span class="ai-status-pill">deepseek-flash</span><br>输入“对唐三说：……”或“问小舞……”会调用统一后端 /api/chat；拥抱、送礼、切磋等规则动作仍由本地系统结算。</div><div class="input-only-note">');return html;};
    const hydrateAiChatBase=hydrateV8;
    hydrateV8=function(){hydrateAiChatBase();state.aiChatLog=state.aiChatLog||[];state.aiChatPending=null;};
    const resetStateAiChatBase=resetState;
    resetState=function(){resetStateAiChatBase();state.aiChatLog=[];state.aiChatPending=null;};

      $("#saveBtn").onclick = saveGame;
      $("#loadBtn").onclick = loadGame;
      $("#resetBtn").onclick = () => { resetState(); render(); toast("已重置当前进度。 "); };
    }
