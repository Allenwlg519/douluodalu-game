<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>斗罗大陆：万象命途｜文字角色冒险</title>
  <meta name="description" content="在持续流动的斗罗世界中选择分级天赋、觉醒并进化武魂，让时间、关系、势力与实际资源共同改变五个时代的剧情。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b18'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23d7b85b' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%2376a7e8' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23f7e8a7'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #070b18;
      --panel: rgba(15, 23, 42, .94);
      --panel-2: #17213a;
      --panel-3: #1e2b49;
      --ink: #f5f1df;
      --muted: #a9b6d0;
      --line: #2b3b5d;
      --gold: #d7b85b;
      --gold-2: #f4dc91;
      --blue: #78a9ea;
      --teal: #64c6b0;
      --red: #dc6678;
      --violet: #a883e4;
      --shadow: 0 24px 70px rgba(0, 0, 0, .42);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 8%, rgba(91, 138, 211, .18), transparent 28%),
        radial-gradient(circle at 87% 84%, rgba(215, 184, 91, .13), transparent 32%),
        linear-gradient(145deg, #070b18, #0a1124 58%, #130c22);
    }

    button, input, select { font: inherit; }

    button {
      color: var(--ink);
      border: 1px solid var(--line);
      background: var(--panel-2);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(215, 184, 91, .78);
      background: #213054;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--gold-2);
      outline-offset: 2px;
    }

    button:disabled { opacity: .44; cursor: not-allowed; }

    .app-shell {
      width: min(1380px, calc(100vw - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px 0;
    }

    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-bottom-color: var(--line);
      background: rgba(10, 16, 34, .9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .mark {
      width: 38px; height: 38px; flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: 50%;
      color: #18130b; font-weight: 900;
      background: linear-gradient(145deg, var(--gold-2), #a87824);
      box-shadow: 0 0 26px rgba(215, 184, 91, .24), inset 0 0 0 4px rgba(14, 19, 35, .28);
    }
    .brand h1 { margin: 0; font-size: 1.06rem; line-height: 1.35; }
    .brand small { color: var(--muted); font-size: .78rem; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .small-btn { min-height: 36px; padding: 0 12px; border-radius: 7px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      gap: 14px;
      margin-top: 14px;
      align-items: start;
    }

    .main, .side {
      border: 1px solid rgba(255, 255, 255, .08);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .main { min-height: calc(100vh - 100px); }
    .side { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; }
    .stage { padding: clamp(20px, 4vw, 46px); }

    .hero {
      position: relative;
      min-height: 260px;
      display: grid;
      align-content: end;
      overflow: hidden;
      padding: 30px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(0deg, rgba(7, 11, 24, .88), rgba(7, 11, 24, .1)),
        radial-gradient(circle at 76% 35%, rgba(244, 220, 145, .35), transparent 8%),
        radial-gradient(circle at 76% 35%, transparent 0 15%, rgba(118, 169, 234, .2) 16% 17%, transparent 18% 29%, rgba(215, 184, 91, .18) 30% 31%, transparent 32%),
        linear-gradient(135deg, #0b1631, #283c72 48%, #3d234f);
    }

    .eyebrow { color: var(--gold-2); font-size: .82rem; letter-spacing: .12em; }
    .hero h2 { margin: 8px 0 10px; max-width: 760px; font-size: clamp(2rem, 6vw, 4.6rem); line-height: 1.04; }
    .hero p { max-width: 700px; margin: 0; color: #d2daeb; font-size: 1rem; line-height: 1.8; }

    .primary {
      border-color: rgba(215, 184, 91, .8);
      color: #1a1408;
      background: linear-gradient(145deg, #f2da8b, #bf9132);
      font-weight: 800;
    }
    .primary:hover:not(:disabled) { color: #110e08; background: linear-gradient(145deg, #ffeaa3, #d9aa47); }
    .cta { min-height: 50px; padding: 0 28px; border-radius: 8px; font-size: 1rem; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .muted { color: var(--muted); }
    .notice {
      padding: 13px 15px;
      border: 1px solid rgba(118, 169, 234, .28);
      background: rgba(118, 169, 234, .08);
      color: #ccd8ed;
      font-size: .9rem;
      line-height: 1.65;
    }

    .section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
    .section-head h2 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.25rem); }
    .section-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.65; }
    .step { color: var(--gold); font-size: .78rem; letter-spacing: .1em; }

    .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .select-card, .timeline-card {
      width: 100%; min-height: 190px; padding: 22px;
      text-align: left; border-radius: 10px;
      background: linear-gradient(145deg, rgba(26, 39, 68, .95), rgba(14, 22, 41, .95));
    }
    .select-card strong, .timeline-card strong { display: block; font-size: 1.25rem; color: var(--gold-2); }
    .select-card p, .timeline-card p { color: var(--muted); line-height: 1.65; }
    .select-card ul { margin: 14px 0 0; padding-left: 1.2em; color: #cbd5e7; line-height: 1.8; }
    .timeline-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .timeline-card { min-height: 250px; display: flex; flex-direction: column; }
    .timeline-card .era { color: var(--blue); font-size: .8rem; letter-spacing: .08em; }
    .timeline-card .anchors { margin-top: auto; color: #d4dceb; font-size: .83rem; line-height: 1.6; }

    .profile-editor { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    .profile-card, .sheet-block {
      border: 1px solid var(--line);
      background: rgba(10, 17, 34, .68);
      padding: 18px;
    }
    .profile-card h3, .sheet-block h3 { margin: 0 0 14px; color: var(--gold-2); font-size: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 140px; gap: 10px; margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .78rem; }
    .field input, .field select {
      width: 100%; min-height: 42px; padding: 0 11px;
      color: var(--ink); border: 1px solid var(--line); border-radius: 6px; background: #0c1429;
    }
    .fact-list { display: grid; gap: 8px; }
    .fact { display: grid; grid-template-columns: 100px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .fact:last-child { border-bottom: 0; }
    .fact dt { color: var(--muted); font-size: .82rem; }
    .fact dd { margin: 0; line-height: 1.55; }
    .rare { color: #ffcf67; text-shadow: 0 0 12px rgba(255, 207, 103, .2); }

    .stat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .stat-tile { padding: 12px 8px; text-align: center; border: 1px solid var(--line); background: var(--panel-2); }
    .stat-tile b { display: block; font-size: 1.25rem; color: var(--gold-2); }
    .stat-tile span { color: var(--muted); font-size: .76rem; }

    .chapter-visual {
      padding: 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(120deg, rgba(30, 54, 96, .9), rgba(31, 21, 59, .92));
    }
    .chapter-visual h2 { margin: 7px 0; font-size: clamp(1.65rem, 4vw, 2.7rem); }
    .chapter-visual p { margin: 0; color: #cbd5e7; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .tag { padding: 5px 9px; border: 1px solid rgba(215,184,91,.32); border-radius: 999px; color: #e6d7a5; background: rgba(215,184,91,.08); font-size: .75rem; }
    .story { display: grid; gap: 14px; padding: 24px; font-size: 1rem; line-height: 1.9; }
    .story p { margin: 0; }
    .choices { display: grid; gap: 10px; padding: 0 24px 26px; }
    .choice { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 15px 17px; text-align: left; border-radius: 7px; }
    .choice strong { display: block; font-size: .96rem; }
    .choice small { display: block; margin-top: 5px; color: var(--muted); line-height: 1.45; }
    .cost { align-self: center; color: var(--gold); font-size: .75rem; text-align: right; }

    .panel { padding: 15px; border-bottom: 1px solid var(--line); }
    .panel h3 { margin: 0 0 12px; color: var(--muted); font-size: .78rem; letter-spacing: .08em; }
    .identity-name { font-size: 1.2rem; color: var(--gold-2); }
    .identity-meta { margin-top: 4px; color: var(--muted); font-size: .83rem; }
    .level-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .level-number { font-size: 2rem; color: var(--gold-2); font-weight: 800; }
    .bar { height: 6px; margin-top: 7px; overflow: hidden; background: #091020; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--teal)); }
    .bar.red i { background: linear-gradient(90deg, #d65e74, #ff9a7b); }
    .compact-stats { display: grid; gap: 9px; }
    .compact-stat .row { display: flex; justify-content: space-between; color: #d7dfed; font-size: .8rem; }
    .chip-list { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip { padding: 6px 8px; border: 1px solid var(--line); background: #101a31; color: #d9e1f0; font-size: .76rem; }
    .ring-list, .bone-grid, .journal { display: grid; gap: 7px; }
    .ring, .bone, .log-line { padding: 9px; border: 1px solid rgba(255,255,255,.07); background: #0c1428; font-size: .78rem; line-height: 1.45; }
    .ring.white { border-left: 4px solid #e8ecf5; }
    .ring.yellow { border-left: 4px solid #eacb43; }
    .ring.purple { border-left: 4px solid #9e61d9; }
    .ring.black { border-left: 4px solid #3f4654; }
    .ring.red { border-left: 4px solid #e05666; }
    .ring.gold { border-left: 4px solid #efc35b; }
    .bone-grid { grid-template-columns: 1fr 1fr; }
    .bone span { display: block; color: var(--muted); font-size: .7rem; }
    .bone b { display: block; margin-top: 3px; font-size: .76rem; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel-actions button { min-height: 38px; border-radius: 6px; font-size: .82rem; }
    .journal { max-height: 180px; overflow: auto; }

    .empty { color: var(--muted); font-size: .8rem; line-height: 1.55; }
    .rule-list { margin: 0; padding-left: 1.2em; color: #c9d4e7; line-height: 1.8; font-size: .86rem; }

    .game-nav {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
      padding: 12px; border-bottom: 1px solid var(--line); background: rgba(8, 14, 29, .92);
    }
    .game-nav button { min-height: 42px; border-radius: 6px; }
    .game-nav button.active { color: #18130b; border-color: var(--gold); background: linear-gradient(145deg, var(--gold-2), #ba8b2e); font-weight: 800; }
    .world-strip { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); background: rgba(23, 33, 58, .52); }
    .world-strip span { padding: 6px 9px; border: 1px solid rgba(255,255,255,.08); background: #0b1429; color: #dce3f0; font-size: .78rem; }
    .subsection { padding: 22px; border-top: 1px solid var(--line); }
    .subsection h3 { margin: 0 0 14px; color: var(--gold-2); font-size: 1.05rem; }
    .action-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .action-card { min-height: 112px; padding: 15px; text-align: left; border-radius: 7px; }
    .action-card strong { display: block; color: var(--gold-2); }
    .action-card span { display: block; margin-top: 6px; color: var(--muted); font-size: .78rem; line-height: 1.5; }
    .map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .location-card { min-height: 140px; padding: 16px; text-align: left; border-radius: 7px; }
    .location-card.current { border-color: var(--gold); background: rgba(215,184,91,.1); }
    .location-card.locked { opacity: .45; }
    .location-card strong { display: block; color: var(--gold-2); font-size: 1rem; }
    .location-card p { margin: 7px 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }
    .npc-list { display: grid; gap: 12px; }
    .npc-card { padding: 16px; border: 1px solid var(--line); background: rgba(11, 19, 38, .85); }
    .npc-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .npc-top strong { color: var(--gold-2); font-size: 1rem; }
    .npc-top small { color: var(--muted); }
    .relation-meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 11px 0; }
    .relation-meter { padding: 7px; text-align: center; background: #0a1328; border: 1px solid rgba(255,255,255,.06); }
    .relation-meter b { display: block; color: var(--blue); }
    .relation-meter span { font-size: .68rem; color: var(--muted); }
    .dialogue { display: grid; gap: 8px; max-height: 250px; overflow: auto; padding: 12px; border-left: 3px solid var(--gold); background: rgba(215,184,91,.06); }
    .dialogue-line { line-height: 1.65; color: #e0e5ef; font-size: .88rem; }
    .dialogue-line b { color: var(--gold-2); }
    .memory-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .memory { padding: 4px 7px; border: 1px solid rgba(118,169,234,.22); color: #b9cae6; font-size: .7rem; }
    .profile-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .clickable-card { width: 100%; padding: 13px; text-align: left; border-radius: 6px; }
    .clickable-card strong { color: var(--gold-2); }
    .loot-list { display: grid; gap: 8px; }
    .loot { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); background: #0c1428; }
    .loot strong { color: var(--gold-2); }
    .loot p { margin: 5px 0 0; color: var(--muted); font-size: .78rem; }
    .loot button { min-height: 36px; padding: 0 11px; border-radius: 5px; }
    .day-cost { color: var(--blue); font-size: .74rem; }
    .combat-stage { padding: 22px; }
    .combatants { display: grid; grid-template-columns: 1fr 70px 1fr; gap: 14px; align-items: stretch; }
    .combatant { padding: 18px; border: 1px solid var(--line); background: linear-gradient(145deg, #121f3a, #0a1226); }
    .combatant.enemy { background: linear-gradient(145deg, #351b2a, #130d1b); }
    .combatant h3 { margin: 0 0 5px; color: var(--gold-2); }
    .combatant .meta { color: var(--muted); font-size: .78rem; }
    .versus { display: grid; place-items: center; color: var(--gold); font-weight: 900; }
    .meter { margin-top: 13px; }
    .meter-head { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; }
    .meter-track { height: 10px; overflow: hidden; margin-top: 5px; border: 1px solid rgba(255,255,255,.06); background: #060b17; }
    .meter-track i { display: block; height: 100%; background: linear-gradient(90deg, #b94358, #ef7b71); }
    .meter-track.soul i { background: linear-gradient(90deg, #4e7fd0, #77b8ef); }
    .combat-log { display: grid; gap: 7px; max-height: 240px; overflow: auto; margin: 15px 0; padding: 12px; border: 1px solid var(--line); background: #080f20; }
    .combat-log div { color: #d8dfed; font-size: .82rem; line-height: 1.5; }
    .combat-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .combat-actions button { min-height: 48px; border-radius: 6px; }
    .victory-box { padding: 20px; border: 1px solid rgba(215,184,91,.45); background: rgba(215,184,91,.08); }
    .relationship-grid { display: grid; gap: 13px; }
    .relationship-profile { padding: 18px; border: 1px solid var(--line); background: rgba(10,18,36,.86); }
    .bio-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 14px; margin: 13px 0; }
    .bio-grid div { padding: 9px; border: 1px solid rgba(255,255,255,.06); background: #0a1328; }
    .bio-grid span { display: block; color: var(--muted); font-size: .7rem; }
    .bio-grid b { display: block; margin-top: 3px; font-size: .8rem; line-height: 1.45; }
    .locked-action { opacity: .48; }
    .awakening-stage { min-height: 620px; display: grid; place-items: center; padding: clamp(24px, 5vw, 64px); background: radial-gradient(circle at 50% 32%, rgba(244,220,145,.17), transparent 24%), linear-gradient(155deg,#0b1429,#17112b 65%,#0a1020); }
    .awakening-card { width: min(760px,100%); padding: clamp(24px,5vw,52px); text-align: center; border: 1px solid rgba(215,184,91,.42); background: rgba(7,12,27,.9); box-shadow: 0 30px 90px rgba(0,0,0,.5); }
    .awakening-orbit { width: 150px; height: 150px; margin: 0 auto 22px; display:grid; place-items:center; border-radius:50%; border:1px solid rgba(244,220,145,.5); box-shadow:0 0 60px rgba(118,169,234,.26), inset 0 0 35px rgba(215,184,91,.14); font-size:2.6rem; animation:pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform:scale(1.04); box-shadow:0 0 85px rgba(215,184,91,.32), inset 0 0 45px rgba(118,169,234,.2); } }
    .awakening-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:20px 0; }
    .awakening-steps span { padding:10px; border:1px solid var(--line); color:var(--muted); font-size:.82rem; }
    .awakening-steps span.done { color:var(--gold-2); border-color:rgba(215,184,91,.6); background:rgba(215,184,91,.08); }
    .quality { display:inline-flex; padding:3px 8px; margin-left:6px; border-radius:999px; font-size:.72rem; border:1px solid currentColor; }
    .quality-0,.quality-1 { color:#cbd5e7; }.quality-2 { color:#72d6b7; }.quality-3 { color:#72aaf2; }.quality-4 { color:#b98af1; }.quality-5 { color:#f2c15d; }.quality-6 { color:#ff7f85; }
    .skill-drawer { margin-top:10px; padding:14px; border:1px solid rgba(118,169,234,.38); background:#080f20; }
    .skill-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .skill-option { min-height:76px; padding:12px; text-align:left; border-radius:6px; }
    .skill-option strong,.skill-option span { display:block; }.skill-option span { margin-top:5px; color:var(--muted); font-size:.75rem; line-height:1.45; }
    .skill-kind { color:var(--gold); font-size:.7rem; letter-spacing:.08em; }
    .relation-section { margin-top:18px; }.relation-section > h3 { display:flex; align-items:center; gap:8px; margin:0 0 10px; color:var(--gold-2); }
    .relation-legend { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 20px; }.relation-legend span { padding:6px 9px; border:1px solid var(--line); background:#0a1328; color:#cfd8e9; font-size:.75rem; }
    .danger-action { border-color:rgba(220,102,120,.6)!important; color:#ff9baa!important; background:rgba(116,28,45,.2)!important; }
    .world-impact { border-left:3px solid var(--red); background:rgba(220,102,120,.08); padding:14px; margin:14px 0; color:#f0cbd1; line-height:1.7; }
    .result-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }.result-card { padding:15px; border:1px solid var(--line); background:#0b1429; }.result-card b { display:block; font-size:1.35rem; color:var(--gold-2); }.result-card span { color:var(--muted); font-size:.78rem; }
    .dashboard-title { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:16px; }
    .evolution-ready { border-color:rgba(100,198,176,.55)!important; box-shadow:inset 0 0 30px rgba(100,198,176,.07); }

    const STORY_EXPANSION = {
      tc0: ["昊天宗外院把来客分成三队：宗门子弟负责封锁山道，武魂殿使者要求查验所有海岸货物，渔民则围在告示前寻找失踪亲属。石碑拓片被放在议事堂中央，边缘残留的盐晶会对高阶魂力产生规律性震动。", "唐晨没有立刻认定它是神迹。他让锻造师检查石质，又亲自询问第一名发现石碑的船工。千道流的队伍则从航线与人员名单入手，两种调查方式在当晚得出了同一个结论：有人早于他们知道海神岛坐标会出现。"],
      tc1: ["断潮崖被两股领域压成近乎真空的静区。唐晨每次挥锤都让岩层向下沉陷，千道流却以空中位移把正面力量引向海面。两人都没有攻击观战者，说明这不是死战，而是在以最直接的方式确认彼此的极限。", "海神岛使者抵达后先救渔船，再宣读岛规。这个顺序让两位绝世斗罗同时收敛魂压：在海神岛眼中，挑战者的名号并不比普通人的性命更优先。"],

      tc2: ["外海的潮汐不受月相控制，而是随海神岛中央的魂力脉动。任何未经许可的船只都会被水流送回原处。波塞西只站在礁石上便压制了两位来客的领域，她的优势不仅来自等级，更来自整片海域的回应。", "唐晨把失败理解成仍需突破的证明，千道流却从波塞西的话里听出了供奉无法继承神位的限制。三人的选择从这里分开：一个继续寻找超越，一个回到职责之中，一个留在岛上守候。"],

      th0: ["南境小城的城门连续关闭三日，理由是魂兽迁徙，守卫却只检查蓝银系武魂。唐昊当场指出命令与城主印章的笔迹不符，唐啸则先安抚排队商旅，避免冲突扩大。", "阿银留下的生命气息从城外一直延伸到药铺。她没有刻意炫耀能力，只替枯萎药草补回生机，却因此让武魂殿探子确认附近存在高阶植物系魂兽。"],
      th1: ["蓝银谷并非普通聚居地。每一株蓝银草都能把极微弱的信息传向谷心，阿银因此比任何哨兵更早知道陌生人靠近。她愿意接纳唐氏兄弟，是因为他们第一次进入时先收起武魂，没有踩断挡路的草。", "三人同行的关系并不轻松。唐昊表达感情直接，唐啸更习惯退让，阿银则拒绝被当作两人竞争的结果。她要求他们先理解化形意味着放弃漫长修为、接受人类寿命与规则，而不是只讨论保护。"],
      th2: ["武魂殿的围猎令把阿银描述成移动的十万年魂环，没有记录她在人类社会的姓名、家庭或意愿。千寻疾需要的不只是魂环，也希望借此削弱昊天宗年轻一代。", "唐啸收到的宗门急令要求他立刻回山，避免昊天宗被认定为公开庇护十万年魂兽。兄弟在驿站争执到深夜，最终不是因为感情决裂，而是各自承担了无法互换的责任。"],
      th3: ["瀑布峡谷的包围分成空中、地面与精神锁定三层。唐昊不断改变路线，仍无法同时保护阿银与襁褓中的孩子。阿银看清这一点后主动停止逃跑，把最后时间留给唐昊听完她的决定。", "献祭让魂环越过常规吸收过程与唐昊完全融合，也让他的魂力在极端悲痛中迈入封号斗罗。之后的战斗不是从容反击，而是一个刚失去挚爱的人用全部意志撕开生路。"],

      ts0: ["觉醒执事先记录武魂外形，再以水晶测试魂力。蓝银草出现时，人群迅速失去兴趣；水晶亮到极限后，执事才重新核对结果。唐三隐藏了左手的昊天锤，这个选择让他的双生武魂暂时避开武魂殿档案。", "工读生名额只能覆盖学费，住宿与日常工作仍需学生承担。杰克村长为此提前准备路费，大师则在学院门口注意到蓝银草与先天满魂力之间的矛盾。"],
      ts1: ["七舍的冲突来自工读生需要依靠实力自行维持秩序。小舞以柔技迅速取得认可，唐三则避免使用可能造成重伤的暗器。两人的信任从一次次共同承担值日与训练开始。", "大师没有因为唐三相信自己就降低要求。他要求记录每次冥想时长、魂力波动和身体反应，并用猎魂森林的真实风险检验理论。师徒关系建立在长期执行上，而不是一句拜师。"],

      ts2: ["史莱克的入学测试逐层筛选年龄、魂力与实战。规则看似简陋，实际要求考生在压力下展现判断：宁荣荣的辅助、朱竹清的速度、唐三的控制和小舞的近身能力第一次被放进同一场战斗。", "学院的资源远不如正规高级学院，弗兰德因此更依赖大斗魂场训练。团队磨合并不天然和谐，戴沐白要面对旧关系，宁荣荣要适应不以出身为中心的规则，每个人都需要为留下付出改变。"],
      ts3: ["进入星斗大森林前，大师按魂师类型分配站位，赵无极负责应对无法预测的高阶魂兽。泰坦巨猿出现时，这套阵形仍被绝对实力瞬间撕开。小舞被带走并非捕食，但她无法当众说明自己与二明的关系。", "追击途中每个人都在做不同判断：唐三愿意冒险追上，小奥准备飞行蘑菇肠，赵无极计算全队生还率。你选择跟随哪一种判断，会直接影响自己面对魂兽时的站位与伤势。"],

    Object.assign(STORY, {
      js0:{title:"星斗边缘的百万年选择",place:"星斗大森林北缘",tags:["绝世唐门","命运开端"],text:["十二岁的霍雨浩独自进入星斗大森林，只想获得第一个魂环。他尚不知道，一只无法突破瓶颈的百万年魂兽正寻找唯一的生存机会。","唐雅与贝贝在附近追查唐门旧址，他们并未预料这个谨慎、沉默又擅长烤鱼的少年会改变唐门。"],choices:[{text:"提醒霍雨浩远离异常精神波动",hint:"可能阻止天梦冰蚕与他融合。",to:"js1",effects:{mental:6,bond:3},intervention:"干预天梦冰蚕的宿主选择"},{text:"协助天梦稳定精神封印",hint:"让融合更安全，也让自己被它记住。",to:"js1",effects:{mental:10,backlash:3},intervention:"参与百万年魂兽融合"},{text:"先与唐雅、贝贝交换森林情报",hint:"从唐门线进入事件。",to:"js1",effects:{luck:4,bond:7}}]},

      js2:{title:"极北之地的第二武魂",place:"极北核心区",tags:["冰碧帝皇蝎","极北"],text:["天梦冰蚕计划为霍雨浩寻找第二武魂，目标是极北三大天王之一的冰帝。这个计划建立在说服与献祭式融合上，任何失误都会让双方精神本源崩溃。","极北魂兽并不相信人类的承诺。你可以帮助谈判，也可以把这场融合变成另一条血脉继承路线。"],choices:[{text:"协助天梦完成对冰帝的劝说",hint:"维持接近原走向的融合。",to:"js3",effects:{mental:10,physique:5}},{text:"提出共享本源而非单一宿主",hint:"可能让你分担冰帝力量并改写霍雨浩的第二武魂。",to:"js3",effects:{mental:8,backlash:8},intervention:"改写冰帝本源归属"},{text:"保护极北族群撤离人类探测区",hint:"获得魂兽阵营的长期信任。",to:"js3",effects:{bond:10,luck:5}}]},
      js3:{title:"日月交换与魂导选择",place:"明德堂",tags:["日月帝国","魂导器"],text:["史莱克与日月皇家魂导师学院开始交换学习。镜红尘把学生视为帝国技术体系的一部分，霍雨浩则尝试把唐门暗器思路写进魂导回路。","技术交流背后同时进行着情报战。你可以推动开放合作、盗取图纸，或揭露双方都在隐瞒的军用实验。"],choices:[{text:"推动唐门与明德堂建立民用合作",hint:"降低军事独占，改变唐门复兴方式。",to:"js4",effects:{mental:7,luck:7},intervention:"建立跨国民用魂导合作"},{text:"协助霍雨浩带走核心图纸",hint:"强化唐门，但会提高日月帝国敌意。",to:"js4",effects:{agility:7,backlash:4}},{text:"公开双方秘密实验名单",hint:"保护实验对象，也可能让交换计划提前终止。",to:"js4",effects:{bond:9,mental:5},intervention:"公开魂导人体实验"}]},
      js4:{title:"唐门复兴与战争岔路",place:"重建唐门",tags:["最终结果","大陆战争"],text:["唐门已经重新拥有弟子、魂导技术与史莱克支持，但日月帝国的扩张也进入不可逆阶段。霍雨浩必须决定自己首先是史莱克学生、唐门成员，还是能够跨越国界阻止战争的人。","此前对冰帝、明德堂和学院资源的干预，将决定唐门是成为军工势力、民用技术组织，还是连接人类与魂兽的新平台。"],choices:[{text:"把唐门建成跨国救援与魂导学院",hint:"削弱战争动员，保留各方技术交流。",ending:"绝世唐门结局：开放唐门",effects:{mental:10,bond:12},intervention:"将唐门转为开放学院"},{text:"协助史莱克正面阻止日月扩张",hint:"进入战争线，以武力保卫大陆秩序。",ending:"绝世唐门结局：史莱克守望者",effects:{strength:10,defense:10}},{text:"与魂兽阵营共同建立中立区",hint:"让极北与星斗拥有正式谈判席位。",ending:"绝世唐门结局：万灵盟约",effects:{bond:15,luck:7},intervention:"建立人类魂兽中立区"}]},
      lw0:{title:"傲来城的蓝银草",place:"傲来城红山学院",tags:["龙王传说","武魂觉醒"],text:["唐舞麟六岁时觉醒蓝银草，先天魂力只有三级。在这个魂灵与魂导科技成熟的时代，低魂力意味着几乎没有学院愿意投入资源。","他还不知道身体里的金龙王封印。你可以改变他获得第一只魂灵、进入锻造行业以及与娜儿相遇的方式。"],choices:[{text:"资助唐舞麟购买更稳定的魂灵",hint:"改变金光成为第一魂灵的可能。",to:"lw1",effects:{luck:5,bond:7},intervention:"改变唐舞麟第一魂灵"},{text:"引导他先学习锻造再获取魂灵",hint:"强化经济与身体基础。",to:"lw1",effects:{strength:8,physique:6}},{text:"调查娜儿失忆与银色鳞片",hint:"提前触碰魂兽之王的秘密。",to:"lw1",effects:{mental:8,backlash:3},intervention:"提前追查娜儿身份"}]},
      lw1:{title:"东海学院零班",place:"东海学院",tags:["零班","团队磨合"],text:["舞长空把唐舞麟、古月、谢邂编入零班。古月展现多元素控制，却对传灵塔与魂兽问题保持异常谨慎。","零班的目标不是赢一次比赛，而是验证一套极端高压的培养方案。你可以加入、拆分，或把许小言提前纳入队伍。"],choices:[{text:"加入零班补足团队缺口",hint:"改变升灵台与团队赛阵容。",to:"lw2",effects:{agility:6,bond:8}},{text:"提前邀请许小言并重排控制链",hint:"让星轮冰杖更早进入核心战术。",to:"lw2",effects:{mental:6,luck:5},intervention:"提前重组零班"},{text:"质疑高压训练并提交伤情证据",hint:"降低训练风险，但可能失去资源。",to:"lw2",effects:{defense:6,bond:5}}]},
      lw2:{title:"升灵台中的魂兽真相",place:"传灵塔升灵台",tags:["魂灵体系","传灵塔"],text:["升灵台以模拟魂兽提供魂环成长机会，但古月察觉其中保存着真实魂兽本源的痕迹。传灵塔把这视为维持魂师体系的必要代价。","你可以帮助零班获取资源、公开本源记录，或加入传灵塔从内部改变规则。"],choices:[{text:"公开升灵台的本源消耗记录",hint:"引发魂师与传灵塔的制度冲突。",to:"lw3",effects:{mental:8,bond:7},intervention:"公开升灵台本源记录"},{text:"加入传灵塔调查魂灵制造流程",hint:"获得内部权限，也承担阵营约束。",to:"lw3",effects:{luck:7,mental:5}},{text:"帮助古月转移残存魂兽意识",hint:"直接增强魂兽阵营。",to:"lw3",effects:{bond:12,backlash:5},intervention:"转移升灵台魂兽意识"}]},
      lw3:{title:"史莱克城的多方邀请",place:"史莱克城",tags:["史莱克学院","势力选择"],text:["唐舞麟一行抵达史莱克城后，学院、唐门、传灵塔与联邦分别提出不同道路。每个组织都需要他们的天赋，也都有不愿公开的代价。","你所属的势力与声望将改变可调用的援助、人物态度和下一场危机中的站位。"],choices:[{text:"推动史莱克与传灵塔公开谈判",hint:"阻止双方继续以学生为代理人竞争。",to:"lw4",effects:{charm:8,mental:6},intervention:"促成史莱克传灵塔公开谈判"},{text:"加入唐门追查金龙血脉资料",hint:"让唐舞麟更早理解封印。",to:"lw4",effects:{strength:7,mental:6}},{text:"向联邦提交多方垄断证据",hint:"引入监管，也可能扩大政治干预。",to:"lw4",effects:{luck:6,bond:5},intervention:"引入联邦监管"}]},
      lw4:{title:"龙王血脉与人兽未来",place:"史莱克海神湖",tags:["最终结果","龙王之争"],text:["金龙王血脉逐层解封，古月背后的银龙王使命也无法继续隐藏。人类依赖魂灵体系，魂兽却已经接近种族终点。","你的证据、势力与关系将决定冲突是走向全面战争、制度重建，还是由某一方取得压倒性控制。"],choices:[{text:"建立人类与魂兽共同管理的魂灵体系",hint:"废除传灵塔对本源的单方控制。",ending:"龙王传说结局：共生魂灵议会",effects:{bond:15,charm:8},intervention:"建立共生魂灵议会"},{text:"协助唐舞麟压制两大龙王意志",hint:"以个人力量维持暂时和平。",ending:"龙王传说结局：龙皇守界人",effects:{strength:12,mental:10}},{text:"支持古月重建魂兽领地",hint:"迫使人类让出资源区，历史彻底偏离。",ending:"龙王传说结局：银龙新约",effects:{bond:14,backlash:6},intervention:"支持魂兽重建领地"}]}
    });

    Object.assign(WORLD, {
      jueshi:{date:{year:12637,month:3,day:2},startLocation:"star_north",locations:[{id:"star_north",name:"星斗大森林北缘",desc:"霍雨浩第一次独自猎魂的区域。",days:1,hunting:true},{id:"shrek_ii",name:"史莱克学院",desc:"武魂系与魂导系并立的大陆第一学院。",days:6,unlockNode:"js1"},{id:"extreme_north",name:"极北之地",desc:"冰雪魂兽领地，环境本身就是致命威胁。",days:14,hunting:true,unlockNode:"js2"},{id:"sunmoon_city",name:"明都",desc:"日月帝国魂导科技核心与明德堂所在地。",days:18,unlockNode:"js3"},{id:"tang_gate_ii",name:"重建唐门",desc:"规模尚小，但正在聚集暗器与魂导人才。",days:5,unlockNode:"js4"},{id:"body_valley",name:"本体宗隐谷",desc:"本体武魂魂师的隐秘宗门。",days:12,hunting:true,unlockNode:"js2"}]},
      longwang:{date:{year:22637,month:8,day:15},startLocation:"aolai",locations:[{id:"aolai",name:"傲来城",desc:"唐舞麟觉醒蓝银草并开始学习锻造。",days:1},{id:"eastsea",name:"东海学院",desc:"舞长空组建零班的海滨学院。",days:8,unlockNode:"lw1"},{id:"spirit_tower",name:"传灵塔分部",desc:"魂灵购买、升灵台和本源研究集中地。",days:4,hunting:true,unlockNode:"lw2"},{id:"shrek_iii",name:"史莱克城",desc:"学院、唐门与大陆各方势力的交汇点。",days:15,unlockNode:"lw3"},{id:"sea_lake",name:"海神湖",desc:"史莱克核心区域，龙王血脉在此引发共鸣。",days:3,unlockNode:"lw4"},{id:"soulbeast_refuge",name:"魂兽隐秘栖地",desc:"濒危魂兽与古月阵营秘密保存的本源区。",days:12,hunting:true,unlockNode:"lw2"}]}
    });

    NPC_TEMPLATES.jueshi=[
      {id:"huoyuhao",name:"霍雨浩",role:"灵眸少年魂师",locations:["star_north","shrek_ii","extreme_north","sunmoon_city","tang_gate_ii"],unlock:"js0",dialogue:{greet:[["他先确认你没有靠近烤鱼架上的魂导储物袋，才稍稍放松。","你好。如果你也进森林，最好别一个人走太深。"]],ask:[["他指尖轻触眉心，精神探测只展开到不会冒犯你的范围。","我看到的比别人多，所以更要分清什么该说、什么不该替别人决定。"]],confide:[["他看着火堆，许久才开口。","我想变强不是为了让谁后悔。我只是再也不想在重要的人受伤时什么都做不了。"]],spar:[["共享精神探测在你脑中展开，路线与距离瞬间清晰。","别只追着目标。先看整个战场。"]]}},
      {id:"wangdong",name:"王冬",role:"史莱克新生",locations:["shrek_ii","extreme_north","tang_gate_ii"],unlock:"js1",dialogue:{greet:[["少年模样的她抬了抬下巴，语气骄傲，目光却没有恶意。","先说好，我不喜欢别人随便碰我的东西。"]],ask:[["光明女神蝶翼在身后短暂舒展。","漂亮不代表脆弱。你要是只盯着翅膀看，第一击就会漏掉。"]],confide:[["她背过身整理袖口，声音比平时轻。","有些身份不是不想说，是说出来以后，连现在这种相处都会变得不一样。"]],spar:[["蓝金蝶翼掠过你的视野，她在落地前收住魂力。","反应还行。下一次我不会从正面来。"]]}},
      {id:"tangya_ii",name:"唐雅",role:"式微唐门门主",locations:["star_north","shrek_ii","tang_gate_ii"],unlock:"js0",dialogue:{greet:[["她把唐门令牌收回掌心，笑容明快却藏着疲惫。","想加入唐门可以，先别被这个只剩几个人的名字吓跑。"]],ask:[["她展开残缺名册。","唐门不是只剩暗器。只要还有人愿意记得它为什么存在，就没有真正断掉。"]],confide:[["她用力按住名册卷角。","我最怕的不是招不到弟子，是有一天连我也开始相信它不值得重建。"]],spar:[["蓝银草沿地面悄然绕到你身后。","门主也得会偷袭。唐门从来不只打正面。"]]}},
      {id:"beibei_ii",name:"贝贝",role:"史莱克学员、唐门大师兄",locations:["star_north","shrek_ii","tang_gate_ii"],unlock:"js0",dialogue:{greet:[["他温和地点头，却先观察你的站位与手。","小雅愿意相信你，我会尊重她的判断；但安全上的问题，我会自己确认。"]],ask:[["蓝电霸王龙魂力在指节间收敛。","温和不是没有原则。真正需要出手时，犹豫会让同伴替你承受。"]],confide:[["他望向唐雅离开的方向。","我能陪她重建唐门，却不能替她决定该如何面对过去。"]],spar:[["雷光在触及你前偏开半尺。","你预判了力量，却没有预判我会为了队友改变落点。"]]}},
      {id:"jinghongchen",name:"镜红尘",role:"明德堂堂主",locations:["sunmoon_city"],unlock:"js3",dialogue:{greet:[["他从魂导镜片后审视你，笑意礼貌而疏离。","交换生可以问问题，至于答案值多少，要看你能提供什么。"]],ask:[["他敲了敲九级魂导器外壳。","个人天赋决定上限，工业体系决定一个国家能把多少人送到上限附近。"]],confide:[["他收起笑，目光停在明德堂深处。","我保护的从来不只是技术，也是日月帝国不再被旧魂师体系轻视的资格。"]],spar:[["数层魂导护罩依次亮起。","先找能源回路。只攻击最亮的地方，是初学者的习惯。"]]}},
      {id:"xuening",name:"雪宁",role:"极北边境向导",locations:["extreme_north","body_valley"],unlock:"js2",dialogue:{greet:[["她把护目镜推高，睫毛上结着细霜。","脚印往回走不代表安全，有些魂兽会故意这样引人。"]],ask:[["她摊开用兽皮绘制的风向图。","极北没有永远正确的路，只有此刻还能回头的路。"]],confide:[["她望着白茫茫的地平线。","我带出去过很多猎魂者，却很少有人记得这里原本是谁的家。"]],spar:[["冰面在你脚下裂开一道浅缝。","先学会听冰，再谈追踪。"]]}}
    ];
    NPC_TEMPLATES.longwang=[
      {id:"tangwulin",name:"唐舞麟",role:"蓝银草少年魂师",locations:["aolai","eastsea","spirit_tower","shrek_iii","sea_lake"],unlock:"lw0",dialogue:{greet:[["他放下锻造锤，先擦净手上的金属粉末。","你好。等我把这一锤打完，不然这块沉银会废掉。"]],ask:[["他看着掌心细弱的蓝银草。","三级魂力确实很低，但低不代表今天做的训练没有意义。"]],confide:[["他下意识按住胸口，像在压下某种灼热。","我有时候会梦见金色的东西撞击封印。我不知道那是不是我。"]],spar:[["他没有急着释放武魂，而是用锻造练出的力量稳住下盘。","我魂力不高，所以不能浪费每一次接触。"]]}},
      {id:"naer",name:"娜儿",role:"失忆的银发女孩",locations:["aolai","sea_lake","soulbeast_refuge"],unlock:"lw0",dialogue:{greet:[["银发女孩先看向唐舞麟所在的方向，确认安全后才对你点头。","哥哥说可以相信你一点。但只是一点。"]],ask:[["她指尖浮现一瞬银光，自己也怔了怔。","我不记得它从哪里来。可它好像认识很多我没见过的地方。"]],confide:[["她抱紧膝盖，紫色眼眸安静地看着你。","如果记起来以后，我不是现在这个娜儿，你还会用现在的名字叫我吗？"]],spar:[["空间在你身侧轻轻折叠，她却没有继续攻击。","我不喜欢伤人。可有人要带走哥哥时，我会动手。"]]}},
      {id:"gu_yue",name:"古月",role:"多元素控制系学员",locations:["eastsea","spirit_tower","shrek_iii","sea_lake","soulbeast_refuge"],unlock:"lw1",dialogue:{greet:[["她的视线在你与周围环境间迅速移动。","有事就直说。反复试探只会浪费彼此时间。"]],ask:[["六种元素在她指间依次闪过。","人类把无法解释的力量都叫天赋，却很少问它原本属于谁。"]],confide:[["她沉默很久，眼神第一次出现明显动摇。","如果一个人的使命要求她伤害最不想伤害的人，放弃使命算背叛，还是终于诚实？"]],spar:[["风与土同时改变你的重心，火光却只停在衣角外。","元素不是六种技能，是一个完整环境。"]]}},
      {id:"xiexie",name:"谢邂",role:"双生敏攻系学员",locations:["eastsea","spirit_tower","shrek_iii"],unlock:"lw1",dialogue:{greet:[["他转着光龙匕，故作随意地挑眉。","新来的？先别急着问名字，能跟上再说。"]],ask:[["他把两柄匕首交错在胸前。","双生武魂不等于两倍优势。控制不好节奏，只会两边都露破绽。"]],confide:[["他收起玩笑神色。","大家都觉得我什么都不在乎。其实是因为认真以后，输掉会更难看。"]],spar:[["两道残影一前一后逼近。","猜错了。第一把匕首只是让你看向它。"]]}},
      {id:"wuchangkong",name:"舞长空",role:"东海学院零班教师",locations:["eastsea","spirit_tower","shrek_iii"],unlock:"lw1",dialogue:{greet:[["白衣教师停下脚步，冰冷目光先落在你的呼吸节奏上。","迟到没有解释价值。归队。"]],ask:[["他握住天霜剑，却没有出鞘。","天赋决定你能学多快，纪律决定你在真正危险时还能不能做到。"]],confide:[["他望向远处，声音仍冷。","有些人离开以后，继续教学生是我唯一知道该怎么做的事。"]],spar:[["寒意只压住你脚边一寸。","你有三次机会找出我为何没有封住你的右手。"]]}},

    const $ = (selector) => document.querySelector(selector);
    const clamp = (value, min = 0, max = 100) => Math.max(min, Math.min(max, value));
    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const pick = (array) => array[Math.floor(Math.random() * array.length)];
    const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);

    function uniquePicks(array, count) {
      const pool = [...array];
      const result = [];
      while (result.length < count && pool.length) result.push(pool.splice(randomInt(0, pool.length - 1), 1)[0]);
      return result;
    }

    function rollCultivationYears() {
      const roll = Math.random();
      if (roll < .03) return randomInt(100000, 180000);
      if (roll < .15) return randomInt(10000, 60000);
      if (roll < .5) return randomInt(1000, 9999);
      return randomInt(80, 999);
    }

    function emptyBones() {
      return Object.fromEntries(BONE_SLOTS.map((slot) => [slot, null]));
    }

    function generateCharacter(species) {
      const isHuman = species === "human";
      const spiritCountRoll = Math.random();
      const spiritCount = isHuman ? (spiritCountRoll < .01 ? 3 : spiritCountRoll < .08 ? 2 : 1) : 1;
      const spirits = isHuman ? uniquePicks(SPIRITS, spiritCount) : [pick(BEASTS)];
      const hasSpecial = spirits.some((spirit) => spirit.special);
      const innate = isHuman ? (spiritCount > 1 ? 10 : hasSpecial && Math.random() < .28 ? randomInt(11, 16) : randomInt(1, 10)) : null;
      const cultivationYears = isHuman ? null : rollCultivationYears();
      const level = isHuman ? innate : clamp(Math.floor(Math.log10(cultivationYears) * 15), 10, 95);
      const stats = {
        strength: randomInt(12, 55),
        physique: randomInt(15, 58),
        defense: randomInt(10, 55),
        agility: randomInt(12, 58),
        luck: randomInt(1, 100)
      };
      const mental = randomInt(20, 68);
      const maxHp = 100 + stats.physique * 5 + level * 4;
      const maxSoul = 40 + mental * 2 + level * 2;
      return {
        name: pick(isHuman ? HUMAN_NAMES : BEAST_NAMES),
        gender: pick(GENDERS),
        age: isHuman ? 6 : randomInt(8, 600),
        innatePower: innate,
        level,
        mental,
        spirits,
        rings: [],
        bones: emptyBones(),
        soulDevice: isHuman ? pick(DEVICES) : (Math.random() < .18 ? "缴获的储物魂导器" : "无（魂兽本体）"),
        identities: [isHuman ? "人类" : "魂兽", pick(isHuman ? HUMAN_ORIGINS : BEAST_ORIGINS)],
        stats,
        cultivationYears,
        title: "",
        godhood: false,
        maxHp,
        hp: maxHp,
        maxSoul,
        soul: maxSoul
      };
    }

      $("#enterBtn").onclick = () => { state.screen = "species"; render(); };
    }

    function renderSpecies() {
      $("#main").innerHTML = `
        <section class="stage">
          <div class="section-head"><div><div class="step">第一步 / 角色本源</div><h2>选择你的生命形态</h2><p>人类与魂兽遵循不同的成长规则，确认后仍可在个人面板重新随机。</p></div></div>
          <div class="card-grid">
            <button class="select-card" data-species="human">
              <strong>人类</strong>
              <p>六岁觉醒武魂与先天魂力。魂力每到十级瓶颈，必须成功吸收一个魂环才能继续升级。</p>
              <ul><li>概率觉醒双生或三生武魂</li><li>多武魂必定先天满魂力</li><li>九十级可自立封号，百级成神</li></ul>
            </button>
            <button class="select-card" data-species="beast">
              <strong>魂兽</strong>
              <p>以种族本源和修为年限成长，不需要猎取人类魂环；精神与体质仍决定融合外来魂骨的承受力。</p>
              <ul><li>随机魂兽种族与修为年限</li><li>本源可在化形后作为武魂</li><li>更容易进入魂兽视角支线</li></ul>
            </button>
          </div>
        </section>`;
      document.querySelectorAll("[data-species]").forEach((button) => button.onclick = () => chooseSpecies(button.dataset.species));
    }

    function chooseSpecies(species) {
      state.species = species;
      state.character = generateCharacter(species);
      state.bond = randomInt(12, 38);
      state.journal = [`选择生命形态：${species === "human" ? "人类" : "魂兽"}。`, "个人属性已随机生成。"];

      render();

      $("#main").innerHTML = `

          <div class="profile-editor">

              <dl class="fact-list">
